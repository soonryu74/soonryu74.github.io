<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 | 아트셀라</title>
<meta name="description" content="아트셀라 작품 상세 — 크기, 재료, 작가의 말, 소장 문의.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  .crumb{font-size:.86rem;color:var(--ink-2);padding:20px 0 0}
  .crumb a{text-decoration:none}
  .zoom{margin-top:10px;font-size:.86rem;color:var(--ink-2);background:none;border:0;cursor:pointer;text-decoration:underline}
  dialog.lightbox{border:0;padding:0;background:#141210;max-width:96vw;max-height:96vh}
  dialog.lightbox::backdrop{background:rgba(20,18,16,.92)}
  dialog.lightbox .inner{padding:18px}
  dialog.lightbox svg,dialog.lightbox img{max-height:84vh;width:auto;max-width:92vw;display:block;margin:0 auto}
  dialog.lightbox .cap{color:#cfc7bc;font-size:.86rem;text-align:center;margin-top:12px}
  .taglist{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
  .contact-box{border:1px solid var(--line);background:#fff;padding:18px;margin-top:22px}
  .contact-box textarea{width:100%;min-height:96px;border:1px solid var(--line);padding:10px;font:inherit;font-size:.92rem;margin-top:8px}
</style>
</head>
<body>

<div class="wrap crumb" id="crumb"></div>
<main class="wrap detail" id="detail"></main>

<section class="band"><div class="wrap">
  <h2 class="sec" id="moreTitle">같은 작가의 다른 작품</h2>
  <p class="sec-sub"></p>
  <div class="grid" id="more"></div>
</div></section>

<dialog class="lightbox" id="lb"><div class="inner" id="lbInner"></div></dialog>

<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script>
ART.chrome('gallery.html');
Promise.all([ART.load(), fetch('data/site.json').then(r => r.json())]).then(([d, site]) => {
  const w = d.byWork[ART.param('id')] || d.works[0];
  const a = d.byArtist[w.artist];
  document.title = `${w.title} — ${a.name} | 아트셀라`;

  document.getElementById('crumb').innerHTML =
    `<a href="gallery.html">작품</a> › <a href="artist.html?id=${a.id}">${a.name}</a> › ${w.title}`;

  const vis = ART.visual(w, a);
  document.getElementById('detail').innerHTML = `
    <div>
      <div class="stage"><div class="canvas">${vis}</div></div>
      <button class="zoom" id="zoomBtn">크게 보기</button>
      ${w.image ? '' : '<p class="placeholder-note">※ 이 그림은 실제 사진을 넣기 전의 자리그림입니다.</p>'}
    </div>
    <div>
      <span class="kicker">${a.genre}</span>
      <h1 class="title" style="font-size:1.9rem">${w.title} ${ART.statusBadge(w)}</h1>
      <p class="lead"><a href="artist.html?id=${a.id}" style="text-decoration:none;border-bottom:1px solid var(--line)">${a.name}</a> · ${a.base}</p>

      <table class="spec">
        <tr><th>제작</th><td>${w.year}년</td></tr>
        <tr><th>재료</th><td>${w.medium}</td></tr>
        <tr><th>크기</th><td>${w.size}</td></tr>
        <tr><th>상태</th><td>${w.status}</td></tr>
      </table>

      <div class="price">${ART.priceLabel(w)}</div>
      <p style="font-size:.85rem;color:var(--ink-2);margin:.2em 0 0">액자·운송비 별도 · 실물 확인 후 결정하실 수 있습니다</p>

      <div class="note">${w.note}</div>

      <div class="taglist">${w.tags.map(t => `<span class="badge">#${t}</span>`).join('')}</div>

      <div class="contact-box">
        <strong>이 작품 문의하기</strong>
        <p style="font-size:.9rem;color:var(--ink-2);margin:.4em 0 0">아래 내용을 그대로 보내시면 됩니다. 메일 앱이 없으면 「복사」를 눌러 붙여 넣어 주세요.</p>
        <textarea id="msg" readonly></textarea>
        <p style="margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap">
          <a class="btn" id="mailBtn" href="#">메일로 문의</a>
          <button class="btn ghost" id="copyBtn">내용 복사</button>
        </p>
      </div>
    </div>`;

  const body = `[아트셀라 작품 문의]\n작품: ${w.title} (${w.id})\n작가: ${a.name}\n크기: ${w.size}\n재료: ${w.medium}\n가격: ${ART.priceLabel(w)}\n\n문의 내용:\n`;
  document.getElementById('msg').value = body;
  document.getElementById('mailBtn').href =
    `mailto:${site.contactEmail}?subject=${encodeURIComponent('[작품 문의] ' + w.title + ' — ' + a.name)}&body=${encodeURIComponent(body)}`;
  document.getElementById('copyBtn').addEventListener('click', async e => {
    try { await navigator.clipboard.writeText(body); e.target.textContent = '복사했습니다'; }
    catch { document.getElementById('msg').select(); e.target.textContent = '직접 복사해 주세요'; }
    setTimeout(() => { e.target.textContent = '내용 복사'; }, 2200);
  });

  const lb = document.getElementById('lb');
  document.getElementById('zoomBtn').addEventListener('click', () => {
    document.getElementById('lbInner').innerHTML =
      vis + `<div class="cap">${a.name}, 「${w.title}」, ${w.year}, ${w.medium}, ${w.size}</div>`;
    lb.showModal();
  });
  lb.addEventListener('click', () => lb.close());

  const others = d.works.filter(x => x.artist === a.id && x.id !== w.id);
  const list = others.length ? others : d.works.filter(x => x.id !== w.id).slice(0, 4);
  document.getElementById('moreTitle').textContent =
    others.length ? `${a.name}의 다른 작품` : '함께 보면 좋은 작품';
  document.getElementById('more').innerHTML =
    list.map(x => ART.card(x, d.byArtist[x.artist])).join('');
});
</script>
</body>
</html>
