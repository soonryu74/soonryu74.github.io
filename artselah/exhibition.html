<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전시 | 아트셀라</title>
<meta name="description" content="아트셀라의 진행 중·예정·지난 전시. 전시실에 들어가 한 점씩 걸어 보며 관람할 수 있습니다.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  .poster{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
  .poster .canvas{aspect-ratio:1/1;overflow:hidden;display:block}
  .poster .canvas svg,.poster .canvas img{width:100%;height:100%;object-fit:cover}
  .poster .txt{padding:30px}
  .poster h2{font-family:"Gowun Batang",serif;font-size:1.9rem;margin:6px 0 6px;letter-spacing:-.02em}
  @media (max-width:860px){ .poster{grid-template-columns:1fr} .poster .txt{padding:20px} }
</style>
</head>
<body>

<div class="page-head"><div class="wrap">
  <span class="kicker">Exhibitions</span>
  <h1 class="title" id="h1">전시</h1>
  <p class="lead" id="lead">전시실에 들어가면 작품을 한 점씩 걸어 보며 관람할 수 있습니다. 지난 전시도 그대로 남겨 둡니다.</p>
</div></div>

<div class="wrap" id="body"></div>
<div style="height:60px"></div>

<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script>
ART.chrome('exhibition.html');
ART.load().then(d => {
  const id = ART.param('id');
  const el = document.getElementById('body');

  if (id && d.exhibitions.some(e => e.id === id)) {
    const e = d.exhibitions.find(x => x.id === id);
    const first = d.byWork[e.works[0]];
    document.title = `${e.title} | 아트셀라`;
    document.getElementById('h1').textContent = e.title;
    document.getElementById('lead').textContent = `${e.subtitle} · ${ART.period(e)} · ${e.place}`;
    el.innerHTML = `
      <div style="padding:34px 0">
        <div class="poster">
          <span class="canvas">${ART.visual(first, d.byArtist[first.artist])}</span>
          <div class="txt">
            <span class="badge ${e.status === '진행중' ? 'on' : ''}">${e.status}</span>
            <h2>${e.title}</h2>
            <p style="color:var(--ink-2);margin:0 0 14px">${e.subtitle} · ${ART.period(e)} · ${e.place}</p>
            <p>${e.intro}</p>
            <p style="font-size:.9rem;color:var(--ink-2)">기획 ${e.curator} · 출품 ${e.works.length}점</p>
            <p style="margin-top:18px"><a class="btn" href="room.html?id=${e.id}">전시실 들어가기</a></p>
          </div>
        </div>
      </div>
      <h2 class="sec">출품작</h2>
      <p class="sec-sub">걸린 순서대로입니다.</p>
      <div class="grid">${e.works.map(w =>
        ART.card(d.byWork[w], d.byArtist[d.byWork[w].artist])).join('')}</div>
      <p style="margin-top:34px"><a href="exhibition.html">← 전시 목록</a></p>`;
    return;
  }

  const order = { '진행중': 0, '예정': 1, '종료': 2 };
  const list = [...d.exhibitions].sort((a, b) => order[a.status] - order[b.status] || b.from.localeCompare(a.from));
  el.innerHTML = `<div class="exh-list" style="padding:30px 0">${list.map(e => {
    const w = d.byWork[e.works[0]];
    return `<a class="exh" href="exhibition.html?id=${e.id}">
      <span style="display:block;border:1px solid var(--line);background:#fff;aspect-ratio:1/1;overflow:hidden">${ART.visual(w, d.byArtist[w.artist])}</span>
      <span>
        <span class="badge ${e.status === '진행중' ? 'on' : ''}">${e.status}</span>
        <h3 class="tt" style="margin-top:8px">${e.title}</h3>
        <span class="when">${e.subtitle} · ${ART.period(e)} · ${e.place}</span>
        <p style="color:var(--ink-2);margin:.6em 0 0">${e.intro}</p>
        <span style="font-size:.88rem;color:var(--gold)">출품 ${e.works.length}점 · 전시실 들어가기 →</span>
      </span></a>`;
  }).join('')}</div>`;
});
</script>
</body>
</html>
