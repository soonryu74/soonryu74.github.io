<!DOCTYPE html>
<html>
<head>
    <title>Soonryu's Blog</title>
    <meta charset="UTF-8">
<style>
    body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        background-color: #f9f9f9;
        color: #333;
        padding: 20px;
    }
    h1 {
        color: #007BFF;
    }
    ul {
        list-style-type: square;
        padding-left: 20px;
    }
    li {
        margin: 10px 0;
    }
    /* Image support styles */
    img {
        max-width: 100%;
        height: auto;
        display: block;
    }
    .post-image {
        margin: 20px 0;
        text-align: center;
    }
    .post-image img {
        max-width: 800px;
        width: 100%;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin: 0 auto;
    }
    .post-image figcaption {
        margin-top: 8px;
        font-size: 0.9em;
        color: #666;
        font-style: italic;
    }
    .image-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 20px 0;
    }
    .image-gallery img {
        width: calc(50% - 6px);
        object-fit: cover;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    @media (max-width: 600px) {
        .image-gallery img {
            width: 100%;
        }
    }
</style>
</head>
<body>
    <h1>Welcome to Soonryu's Blog!</h1>
    <p>This is a simple GitHub Pages site.</p>
    <p>Here are some updates:</p>
    <ul>
        <li>📚 Learning AI</li>
        <li>🎨 Exploring creative projects</li>
        <li>🌟 Sharing knowledge</li>
    </ul>

</body>
</html>
