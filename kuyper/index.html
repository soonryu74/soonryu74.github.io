const V=a=>new THREE.Vector3(...a), ease=u=>u*u*(3-2*u), Y=new THREE.Vector3(0,1,0);
const camP=V(STOPS[0].p), camT=V(STOPS[0].t);

const posed=(i,u)=>{ const p=V(STOPS[i].p), t=V(STOPS[i].t); return {p:p.lerp(t,.05*u), t}; };
const MOVE=2.8;
function timeline(){ let t=0; return STOPS.map((s,i)=>{ const len=s[lang][1].length, d=Math.max(6, len/(lang==='ko'?14:23)+2), mv=i?MOVE:0;
  const seg={start:t,mv,d}; t+=mv+d; return seg; }); }
function tourTotal(){ const tl=timeline(), l=tl[N-1]; return l.start+l.mv+l.d; }
function setCaption(i,op){ const c=document.getElementById('cap');
  if(i!==capShown){ capShown=i; const s=STOPS[i][lang];
    document.getElementById('capn').textContent=String(i+1).padStart(2,'0')+' / '+N;
    document.getElementById('capt').textContent=s[0]; document.getElementById('capb').textContent=s[1]; }
  c.style.opacity=op; }
function seek(t){ const tl=timeline(); let i=N-1; for(let k=0;k<N;k++){ if(t<tl[k].start+tl[k].mv+tl[k].d){i=k;break;} }
  const s=tl[i], lt=Math.min(t-s.start, s.mv+s.d);
  if(lt<s.mv){ const a=posed(i-1,1), b=posed(i,0), u=ease(lt/s.mv); camP.lerpVectors(a.p,b.p,u); camT.lerpVectors(a.t,b.t,u);
    if(lt<.5) setCaption(i-1,1-lt/.5); else if(lt>s.mv-.7) setCaption(i,(lt-(s.mv-.7))/.7); else setCaption(capShown<0?i:capShown,0);
  } else { const a=posed(i,(lt-s.mv)/s.d); camP.copy(a.p); camT.copy(a.t); setCaption(i,1); }
  idx=i; document.getElementById('bar').style.width=(100*t/tourTotal())+'%'; }
function goTo(i){ touring=false; idx=(i+N)%N; anim={fp:camP.clone(),ft:camT.clone(),fy:yaw,fpt:pitch,t0:performance.now(),dur:1900};
  setCaption(idx,1); syncUI(); }
function syncUI(){ const u=UI[lang]; document.documentElement.lang=lang;
  document.getElementById('sub').textContent=u.sub; document.getElementById('note').innerText=u.note;
  document.getElementById('tour').textContent=touring?u.stop:u.tour;
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  if(!touring) document.getElementById('bar').style.width=(100*idx/(N-1))+'%'; }
function setLang(l){ lang=l; capShown=-1; redraw.forEach(f=>f()); setCaption(idx,1);
  if(touring){ const tl=timeline(); tourT0=performance.now()-tl[idx].start*1000-tl[idx].mv*1000; } syncUI(); }
function toggleTour(){ if(touring){ goTo(idx); return; } touring=true; anim=null; yaw=pitch=0; tourT0=performance.now(); syncUI(); }

function render(){ camera.position.copy(camP); camera.lookAt(camT); camera.rotateOnWorldAxis(Y,yaw); camera.rotateX(pitch); renderer.render(scene,camera); }
function frame(now){ requestAnimationFrame(frame); if(capturing) return;
  if(touring){ const t=(now-tourT0)/1000; if(t>=tourTotal()){ touring=false; seek(tourTotal()); syncUI(); } else seek(t); }
  else if(anim){ const u=ease(Math.min(1,(now-anim.t0)/anim.dur)), b=posed(idx,0);
    camP.lerpVectors(anim.fp,b.p,u); camT.lerpVectors(anim.ft,b.t,u); yaw=anim.fy*(1-u); pitch=anim.fpt*(1-u); if(u>=1) anim=null; }
  render(); }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov=w/h<.8?74:w/h<1.3?60:50; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* ───────── 입력 ───────── */
let down=null; const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,moved:0}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; down.x=e.clientX; down.y=e.clientY;
  down.moved+=Math.abs(dx)+Math.abs(dy); if(touring||down.moved<5) return; anim=null;
  yaw+=dx*.0032; pitch=Math.max(-.6,Math.min(.6,pitch+dy*.0026)); });
canvas.addEventListener('pointerup',e=>{ canvas.classList.remove('drag'); if(down&&down.moved<5){
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(clickable)[0]; if(hit) goTo(hit.object.userData.stop); } down=null; });
document.getElementById('prev').onclick=()=>goTo(idx-1); document.getElementById('next').onclick=()=>goTo(idx+1);
document.getElementById('tour').onclick=toggleTour;
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') goTo(idx+1); else if(e.key==='ArrowLeft') goTo(idx-1);
  else if(e.key===' '){ e.preventDefault(); toggleTour(); } else if(e.key.toLowerCase()==='h') document.body.classList.toggle('clean'); });

/* ───────── 시작 ───────── */
const all=STOPS.map(s=>['ko','en','nl'].map(l=>s[l].join(' ')).join(' ')).join(' ')+Object.values(KING).join(' ')+'카이퍼의 길 아브라함 부조 동판 기증: 얀 페터르 발케넨더 전 네덜란드 총리 0123456789';
const fonts=['700 40px "Noto Serif KR"','500 40px "Noto Serif KR"','400 30px "Noto Sans KR"','500 40px "Cormorant Garamond"','600 40px "Cormorant Garamond"','700 40px "Cormorant Garamond"','italic 600 40px "Cormorant Garamond"'];
await Promise.race([Promise.all(fonts.map(f=>document.fonts.load(f,all))).catch(()=>{}), new Promise(r=>setTimeout(r,6000))]);
resize(); redraw.forEach(f=>f()); setCaption(0,1); syncUI(); render(); renderer.shadowMap.autoUpdate=false;
document.getElementById('load').classList.add('done');
requestAnimationFrame(frame);
// 영상 추출용: 시간 t(초)의 투어 장면을 한 프레임 그린다
window.__tour={ total:tourTotal, seek(t){ capturing=true; yaw=pitch=0; seek(t); render(); } };
window.__ready=true;
</script>
</body>
</html>
