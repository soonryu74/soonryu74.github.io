/* ───────── 유틸 ───────── */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c,c.getContext('2d')]; }
function wrap(ctx,text,maxW){ const out=[]; let cur='';
  for(const w of text.split(' ')){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t }
  if(cur) out.push(cur); return out; }
function speckle(ctx,w,h,r,n,a){ for(let i=0;i<n;i++){ const v=r()*255|0; ctx.fillStyle=`rgba(${v},${v},${v},${a*r()})`;
  const s=1+r()*3; ctx.fillRect(r()*w,r()*h,s,s);} }
const SERIF='"Noto Serif KR","Cormorant Garamond",serif', SANS='"Noto Sans KR",system-ui,sans-serif', LATIN='"Cormorant Garamond","Noto Serif KR",serif';

/* ───────── 절차적 질감 ───────── */
function brickCanvas(){ const [c,x]=cv(1024,1024), r=rng(7); x.fillStyle='#b3a696'; x.fillRect(0,0,1024,1024);
  const bw=128,bh=64,m=5;
  for(let j=0;j<16;j++) for(let i=-1;i<8;i++){ const ox=(j%2)*bw/2;
    const h=6+r()*12, s=38+r()*18, l=27+r()*13 - (r()<.08?8:0);
    x.fillStyle=`hsl(${h},${s}%,${l}%)`; x.fillRect(i*bw+ox+m/2,j*bh+m/2,bw-m,bh-m);
    x.fillStyle=`rgba(255,235,210,${.05+r()*.07})`; x.fillRect(i*bw+ox+m/2,j*bh+m/2,bw-m,3);
    x.fillStyle=`rgba(0,0,0,${.1+r()*.1})`; x.fillRect(i*bw+ox+m/2,j*bh+bh-m/2-3,bw-m,3); }
  speckle(x,1024,1024,r,9000,.16); return c; }
function stoneCanvas(){ const [c,x]=cv(1024,1024), r=rng(21); x.fillStyle='#6f685d'; x.fillRect(0,0,1024,1024);
  const bw=512,bh=256,m=6;
  for(let j=0;j<4;j++) for(let i=-1;i<2;i++){ const ox=(j%2)*bw/2;
    x.fillStyle=`hsl(${34+r()*10},${10+r()*8}%,${60+r()*10}%)`; x.fillRect(i*bw+ox+m/2,j*bh+m/2,bw-m,bh-m);
    for(let k=0;k<14;k++){ x.fillStyle=`rgba(${r()<.5?'70,60,50':'255,250,240'},${.03+r()*.05})`;
      x.beginPath(); x.ellipse(i*bw+ox+r()*bw,j*bh+r()*bh,20+r()*90,10+r()*40,r()*3,0,7); x.fill(); } }
  speckle(x,1024,1024,r,14000,.14); return c; }
function cobbleCanvas(){ const [c,x]=cv(1024,1024), r=rng(5); x.fillStyle='#24211f'; x.fillRect(0,0,1024,1024);
  const n=8,s=128;
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const g=6+r()*6, l=30+r()*18;
    x.fillStyle=`hsl(${25+r()*15},${4+r()*6}%,${l}%)`;
    x.beginPath(); x.roundRect(i*s+g/2+r()*3,j*s+g/2+r()*3,s-g-r()*4,s-g-r()*4,10+r()*14); x.fill();
    x.fillStyle=`rgba(255,255,255,${.04+r()*.05})`; x.beginPath(); x.ellipse(i*s+s*.45,j*s+s*.4,s*.28,s*.2,0,0,7); x.fill(); }
  speckle(x,1024,1024,r,12000,.15); return c; }
function floorCanvas(){ const [c,x]=cv(1024,1024), r=rng(3); x.fillStyle='#d8d3c9'; x.fillRect(0,0,1024,1024);
  speckle(x,1024,1024,r,26000,.12); x.strokeStyle='rgba(120,112,100,.35)'; x.lineWidth=2;
  for(let i=0;i<=2;i++){ x.beginPath(); x.moveTo(i*512,0); x.lineTo(i*512,1024); x.moveTo(0,i*512); x.lineTo(1024,i*512); x.stroke(); }
  return c; }
function mapOf(canvas,rx=1,ry=1){ const t=new THREE.CanvasTexture(canvas); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=8; return t; }

function nlFlag(){ const [c,x]=cv(400,640); ['#AE1C28','#ffffff','#21468B'].forEach((k,i)=>{x.fillStyle=k;x.fillRect(i*400/3,0,400/3+1,640)}); return c; }
function krFlag(){ const [c,x]=cv(400,600); x.fillStyle='#fff'; x.fillRect(0,0,400,600);
  x.translate(400,0); x.rotate(Math.PI/2);            // 가로 600×400 깃발을 세로로 건다
  const W=600,H=400,R=H/4,a=Math.atan2(2,3); x.translate(W/2,H/2);
  x.save(); x.rotate(a);
  x.fillStyle='#CD2E3A'; x.beginPath(); x.arc(0,0,R,Math.PI,2*Math.PI); x.fill();
  x.fillStyle='#0047A0'; x.beginPath(); x.arc(0,0,R,0,Math.PI); x.fill();
  x.fillStyle='#CD2E3A'; x.beginPath(); x.arc(-R/2,0,R/2,0,7); x.fill();
  x.fillStyle='#0047A0'; x.beginPath(); x.arc(R/2,0,R/2,0,7); x.fill(); x.restore();
  const tri=(ang,pat)=>{ x.save(); x.rotate(ang); x.fillStyle='#000'; const d=R*1.5, t=R/6, g=R/12, L=R;
    pat.forEach((solid,k)=>{ const px=d+k*(t+g); if(solid) x.fillRect(px,-L/2,t,L);
      else { x.fillRect(px,-L/2,t,L/2-g/2); x.fillRect(px,g/2,t,L/2-g/2); } }); x.restore(); };
  tri(a-Math.PI,[1,1,1]); tri(a,[0,0,0]); tri(-a,[0,1,0]); tri(Math.PI-a,[1,0,1]); return c; }

  if(i===1){ [['#5a2a22',.3,.22,0],['#2f3f36',.27,.2,.25],['#3a2c22',.24,.18,-.2]].forEach(([k,w,d,ry],n)=>{ const b=box(w,.05,d,std({color:k,roughness:.7}),x,.95+n*.052,-2); b.rotation.y=ry; }); }
  if(i===2){ const s=box(.3,.006,.4,paper,x-.06,.98,-2.02); s.rotation.x=-.5; box(.02,.1,.3,ped,x-.06,.95,-2.12);
    const md=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.01,28),std({color:'#b08a3c',metalness:.9,roughness:.35})); md.position.set(x+.17,.93,-1.86); scene.add(md); }
});

/* ───────── 카메라 · 투어 ───────── */
const V=a=>new THREE.Vector3(...a), ease=u=>u*u*(3-2*u), Y=new THREE.Vector3(0,1,0);
const camP=V(STOPS[0].p), camT=V(STOPS[0].t);
let idx=0, anim=null, touring=false, tourT0=0, capturing=false, yaw=0, pitch=0, capShown=-1;
const posed=(i,u)=>{ const p=V(STOPS[i].p), t=V(STOPS[i].t); return {p:p.lerp(t,.05*u), t}; };
const MOVE=2.8;
function timeline(){ let t=0; return STOPS.map((s,i)=>{ const len=s[lang][1].length, d=s.hold||Math.max(6.5, len/(lang==='ko'?11:17)+3), mv=i?MOVE:0;
  const seg={start:t,mv,d}; t+=mv+d; return seg; }); }
function tourTotal(){ const tl=timeline(), l=tl[N-1]; return l.start+l.mv+l.d; }
const $=id=>document.getElementById(id);
function setCaption(i,op){ const s=STOPS[i], card=!!s.card;
  if(i!==capShown){ capShown=i; const x=s[lang];
    if(card){ $('ck').textContent=s.kicker; $('ct').textContent=x[0]; $('cb').textContent=x[1]; $('card').dataset.kind=s.card; $('card').lang=lang;
      $('cc').innerHTML=s.card==='end'?CREDITS.map(l=>'<span>'+l+'</span>').join(''):''; }
    else { $('capn').textContent=String(i).padStart(2,'0')+' / '+String(N-2).padStart(2,'0'); $('capt').textContent=x[0]; $('capb').textContent=x[1]; } }
  $('cap').style.opacity=card?0:op; $('card').style.opacity=card?op:0; }
function seek(t){ const tl=timeline(); let i=N-1; for(let k=0;k<N;k++){ if(t<tl[k].start+tl[k].mv+tl[k].d){i=k;break;} }
  const s=tl[i], lt=Math.min(t-s.start, s.mv+s.d);
  if(lt<s.mv){ const a=posed(i-1,1), b=posed(i,0), u=ease(lt/s.mv); camP.lerpVectors(a.p,b.p,u); camT.lerpVectors(a.t,b.t,u);
    if(lt<.5) setCaption(i-1,1-lt/.5); else if(lt>s.mv-.7) setCaption(i,(lt-(s.mv-.7))/.7); else setCaption(capShown<0?i:capShown,0);
  } else { const a=posed(i,(lt-s.mv)/s.d); camP.copy(a.p); camT.copy(a.t); setCaption(i,1); }
  idx=i; document.getElementById('bar').style.width=(100*t/tourTotal())+'%'; }
function goTo(i){ touring=false; idx=(i+N)%N; anim={fp:camP.clone(),ft:camT.clone(),fy:yaw,fpt:pitch,t0:performance.now(),dur:1900};
  setCaption(idx,1); syncUI(); }
function syncUI(){ const u=UI[lang]; document.documentElement.lang=lang;
  document.getElementById('sub').textContent=u.sub; document.getElementById('note').innerText=u.note;
  document.getElementById('tour').textContent=touring?u.stop:u.tour;
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  if(!touring) document.getElementById('bar').style.width=(100*idx/(N-1))+'%'; }
function setLang(l){ lang=l; capShown=-1; redraw.forEach(f=>f()); setCaption(idx,1);
  if(touring){ const tl=timeline(); tourT0=performance.now()-tl[idx].start*1000-tl[idx].mv*1000; } syncUI(); }
const bgm=new Audio('audio/psalm134.mp3'); bgm.loop=true; bgm.volume=.6;
function toggleTour(){ if(touring){ bgm.pause(); goTo(idx); return; } touring=true; anim=null; yaw=pitch=0; tourT0=performance.now(); bgm.currentTime=0; bgm.play().catch(()=>{}); syncUI(); }

function render(){ camera.position.copy(camP); camera.lookAt(camT); camera.rotateOnWorldAxis(Y,yaw); camera.rotateX(pitch); renderer.render(scene,camera); }
function frame(now){ requestAnimationFrame(frame); if(capturing) return;
  if(touring){ const t=(now-tourT0)/1000; if(t>=tourTotal()){ touring=false; bgm.pause(); seek(tourTotal()); syncUI(); } else seek(t); }
  else if(anim){ const u=ease(Math.min(1,(now-anim.t0)/anim.dur)), b=posed(idx,0);
    camP.lerpVectors(anim.fp,b.p,u); camT.lerpVectors(anim.ft,b.t,u); yaw=anim.fy*(1-u); pitch=anim.fpt*(1-u); if(u>=1) anim=null; }
  render(); }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov=w/h<.8?74:w/h<1.3?60:50; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* ───────── 입력 ───────── */
let down=null; const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,moved:0}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; down.x=e.clientX; down.y=e.clientY;
  down.moved+=Math.abs(dx)+Math.abs(dy); if(touring||down.moved<5) return; anim=null;
  yaw+=dx*.0032; pitch=Math.max(-.6,Math.min(.6,pitch+dy*.0026)); });
canvas.addEventListener('pointerup',e=>{ canvas.classList.remove('drag'); if(down&&down.moved<5){
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(clickable)[0]; if(hit) goTo(hit.object.userData.stop); } down=null; });
document.getElementById('prev').onclick=()=>{bgm.pause();goTo(idx-1)}; document.getElementById('next').onclick=()=>{bgm.pause();goTo(idx+1)};
document.getElementById('tour').onclick=toggleTour;
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') goTo(idx+1); else if(e.key==='ArrowLeft') goTo(idx-1);
  else if(e.key===' '){ e.preventDefault(); toggleTour(); } else if(e.key.toLowerCase()==='h') document.body.classList.toggle('clean'); });

/* ───────── 시작 ───────── */
const all=STOPS.map(s=>['ko','en','nl'].map(l=>s[l].join(' ')).join(' ')).join(' ')+Object.values(KING).join(' ')+'카이퍼의 길 아브라함 부조 동판 기증: 얀 페터르 발케넨더 전 네덜란드 총리 0123456789 감사의 편지 A LETTER OF THANKS EEN DANKBRIEF '+CREDITS.join(' ');
const fonts=['700 40px "Noto Serif KR"','500 40px "Noto Serif KR"','400 30px "Noto Sans KR"','500 40px "Cormorant Garamond"','600 40px "Cormorant Garamond"','700 40px "Cormorant Garamond"','italic 600 40px "Cormorant Garamond"'];
await Promise.race([Promise.all(fonts.map(f=>document.fonts.load(f,all))).catch(()=>{}), new Promise(r=>setTimeout(r,6000))]);
resize(); redraw.forEach(f=>f()); setCaption(0,1); syncUI(); render(); renderer.shadowMap.autoUpdate=false;
document.getElementById('load').classList.add('done');
requestAnimationFrame(frame);
// 영상 추출용: 시간 t(초)의 투어 장면을 한 프레임 그린다
window.__tour={ total:tourTotal, marks:()=>timeline().map(s=>s.start+s.mv+2), seek(t){ capturing=true; yaw=pitch=0; seek(t); render(); } };
window.__ready=true;
</script>
</body>
</html>
