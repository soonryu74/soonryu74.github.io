if(new URLSearchParams(location.search).get('film')==='doc') CREDITS.splice(4,0,'Design · Ahn Jang-won, YiEUM Partners');
const TOUR = [
 { id:'title', card:'title', kicker:'A LETTER OF THANKS · EEN DANKBRIEF · 감사의 편지', p:[-9,1.6,8.6], t:[4,2.6,0],
   ko:['마아슬라위스에서 서울까지','1837년, 항구 마을 마아슬라위스에서 한 소년이 태어났습니다. 그로부터 두 세기 가까이 지난 지금, 8천 킬로미터 넘게 떨어진 서울의 한 길이 그의 이름으로 불립니다.'],
   en:['From Maassluis to Seoul','In 1837, a boy was born in the harbour town of Maassluis. Almost two centuries later, more than eight thousand kilometres away, a street in Seoul carries his name.'],
   nl:['Van Maassluis naar Seoul','In 1837 werd in het havenstadje Maassluis een jongen geboren. Bijna twee eeuwen later, meer dan achtduizend kilometer verderop, draagt een straat in Seoul zijn naam.'] },
 { id:'intro', p:[0,1.7,9.2], t:[0,2.5,0],
   ko:['서울의 카이퍼 스트리트','사랑의교회 아브라함 카이퍼 전시홀입니다. 2024년 9월 8일, 얀 페터르 발케넨더 전 네덜란드 총리와 페이터르 판 데르 플리트 주한 네덜란드 대사가 함께한 가운데 문을 열었습니다.'],
   en:['Kuyper Street, Seoul','This is the Abraham Kuyper Street Exhibition Hall of SaRang Church. It opened on 8 September 2024, in the presence of former Prime Minister Jan Peter Balkenende and Ambassador Peter van der Vliet.'],
   nl:['Kuyper Street, Seoul','Dit is de Abraham Kuyper Street Expositiehal van de SaRang Church. De hal werd geopend op 8 september 2024, in aanwezigheid van oud-premier Jan Peter Balkenende en ambassadeur Peter van der Vliet.'] },
 { id:'sign', p:[-6.6,1.65,5.2], t:[-6.6,1.9,0],
   ko:['방이 아니라 길','이름은 헤이그의 카이퍼 박사 거리(Dr. Kuyperstraat)에서 가져왔습니다. 닫힌 방이 아니라 길목입니다. 매주 청소년과 대학생, 결혼식 하객이 이 길을 지나며 아브라함 카이퍼를 만납니다.'],
   en:['A street, not a room','The name comes from the Dr. Kuyperstraat in The Hague. This is not a closed room but a passageway. Every week teenagers, students and wedding guests walk through it — and meet Abraham Kuyper on their way.'],
   nl:['Een straat, geen zaal','De naam komt van de Dr. Kuyperstraat in Den Haag. Dit is geen gesloten zaal, maar een doorgang. Elke week lopen tieners, studenten en bruiloftsgasten erdoorheen — en ontmoeten onderweg Abraham Kuyper.'] },
 { id:'alcove', p:[0,1.65,5.4], t:[0,1.35,-2],
   ko:['정성으로 옮겨 온 네덜란드의 골목','붉은 벽돌은 첫 목회지 베이스트 교회를, 바닥의 박석은 암스테르담 담 광장을 떠올리게 합니다. 지구 반대편에 정성으로 옮겨 놓은 네덜란드의 한 모퉁이입니다.'],
   en:['A Dutch street corner, rebuilt with care','The red brick recalls his first church in Beesd. The paving stones recall Dam Square in Amsterdam. A corner of the Netherlands, rebuilt with care on the other side of the world.'],
   nl:['Een Hollandse straathoek, met zorg herbouwd','De rode baksteen herinnert aan zijn eerste kerk in Beesd. De keien herinneren aan de Dam in Amsterdam. Een hoekje Nederland, met zorg herbouwd aan de andere kant van de wereld.'] },
 { id:'p1', panel:1, meta:'1837 · MAASSLUIS', p:[-0.6,1.6,-1.2], t:[-4,1.25,-1.2],
   ko:['탄생과 성장','이야기는 여러분의 고장 마아슬라위스에서 시작됩니다. 작은 항구 마을의 소년이 하나님을 믿었고, 훗날 나라를 이끌게 됩니다.','작은 항구 마을의 소년'],
   en:['Birth and Youth','The story begins where yours does: in Maassluis. A boy from a small harbour town who trusted God — and would one day lead his country.','A boy from a harbour town'],
   nl:['Geboorte en jeugd','Het verhaal begint waar ook het uwe begint: in Maassluis. Een jongen uit een klein havenstadje die op God vertrouwde — en ooit zijn land zou leiden.','Een jongen uit een havenstad'] },
 { id:'p2', panel:2, meta:'1863 · BEESD', p:[-0.6,1.6,-2.9], t:[-4,1.25,-2.9],
   ko:['목회 활동과 신학적 기여','베이스트에서 젊은 목사는 피체 발투스 같은 평범한 교인들의 굳건한 믿음에 감동했습니다. 칼빈주의는 신학에 그치지 않고 삶의 방식이라는, 평생을 붙든 확신을 그곳에서 얻었습니다.','베이스트가 가르쳐 준 것'],
   en:['Ministry and Theology','In Beesd, the young minister was moved by the firm faith of ordinary villagers such as Pietje Baltus. There he found the conviction that carried his whole life: Calvinism is not only a theology, but a way of living.','What Beesd taught him'],
   nl:['Predikant en theoloog','In Beesd werd de jonge dominee geraakt door het vaste geloof van gewone dorpelingen als Pietje Baltus. Daar vond hij de overtuiging die zijn hele leven droeg: het calvinisme is niet alleen een theologie, maar een manier van leven.','Wat Beesd hem leerde'] },
 { id:'p3', panel:3, meta:'1880 · VRIJE UNIVERSITEIT', p:[-2.3,1.6,-0.6], t:[-2.3,1.25,-4],
   ko:['학교투쟁과 교육 개혁','성경을 가르치는 학교의 자유를 위해 싸웠습니다. 그리고 1880년, 암스테르담 신교회에서 자유대학교의 문을 열었습니다.','성경을 가르치는 학교의 자유'],
   en:['The School Struggle','He fought for the freedom of schools with the Bible. And in 1880, in the Nieuwe Kerk in Amsterdam, he opened the Free University.','Freedom for schools with the Bible'],
   nl:['De schoolstrijd','Hij streed voor de vrijheid van de school met de Bijbel. En in 1880 opende hij, in de Nieuwe Kerk in Amsterdam, de Vrije Universiteit.','Vrijheid voor de school met de Bijbel'] },
 { id:'p4', panel:4, meta:'1901–1905 · DEN HAAG', p:[2.3,1.6,-0.6], t:[2.3,1.25,-4],
   ko:['언론과 정치','일간지 「더 스탄다르트」의 주필, 정당의 창립자, 1901년부터 1905년까지 총리, 260여 권의 저자. 사람들은 그에게 열 개의 머리와 백 개의 손이 있다고 했습니다.','열 개의 머리, 백 개의 손'],
   en:['Press and Politics','Editor of De Standaard, founder of a political party, Prime Minister from 1901 to 1905, author of some 260 books. People said he had ten heads and a hundred hands.','Ten heads, a hundred hands'],
   nl:['Journalistiek en politiek','Hoofdredacteur van De Standaard, oprichter van een politieke partij, minister-president van 1901 tot 1905, schrijver van zo’n 260 boeken. Men zei dat hij tien hoofden en honderd handen had.','Tien hoofden, honderd handen'] },
 { id:'p5', panel:5, meta:'1920 · DEN HAAG', p:[0.6,1.6,-2.9], t:[4,1.25,-2.9],
   ko:['후기 활동','83세로 생을 마칠 때까지 펜을 놓지 않았습니다. 마지막 대작 『반혁명 국가학』은 한국어로 번역되어 300명의 국회의원실에 전달되었습니다.','끝까지 쓰다'],
   en:['Later Years','He kept writing until the end, at the age of 83. His last great work, Antirevolutionaire Staatkunde, now exists in Korean — and was delivered to all 300 members of Korea’s National Assembly.','Writing to the end'],
   nl:['Latere jaren','Hij bleef schrijven tot het einde, tot zijn 83e. Zijn laatste grote werk, Antirevolutionaire Staatkunde, bestaat nu in het Koreaans — en werd bezorgd bij alle 300 leden van het Koreaanse parlement.','Schrijven tot het einde'] },
 { id:'p6', panel:6, meta:'VANDAAG · TODAY', p:[0.6,1.6,-1.2], t:[4,1.25,-1.2],
   ko:['사상과 영향','영역주권, 그리고 일반은총. 네덜란드에서 태어난 이 사상을 지금 한국의 젊은이들이 배우고, 삶으로 살아 내려 합니다.','영역주권과 일반은총'],
   en:['Thought and Legacy','Sphere sovereignty. Common grace. Ideas born in the Netherlands, which young Koreans now study — and try to live.','Sphere sovereignty, common grace'],
   nl:['Gedachtegoed en invloed','Soevereiniteit in eigen kring. Gemene gratie. Gedachten die in Nederland zijn geboren, en die jonge Koreanen nu bestuderen — en proberen te leven.','Soevereiniteit in eigen kring'] },
 { id:'relics', p:[0,1.78,1.0], t:[0,0.95,-2],
   ko:['마아슬라위스에서 온 선물','이 유물들은 마아슬라위스의 아브라함 카이퍼 헤리티지 센터에서 서울까지 먼 길을 왔습니다. 주일마다 다음 세대가 예배하러 가는 길에 이 앞을 지납니다. 감사한 마음으로 소중히 간직하겠습니다.'],
   en:['Your gift, from Maassluis','These objects travelled from the Erfgoedcentrum Abraham Kuyper in Maassluis to Seoul. Every Sunday, young people pass them on their way to worship. We keep them with care, and with gratitude.'],
   nl:['Uw geschenk, uit Maassluis','Deze voorwerpen reisden van het Erfgoedcentrum Abraham Kuyper in Maassluis naar Seoul. Elke zondag lopen jonge mensen erlangs, op weg naar de eredienst. Wij bewaren ze met zorg, en met dankbaarheid.'] },
 { id:'plaque', p:[5.4,1.6,3.1], t:[5.4,1.15,0],

   en:['The bronze relief','For years this bronze relief was treasured by Jan Peter Balkenende. He gave it to this hall — and it was he who asked Maassluis on our behalf. The photographs in the hall were sent from Beesd by elder Cor van Heuckelum.'],
   nl:['Het bronzen reliëf','Jarenlang koesterde Jan Peter Balkenende dit bronzen reliëf. Hij schonk het aan deze hal — en hij was het die namens ons bij Maassluis aanklopte. De foto’s in de hal zijn vanuit Beesd gestuurd door ouderling Cor van Heuckelum.'] },
 { id:'quote', p:[9.2,1.7,6.4], t:[9.2,2.35,0],

   en:['“Mine!”','“There is not a square inch in the whole domain of our human existence over which Christ, who is Sovereign over all, does not cry: ‘Mine!’” He spoke these words in Amsterdam in 1880. Today they are written on a wall in Seoul.'],

    if(card){ $('ck').textContent=s.kicker; $('ct').textContent=x[0]; $('cb').textContent=x[1]; $('card').dataset.kind=s.card; $('card').lang=lang;
      $('cc').innerHTML=s.card==='end'?CREDITS.map(l=>'<span>'+l+'</span>').join(''):''; }
    else { $('capn').textContent=FILM?(s.ch?s.ch[lang]:''):String(i).padStart(2,'0')+' / '+String(N-2).padStart(2,'0'); $('capt').textContent=x[0]; $('capb').textContent=x[1]; }
    $('stamp').textContent=s.stamp||''; }
  $('stamp').style.opacity=card||!s.stamp?0:op;
  $('cap').style.opacity=card?0:op; $('card').style.opacity=card?op:0; }
function setStill(i,u){ const s=STOPS[i], el=$('still'), im=el.firstChild; stillOn=!!s.still;
  if(s.still){ if(im.dataset.src!==s.still){ im.src=s.still; im.dataset.src=s.still; } im.style.transform='translateY(-17%) scale('+(1+.06*u)+')'; }
  el.style.opacity=s.still?1:0; }
function seek(t){ const tl=timeline(); let i=N-1; for(let k=0;k<N;k++){ if(t<tl[k].start+tl[k].mv+tl[k].d){i=k;break;} }
  const s=tl[i], lt=Math.min(t-s.start, s.mv+s.d); let fade=0, vi=i, vu=0;
  if(lt<s.mv && STOPS[i].cut){ const h=s.mv/2;
    if(lt<h){ vi=i-1; vu=1; fade=ease(lt/h); const a=posed(i-1,1); camP.copy(a.p); camT.copy(a.t); setCaption(i-1,Math.max(0,1-lt/.45)); }
    else { fade=ease((s.mv-lt)/h); const a=posed(i,0); camP.copy(a.p); camT.copy(a.t); setCaption(i,Math.max(0,(lt-h-.15)/(h-.15))); }
  } else if(lt<s.mv){ const a=posed(i-1,1), b=posed(i,0), u=ease(lt/s.mv); camP.lerpVectors(a.p,b.p,u); camT.lerpVectors(a.t,b.t,u);
    if(lt<.5){ vi=i-1; vu=1; setCaption(i-1,1-lt/.5); } else if(lt>s.mv-.7) setCaption(i,(lt-(s.mv-.7))/.7); else setCaption(capShown<0?i:capShown,0);
  } else { vu=(lt-s.mv)/s.d; const a=posed(i,vu); camP.copy(a.p); camT.copy(a.t); setCaption(i,1); }
  $('fade').style.opacity=fade; setStill(vi,vu);
  idx=i; document.getElementById('bar').style.width=(100*t/tourTotal())+'%'; }
function goTo(i){ touring=false; $('fade').style.opacity=0; setStill((i+N)%N,0); idx=(i+N)%N; anim={fp:camP.clone(),ft:camT.clone(),fy:yaw,fpt:pitch,t0:performance.now(),dur:1900};
  setCaption(idx,1); syncUI(); }
function syncUI(){ const u=UI[lang]; document.documentElement.lang=lang;
  document.getElementById('sub').textContent=u.sub; document.getElementById('note').innerText=u.note;
  document.getElementById('tour').textContent=touring?u.stop:u.tour;
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  if(!touring) document.getElementById('bar').style.width=(100*idx/(N-1))+'%'; }
function setLang(l){ lang=l; capShown=-1; redraw.forEach(f=>f()); setCaption(idx,1);
  if(touring){ const tl=timeline(); tourT0=performance.now()-tl[idx].start*1000-tl[idx].mv*1000; } syncUI(); }
const bgm=new Audio('audio/psalm134.mp3'); bgm.loop=true; bgm.volume=.6;
function toggleTour(){ if(touring){ bgm.pause(); goTo(idx); return; } touring=true; anim=null; yaw=pitch=0; tourT0=performance.now(); bgm.currentTime=0; bgm.play().catch(()=>{}); syncUI(); }

function render(){ camera.position.copy(camP); camera.lookAt(camT); camera.rotateOnWorldAxis(Y,yaw); camera.rotateX(pitch); renderer.render(scene,camera); }
function frame(now){ requestAnimationFrame(frame); if(capturing) return;
  if(touring){ const t=(now-tourT0)/1000; if(t>=tourTotal()){ touring=false; bgm.pause(); seek(tourTotal()); syncUI(); } else seek(t); }
  else if(anim){ const u=ease(Math.min(1,(now-anim.t0)/anim.dur)), b=posed(idx,0);
    camP.lerpVectors(anim.fp,b.p,u); camT.lerpVectors(anim.ft,b.t,u); yaw=anim.fy*(1-u); pitch=anim.fpt*(1-u); if(u>=1) anim=null; }
  render(); }
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov=w/h<.8?74:w/h<1.3?60:50; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* ───────── 입력 ───────── */
let down=null; const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,moved:0}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; down.x=e.clientX; down.y=e.clientY;
  down.moved+=Math.abs(dx)+Math.abs(dy); if(touring||down.moved<5) return; anim=null;
  yaw+=dx*.0032; pitch=Math.max(-.6,Math.min(.6,pitch+dy*.0026)); });
canvas.addEventListener('pointerup',e=>{ canvas.classList.remove('drag'); if(down&&down.moved<5){
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(clickable)[0]; if(hit) goTo(hit.object.userData.stop); } down=null; });
document.getElementById('prev').onclick=()=>{bgm.pause();goTo(idx-1)}; document.getElementById('next').onclick=()=>{bgm.pause();goTo(idx+1)};
document.getElementById('tour').onclick=toggleTour;
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') goTo(idx+1); else if(e.key==='ArrowLeft') goTo(idx-1);
  else if(e.key===' '){ e.preventDefault(); toggleTour(); } else if(e.key.toLowerCase()==='h') document.body.classList.toggle('clean'); });

/* ───────── 시작 ───────── */
const all=STOPS.map(s=>['ko','en','nl'].map(l=>s[l].join(' ')).join(' ')).join(' ')+Object.values(KING).join(' ')+'카이퍼의 길 아브라함 부조 동판 기증: 얀 페터르 발케넨더 전 네덜란드 총리 0123456789 감사의 편지 A LETTER OF THANKS EEN DANKBRIEF '+CREDITS.join(' ')+' STORY →';
const fonts=['700 40px "Noto Serif KR"','500 40px "Noto Serif KR"','400 30px "Noto Sans KR"','500 40px "Cormorant Garamond"','600 40px "Cormorant Garamond"','700 40px "Cormorant Garamond"','italic 600 40px "Cormorant Garamond"'];
await Promise.race([Promise.all(fonts.map(f=>document.fonts.load(f,all))).catch(()=>{}), new Promise(r=>setTimeout(r,6000))]);
await Promise.all(STOPS.filter(s=>s.still).map(s=>{ const im=new Image(); im.src=s.still; return im.decode().catch(()=>{}); }));
resize(); redraw.forEach(f=>f()); setCaption(0,1); syncUI(); render(); renderer.shadowMap.autoUpdate=false;
document.getElementById('load').classList.add('done');
requestAnimationFrame(frame);
// 영상 추출용: 시간 t(초)의 투어 장면을 한 프레임 그린다
window.__tour={ total:tourTotal, marks:()=>timeline().map(s=>s.start+s.mv+2), seek(t){ capturing=true; yaw=pitch=0; seek(t); const k=camP.toArray().concat(camT.toArray()).join(); if(!stillOn && k!==this.k){ this.k=k; render(); } } };
window.__ready=true;
</script>
</body>
