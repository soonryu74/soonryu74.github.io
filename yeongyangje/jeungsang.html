<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증상별 | 근거영양</title>
<meta name="description" content="피로·탈모·손발 저림·쥐·불면·눈 피로·잦은 감기·관절통·건망증·우울감… 이 증상이 영양제로 해결되는지, 어떤 결핍이 원인일 수 있는지, 어떤 검사가 맞는지, 병원에 가야 할 신호는 무엇인지. 메타분석·코크란 근거.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head">
    <h1>증상별 — 이 증상, 영양제로 해결되나</h1>
    <p>영양제를 사는 이유는 대부분 증상 때문입니다. 그런데 같은 피로라도 원인이 철 결핍이면 철분이 답이고, 갑상선이면 영양제가 답이 아닙니다. 증상마다 <b>근거 있는 원인 → 확인 검사 → 결핍 없이 먹었을 때 효과 → 병원에 가야 할 신호</b>를 정리했습니다.</p>
  </div>
  <div class="stage-nav" id="sym-nav"></div>
  <div id="sym-list"></div>
  <div class="disclaimer">증상은 여러 원인이 겹칠 수 있고, 여기 적힌 것은 영양과 관련된 부분만입니다. 증상이 2주 이상 지속되거나 "병원 신호"에 해당하면 진료를 받으세요. 출처: 코크란, 주요 메타분석, NIH ODS, 학회 지침, PubMed 원문.</div>
</main>
<div id="site-footer"></div>
<script src="data/glossary.js"></script>
<script src="assets/app.js"></script>
<script src="data/ingredients.js"></script>
<script src="data/symptoms.js"></script>
<script>
(function(){
  var S=window.EBN_SYMPTOMS||[], I=window.EBN_INGREDIENTS, esc=EBN.esc;
  var VL={rec:'효과 있음',cond:'결핍일 때만',opt:'작은 효과',no:'효과 없음',avoid:'해로울 수 있음'};
  document.getElementById('sym-nav').innerHTML=S.map(function(s){return '<a href="#'+s.id+'">'+s.icon+' '+esc(s.name)+'</a>';}).join('');
  document.getElementById('sym-list').innerHTML=S.map(function(s){
    return '<div class="sym-card" id="'+esc(s.id)+'"><h3>'+s.icon+' '+esc(s.name)+'</h3><p style="margin:0 0 6px">'+esc(s.lead)+'</p>'+
      '<ul class="cause">'+(s.causes||[]).map(function(c){ return '<li><span class="verdict '+EBN.verdictClass[c.v]+'" style="font-size:.78rem;padding:2px 9px">'+esc(VL[c.v])+'</span> <b>'+esc(c.name)+'</b> — '+esc(c.why)+(c.ing&&I[c.ing]?' <a href="seongbun.html#'+esc(c.ing)+'">성분↗</a>':'')+(c.src?' <a href="'+esc(c.src)+'" target="_blank" rel="noopener">근거↗</a>':'')+'</li>'; }).join('')+'</ul>'+
      (s.test?'<div class="test"><b>확인 검사</b> '+esc(s.test)+' <a href="geomsa.html#tests">검사 가이드 →</a></div>':'')+
      (s.flag?'<div class="flag"><b>병원 신호</b> '+esc(s.flag)+'</div>':'')+'</div>'; }).join('');
})();
</script>
</body>
</html>
