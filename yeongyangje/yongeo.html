<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용어집 | 근거영양</title>
<meta name="description" content="RCT, 위험비(HR), 신뢰구간, 상한섭취량, INR, CYP3A4, 킬레이트… 영양제 연구와 약 상호작용을 읽을 때 나오는 용어를 쉬운 말로. 본문에서 점선 밑줄 단어를 누르면 같은 설명이 뜹니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-noglossary>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head">
    <h1>용어집</h1>
    <p>이 사이트의 다른 페이지에서 <abbr class="gl" title="이렇게 점선 밑줄이 있는 단어입니다">점선 밑줄 단어</abbr>를 누르면 같은 설명이 바로 뜹니다. 여기서는 한 번에 볼 수 있습니다.</p>
  </div>
  <div class="filter-bar"><input type="search" id="q" placeholder="용어 검색"><select id="cat"><option value="">전체</option></select></div>
  <div class="gl-list" id="list"></div>
</main>
<div id="site-footer"></div>
<script src="data/glossary.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  var G=window.EBN_GLOSSARY, esc=EBN.esc, cats={}; G.forEach(function(g){cats[g.cat]=1;});
  var sel=document.getElementById('cat'); Object.keys(cats).forEach(function(c){ sel.insertAdjacentHTML('beforeend','<option value="'+esc(c)+'">'+esc(c)+'</option>'); });
  function render(){ var kw=(document.getElementById('q').value||'').toLowerCase(), c=sel.value;
    document.getElementById('list').innerHTML=G.filter(function(g){ if(c&&g.cat!==c) return false; if(kw&&(g.term+' '+(g.alias||[]).join(' ')+' '+g.def).toLowerCase().indexOf(kw)<0) return false; return true; })
      .map(function(g){ return '<div class="gl-item" id="'+esc(g.term)+'"><h4>'+esc(g.term)+'</h4>'+((g.alias||[]).length?'<div class="alias">'+esc(g.alias.join(' · '))+'</div>':'')+'<span class="pill">'+esc(g.cat)+'</span><p>'+esc(g.def)+'</p></div>'; }).join(''); }
  ['q','cat'].forEach(function(id){ document.getElementById(id).addEventListener('input',render); document.getElementById(id).addEventListener('change',render); });
  render(); if(location.hash){ try{ var el=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(el){ el.scrollIntoView(); el.style.outline='3px solid var(--teal)'; } }catch(e){} }
})();
</script>
</body>
</html>
