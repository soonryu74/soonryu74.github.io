<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모두ID · 모바일신분증 쉬운 길잡이 (시연판)</title>
<meta name="description" content="고령자·장애인·외국인이 모바일신분증을 쉽게 쓰도록 돕는 길잡이와, 신분증을 담보로 맡기지 않는 디지털 방문증 시연. 실제 인증 기능은 없습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--ink2:#4a5568;--line:#d9e0ec;--blue:#1d4ed8;--blue2:#163ea8;--soft:#e8efff;--ok:#0f7b4f;--oksoft:#e3f5ec;--warn:#9a3412;--warnsoft:#fff1e6;--r:18px;--fs:1}
*{box-sizing:border-box}
html{font-size:calc(112.5% * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.65;word-break:keep-all}
:focus-visible{outline:4px solid #f59e0b;outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus{outline:none}
header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-right:auto;color:var(--ink);text-decoration:none}
.mark{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:900}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font:inherit;font-size:.85rem;font-weight:700;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tool[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo{background:#b42318;color:#fff;text-align:center;font-size:.85rem;font-weight:700;line-height:1.45;padding:8px 14px}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.75rem;line-height:1.3;margin:.2em 0 .4em}
h2{font-size:1.3rem;margin:0 0 .5em}
p{margin:.3em 0 .8em}
.muted{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:0 6px 20px rgba(20,33,61,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{font:inherit;text-align:left;width:100%;min-height:96px;padding:16px;border-radius:var(--r);border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center}
.choice:hover{border-color:var(--blue)}
.choice .ic{font-size:2rem;flex:none}
.choice b{display:block;font-size:1.1rem}
.choice small{color:var(--ink2);font-size:.85rem}
.btn{font:inherit;font-weight:800;min-height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;font-size:1.05rem}
.btn.primary{background:var(--blue);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.crumb{font-size:.85rem;color:var(--ink2);margin-bottom:6px}
.step{font-size:1.35rem;font-weight:700;line-height:1.5;margin:10px 0}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
.tip{background:var(--oksoft);border-left:6px solid var(--ok);padding:12px 14px;border-radius:10px;margin:10px 0}
.warn{background:var(--warnsoft);border-left:6px solid var(--warn);padding:12px 14px;border-radius:10px;margin:10px 0}
.speak{display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--blue2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phone{border:3px solid var(--ink);border-radius:28px;padding:16px;background:#fff;min-height:360px}
.phone h3,.desk h3{margin:0 0 8px;font-size:1rem}
.desk{border:3px dashed var(--ink2);border-radius:18px;padding:16px;background:#fbfcff;min-height:360px}
.qr{width:150px;height:150px;margin:10px auto;display:block;image-rendering:pixelated;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pass{border-radius:16px;padding:14px;background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff}
.pass b{font-size:1.2rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:700}
.list{padding-left:1.2em} .list li{margin:.35em 0}
footer{max-width:760px;margin:0 auto;padding:16px;color:var(--ink2);font-size:.82rem}
.hc{--bg:#000;--card:#000;--ink:#fff;--ink2:#e5e5e5;--line:#fff;--soft:#333;--blue:#ffd400;--blue2:#ffd400;--oksoft:#002b18;--warnsoft:#3a1600}
.hc .btn.primary{color:#000}.hc .choice,.hc .tool,.hc .btn{background:#000;color:#fff}.hc header{background:#000}.hc .demo{background:#ffe9a6;color:#000}
.hc .phone,.hc .desk{background:#000}
@media (max-width:640px){.grid,.two{grid-template-columns:1fr}h1{font-size:1.5rem}}
</style>
</head>
<body>
<header>
  <div class="demo" role="note" id="demoNote">[출품용 시연판] 2026 모바일신분증 아이디어 공모전 출품용 시연(PoC) 프로토타입입니다. 정부·한국조폐공사 공식 서비스가 아니며, 실제 개인정보를 수집하거나 인증을 수행하지 않습니다.</div>
  <div class="bar">
    <a class="brand" href="#" onclick="go('home');return false" aria-label="모두ID 처음으로"><span class="mark">ID</span>모두ID</a>
    <div class="tools" role="group" aria-label="보기 설정">
      <button class="tool" id="tFont" aria-pressed="false" onclick="toggleFont()">가 큰 글씨</button>
      <button class="tool" id="tHc" aria-pressed="false" onclick="toggleHc()">◐ 고대비</button>
      <button class="tool" id="tVoice" aria-pressed="false" onclick="toggleVoice()">🔊 읽어 주기</button>
      <button class="tool" id="tLang" onclick="toggleLang()">EN</button>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>

const $=s=>document.querySelector(s);
const t=()=>T[S.lang];

let AUD=null;
function stopVoice(){ if(AUD){AUD.pause();AUD=null} if('speechSynthesis' in window) speechSynthesis.cancel(); }
function say(text,rate){ stopVoice(); const f=VOICE[text];
  if(f){ AUD=new Audio(f); AUD.playbackRate=rate; AUD.play().catch(()=>{}); return; }
  if(!('speechSynthesis' in window))return; const u=new SpeechSynthesisUtterance(text); u.lang=S.lang==='ko'?'ko-KR':'en-US'; u.rate=rate; speechSynthesis.speak(u);}
function speak(text){ if(!S.voice)return; say(text,S.who==='elder'?0.9:1); }
function speakNow(text){ say(text,S.who==='elder'?0.9:1); }
function focusMain(){ const h=$('#app h1,#app h2'); if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});} window.scrollTo(0,0);}
function choices(obj,fn){return `<div class="grid">${Object.entries(obj).map(([k,v])=>`<button class="choice" onclick="${fn}('${k}')"><span class="ic" aria-hidden="true">${v[0]}</span><span><b>${esc(v[1])}</b>${v[2]?`<small>${esc(v[2])}</small>`:''}</span></button>`).join('')}</div>`}

function go(view){
  const L=t(); let h='';
  if(view==='home'){ Object.assign(S,{who:null,id:null,task:null,i:0});
    h=`<h1>${L.hello}</h1><p class="muted">${L.helloSub}</p><div class="card"><h2>${L.whoQ}</h2>${choices(L.who,'pickWho')}</div>`;
    speak(L.hello+'. '+L.whoQ);
  }
  if(view==='id'){ h=`<div class="crumb">${esc(L.who[S.who][1])}</div><h1>${L.idQ}</h1><div class="card">${choices(L.ids,'pickId')}</div><div class="row"><button class="btn" onclick="go('home')">${L.back}</button></div>`; speak(L.idQ);}
  if(view==='task'){ h=`<div class="crumb">${esc(L.who[S.who][1])} · ${esc(L.ids[S.id][1])}</div><h1>${L.taskQ}</h1><div class="card">${choices(L.tasks,'pickTask')}</div><div class="row"><button class="btn" onclick="go('id')">${L.back}</button></div>`; speak(L.taskQ);}
  if(view==='step'){ const steps=FLOW[S.task][S.lang]; const [ti,body,tip]=steps[S.i]; const n=steps.length;
    const extra = S.who==='disab' && S.i===0 ? `<div class="tip">${S.lang==='ko'?'혼자 하기 어렵다면 발급기관 창구에서 직원 도움을 요청할 수 있어요. 화면 읽기 기능(톡백·보이스오버)을 켜면 이 안내도 읽어 줘요.':'If it is hard to do alone, ask staff at the issuing office. Turn on TalkBack/VoiceOver to have this guide read aloud.'}</div>`:
                  S.who==='foreign' && S.id!=='alien' && S.i===0 ? `<div class="warn">${S.lang==='ko'?'외국인은 보통 외국인등록증을 써요. 신분증 종류를 다시 확인해 주세요.':'Foreign residents usually use the Residence card. Please check your ID type.'}</div>`:'';
    h=`<div class="crumb">${esc(L.who[S.who][1])} · ${esc(L.ids[S.id][1])} · ${esc(L.tasks[S.task][1])}</div>
      <div class="progress" aria-hidden="true"><i style="width:${(S.i+1)/n*100}%"></i></div><div class="muted" style="font-size:.85rem">${L.stepOf(S.i+1,n)}</div>
      <div class="card"><h1>${esc(ti)}</h1><p class="step">${esc(body).replace(/\n/g,'<br>')}</p>${tip?`<div class="tip">💡 ${esc(tip)}</div>`:''}${extra}
      <div class="row"><button class="btn speak" onclick="speakNow(${JSON.stringify(ti+'. '+body+'. '+tip).replace(/"/g,'&quot;')})">${L.read}</button><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="${OFFICIAL}" target="_blank" rel="noreferrer">${L.official}</a></div></div>
      <div class="row">${S.i>0?`<button class="btn" onclick="S.i--;go('step')">${L.back}</button>`:`<button class="btn" onclick="go('task')">${L.back}</button>`}
      ${S.i<n-1?`<button class="btn primary" onclick="S.i++;go('step')">${L.next}</button>`:`<button class="btn primary" onclick="go('home')">${L.done}</button>`}</div>`;
    speak(ti+'. '+body);
  }
  if(view==='visit'){ h=visitView(); }
  if(view==='staff'){ h=staffView(); }
  $('#app').innerHTML=h; $('#foot').textContent=L.disclaimer; focusMain();
}
function pickWho(k){S.who=k; if(k==='foreign'&&S.lang==='ko'){} if(k==='elder'&&!document.documentElement.style.getPropertyValue('--fs')){toggleFont(true)} go(k==='staff'?'staff':'id')}
function pickId(k){S.id=k;go('task')}
function pickTask(k){S.task=k;S.i=0;go(k==='visit'?'visit':'step')}

   : st===1? `<h3>${ko?'방문자 휴대폰':'Visitor phone'}</h3><canvas class="qr" id="qr" width="29" height="29" aria-label="${ko?'예시 QR(실제 정보 없음)':'Sample QR (no real data)'}"></canvas><p style="font-size:.9rem">${ko?'안내데스크가 QR을 읽으면 동의 화면이 떠요.':'A consent screen appears after the desk scans.'}</p>`
   : st===2? `<h3>${ko?'정보 제공 동의':'Consent'}</h3><p>${ko?'아래 정보만 보내요:':'Only this will be sent:'}</p><ul class="list"><li>${ko?'이름(일부 가림)':'Name (partly hidden)'}</li><li>${ko?'본인 확인 결과':'Identity check result'}</li></ul><p class="muted" style="font-size:.85rem">${ko?'주민등록번호 뒷자리·주소는 보내지 않아요.':'No ID number or address is sent.'}</p><button class="btn primary" onclick="issuePass()">${ko?'동의':'Agree'}</button>`
   : `<h3>${ko?'디지털 방문증':'Digital visitor pass'}</h3><div class="pass"><div style="opacity:.85;font-size:.85rem">${ko?'○○시청 방문증 (예시)':'City Hall pass (sample)'}</div><b>${ko?'홍*동 님':'Hong *-dong'}</b><div>${ko?'출입 구역':'Area'}: ${ko?'민원동 2층':'Civil wing 2F'}</div><div>${ko?'유효 시간':'Valid'}: <span id="left">${V.pass?V.pass.left:''}</span></div></div><p style="font-size:.9rem;margin-top:10px">${ko?'출입문에서 이 화면을 보여 주세요. 나갈 때 \'반납\'을 누르면 끝!':'Show this at the gate. Tap "Return" when you leave.'}</p>${st===3?`<button class="btn" onclick="V.stage=4;clearInterval(V.timer);go('visit')">${ko?'반납하기':'Return pass'}</button>`:''}`;
  const desk = st<2? `<h3>${ko?'안내데스크 화면':'Front desk'}</h3><p>${ko?'예전: 실물 신분증을 받아 보관 → 출입증 대여\n분실·개인정보 노출 걱정':'Before: keep the visitor\'s physical ID as a deposit'}</p>${st===1?`<button class="btn primary" onclick="V.stage=2;go('visit')">${ko?'QR 읽기':'Scan QR'}</button>`:''}`
   : st===2? `<h3>${ko?'안내데스크 화면':'Front desk'}</h3><p>${ko?'방문자 동의를 기다리는 중…':'Waiting for consent…'}</p>`
   : st===3? `<h3>${ko?'안내데스크 화면':'Front desk'}</h3><div class="tip">✔ ${ko?'본인 확인 완료':'Identity verified'}</div><dl class="kv"><dt>${ko?'방문자':'Visitor'}</dt><dd>${ko?'홍*동':'Hong *-dong'}</dd><dt>${ko?'방문증':'Pass'}</dt><dd>${ko?'디지털 발급 (실물 신분증 보관 안 함)':'Digital (no ID kept)'}</dd><dt>${ko?'기록':'Log'}</dt><dd>${ko?'입·퇴실 시각만 저장':'Entry/exit time only'}</dd></dl>`
   : `<h3>${ko?'안내데스크 화면':'Front desk'}</h3><div class="tip">✔ ${ko?'방문증 반납 완료 · 신분증을 맡기지 않았어요':'Pass returned · no ID was held'}</div>`;
  return `<div class="crumb">${esc(t().tasks.visit[1])}</div><h1>${ko?'신분증을 맡기지 않고 들어가요':'Enter without leaving your ID'}</h1>
   <p class="muted">${ko?'지금은 관공서에서 출입증을 받을 때 신분증을 담보로 맡겨요. 모바일신분증은 맡길 수 없어서 불편했죠. 모두ID는 모바일신분증으로 확인한 뒤 디지털 방문증을 내주는 방법을 제안해요.':'Today offices keep your physical ID as a deposit for a visitor pass, which Mobile ID cannot do. Modu ID proposes issuing a digital visitor pass after a Mobile ID check.'}</p>
   <div class="two"><div class="phone">${phone}</div><div class="desk">${desk.replace(/\n/g,'<br>')}</div></div>
   <div class="row"><button class="btn" onclick="V={stage:0,pass:null,timer:null};go('task')">${t().back}</button>${st>=4?`<button class="btn primary" onclick="V={stage:0,pass:null,timer:null};go('visit')">${ko?'다시 보기':'Replay'}</button>`:''}</div>`;
}
function issuePass(){ V.stage=3; let s=2*60*60; V.pass={left:''}; const f=()=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60); V.pass.left=(S.lang==='ko'?`${h}시간 ${m}분 남음`:`${h}h ${m}m left`); const el=$('#left'); if(el) el.textContent=V.pass.left; s-=60;}; f(); clearInterval(V.timer); V.timer=setInterval(f,1000); go('visit'); }
function drawQR(){ const c=$('#qr'); if(!c)return; const g=c.getContext('2d'); g.fillStyle='#fff';g.fillRect(0,0,29,29); g.fillStyle='#000';
  const fin=(x,y)=>{g.fillRect(x,y,7,7);g.fillStyle='#fff';g.fillRect(x+1,y+1,5,5);g.fillStyle='#000';g.fillRect(x+2,y+2,3,3)}; fin(0,0);fin(22,0);fin(0,22);
  let r=7; for(let y=0;y<29;y++)for(let x=0;x<29;x++){ if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue; r=(r*1103515245+12345)&0x7fffffff; if(r%3===0)g.fillRect(x,y,1,1);} }
new MutationObserver(drawQR).observe(document.getElementById('app'),{childList:true});

   <li>${ko?'어르신·장애인에게는 휴대폰을 대신 조작하지 말고 단계를 말로 안내':'Guide older or disabled visitors verbally; do not operate their phone'}</li>
   <li>${ko?'외국인에게는 외국인등록증 여부 확인':'Check that foreign visitors use the residence card'}</li></ul></div>
  <div class="card"><h2>${ko?'신분증 담보 대신 디지털 방문증':'Digital pass instead of ID deposit'}</h2><p>${ko?'모바일신분증으로 본인 확인 → 디지털 방문증 발급 → 퇴실 때 반납. 실물 신분증을 보관하지 않아 분실·개인정보 노출 위험이 줄어요.':'Verify with Mobile ID → issue digital pass → return on exit. No physical ID is kept.'}</p><button class="btn primary" onclick="S.task='visit';S.id='resident';go('visit')">${ko?'시연 보기':'See demo'}</button></div>
  <div class="row"><button class="btn" onclick="go('home')">${t().back}</button></div>`;
}

function toggleFont(force){ const on=force===true?true:$('#tFont').getAttribute('aria-pressed')!=='true'; document.documentElement.style.setProperty('--fs',on?1.25:1); $('#tFont').setAttribute('aria-pressed',on); }
function toggleHc(){ const on=!document.body.classList.contains('hc'); document.body.classList.toggle('hc',on); $('#tHc').setAttribute('aria-pressed',on); }
function toggleVoice(){ S.voice=!S.voice; $('#tVoice').setAttribute('aria-pressed',S.voice); if(!S.voice) stopVoice(); }
function toggleLang(){ S.lang=S.lang==='ko'?'en':'ko'; document.documentElement.lang=S.lang; $('#tLang').textContent=S.lang==='ko'?'EN':'한국어';
  $('#demoNote').textContent=S.lang==='ko'?'[출품용 시연판] 2026 모바일신분증 아이디어 공모전 출품용 시연(PoC) 프로토타입입니다. 정부·한국조폐공사 공식 서비스가 아니며, 실제 개인정보를 수집하거나 인증을 수행하지 않습니다.':'[Contest demo] PoC prototype for the 2026 Mobile ID Idea Contest. Not an official government or KOMSCO service. No personal data is collected and no real authentication is performed.';
  const view = !S.who?'home': S.who==='staff'&&!S.task?'staff': !S.id?'id': !S.task?'task': S.task==='visit'?'visit':'step'; go(view); }
