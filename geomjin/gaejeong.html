<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연도별 개정 diff | 검진맵</title>
<meta name="description" content="국가건강검진 연도별 변경 사항을 '변경 전 → 변경 후' 표로. 2018 대개편, 2019 20~30대 확대·폐암검진, 2021 영유아 8회, 2025 C형간염·골밀도·정신건강, 2026 폐기능검사·출장검진, 2027 흉부X선 50세·학생검진 공단 위탁, 2028 대장내시경 예정.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head"><h1>연도별 개정 diff</h1><p>검진기관 실무자용. 매년 무엇이 어떻게 바뀌었는지 "변경 전 → 변경 후"로. 수검자 안내문·청구 규칙을 갱신할 때 이 표부터 보세요.</p></div>
  <div class="filter-bar">
    <input type="search" id="q" placeholder="검색: 골밀도, 폐암, 출장검진, 본인부담…">
    <label class="small"><input type="checkbox" id="onlyPending"> 예정 사항만</label>
    <button class="btn btn-ghost btn-sm print-btn" onclick="window.print()">인쇄</button>
  </div>
  <div id="list"></div>
  <div class="disclaimer">2018~2026은 시행된 고시·법령 기준, 2027~2028은 위원회 의결·종합계획상 예정 사항으로 고시 개정 시 확정됩니다. 원문: <a href="silsi-gijun.html">실시기준 고시</a> · <a href="yeoksa.html">연혁</a>.</div>
</main>
<div id="site-footer"></div>
<script src="assets/app.js"></script>
<script src="data/changes.js"></script>
<script>
(function(){
  var E = GM.esc, C = window.GM_CHANGES;
  function render(){
    var s = (document.getElementById('q').value||'').trim().toLowerCase(), op = document.getElementById('onlyPending').checked;
    document.getElementById('list').innerHTML = C.slice().reverse().map(function(y){
      if (op && !y.pending) return '';
      var rows = y.items.filter(function(r){ return !s || r.join(' ').toLowerCase().indexOf(s)>=0; });
      if (!rows.length) return '';
      return '<div class="section"><h2>'+E(y.title)+(y.pending?' <span class="pill amber">예정</span>':' <span class="pill green">시행</span>')+'</h2><div class="table-scroll"><table class="compact"><thead><tr><th>항목</th><th>변경 전</th><th>변경 후</th><th>근거</th></tr></thead><tbody>' +
        rows.map(function(r){ return '<tr><td><b>'+E(r[0])+'</b></td><td>'+E(r[1])+'</td><td>'+E(r[2])+'</td><td class="small">'+E(r[3])+'</td></tr>'; }).join('') + '</tbody></table></div></div>';
    }).join('') || '<p>검색 결과가 없습니다.</p>';
  }
  ['q','onlyPending'].forEach(function(id){ var el = document.getElementById(id); el.addEventListener('input', render); el.addEventListener('change', render); });
  render();
})();
</script>
</body>
</html>
