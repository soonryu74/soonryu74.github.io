<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대상별 상세 | 검진맵</title>
<meta name="description" content="영유아건강검진 8회 회차별 항목·발달선별검사·구강 4회, 학생 건강검사(학교건강검사규칙)와 2027 공단 위탁 개편, 근로자 일반·특수·배치전·수시·임시 건강진단과 판정 구분, 장애인·노인·의료급여 생애전환기검진.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head"><h1>대상별 상세</h1><p>일반 성인 검진 밖에 있는 검진들. 영유아·학생·근로자·장애인·노인·의료급여, 각각 다른 법과 다른 항목.</p></div>
  <div class="stage-nav country-tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="disclaimer" id="disc"></div>
</main>
<div id="site-footer"></div>
<script src="assets/app.js"></script>
<script src="data/daesang.js"></script>
<script>
(function(){
  var E = GM.esc, D = window.GM_DAESANG;
  var tabs = document.getElementById('tabs'), panels = document.getElementById('panels');
  tabs.innerHTML = D.sections.map(function(s,i){ return '<button data-i="'+i+'"'+(i===0?' class="on"':'')+'>'+E(s.ico)+' '+E(s.title)+'</button>'; }).join('');
  panels.innerHTML = D.sections.map(function(s,i){
    return '<div class="cpanel'+(i===0?' on':'')+'" id="dp'+i+'"><div class="section"><h2>'+E(s.ico)+' '+E(s.title)+'</h2>' +
      '<dl class="kv"><dt>근거</dt><dd>'+E(s.basis)+'</dd><dt>대상</dt><dd>'+E(s.target)+'</dd><dt>비용</dt><dd>'+E(s.cost)+'</dd>'+(s.org?'<dt>실시기관</dt><dd>'+E(s.org)+'</dd>':'')+'</dl>' +
      '<p>'+E(s.intro)+'</p>' +
      (s.tables||[]).map(function(t){ return '<h3>'+E(t.title)+(t.verify?' <span class="pill amber">⚠</span>':'')+'</h3>'+(t.note?'<p class="small">'+E(t.note)+'</p>':'')+'<div class="table-scroll"><table class="compact"><thead><tr>'+t.head.map(function(h){ return '<th>'+E(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){ return '<tr>'+r.map(function(c,ci){ return '<td>'+(ci===0?'<b>'+E(c)+'</b>':E(c))+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>'; }).join('') +
      (s.callouts||[]).map(function(c){ return '<div class="callout '+E(c.cls||'tip')+'"><span class="t">'+E(c.t)+'</span>'+E(c.body)+'</div>'; }).join('') +
      (s.sources&&s.sources.length?'<p class="small">출처: '+s.sources.map(function(u){ return '<a href="'+E(u[1])+'" target="_blank" rel="noopener">'+E(u[0])+' ↗</a>'; }).join(' · ')+'</p>':'') +
      '</div></div>';
  }).join('');
  tabs.addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(!b) return; var i = b.getAttribute('data-i'); tabs.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); }); panels.querySelectorAll('.cpanel').forEach(function(p){ p.classList.toggle('on', p.id==='dp'+i); }); location.hash = D.sections[i].id; });
  var h = location.hash.replace('#',''); if (h){ var idx = D.sections.findIndex(function(s){ return s.id===h; }); if (idx>=0) tabs.querySelectorAll('button')[idx].click(); }
  document.getElementById('disc').textContent = D.note;
})();
</script>
</body>
</html>
