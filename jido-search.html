<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도로 찾기 — 구리·별내 아파트 시세 지도 | 갈매역삼성부동산</title>
<meta name="description" content="지도 위에서 바로 찾는 구리·별내 아파트 실거래 시세. 지역·가격대·평형으로 좁혀보고, 핀을 누르면 최근 실거래가가 나옵니다. 갈매역삼성부동산.">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  :root{ --map-h: 62vh; }
  .jido-wrap{ max-width:1180px; margin:0 auto; padding:0 14px 40px; }
  .jido-head{ padding:18px 4px 12px; }
  .jido-head h1{ margin:0 0 4px; font-size:1.5rem; }
  .jido-head p{ margin:0; color:var(--muted); font-size:.95rem; }

  /* 필터 바 */
  .filters{ position:sticky; top:0; z-index:30; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:12px 12px;
    box-shadow:var(--shadow); margin:6px 0 12px; }
  .frow{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  .fgrp{ display:flex; flex-direction:column; gap:5px; }
  .fgrp .lab{ font-size:.72rem; color:var(--muted); font-weight:700; letter-spacing:.02em; }
  .pills{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill{ border:1px solid var(--line); background:#fff; color:#39485a;
    padding:6px 12px; border-radius:999px; font-size:.85rem; cursor:pointer;
    font-weight:600; transition:.12s; white-space:nowrap; }
  .pill:hover{ border-color:#9fb6cf; }
  .pill.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .fspacer{ flex:1; }
  .fcount{ font-size:.86rem; color:var(--muted); font-weight:600; }
  .fcount b{ color:var(--accent); font-size:1.02rem; }

  /* 지도 + 목록 레이아웃 */
  .jido-main{ display:grid; grid-template-columns: 1fr 360px; gap:14px; align-items:start; }
  #kmap{ width:100%; height:var(--map-h); border-radius:14px; border:1px solid var(--line);
    box-shadow:var(--shadow); background:#e9eef3; }
  .maphint{ font-size:.8rem; color:var(--muted); margin:6px 2px 0; }

  .list-col{ position:sticky; top:96px; }
  .list-head{ font-size:.85rem; font-weight:700; color:#39485a; margin:0 2px 8px;
    display:flex; align-items:center; gap:6px; }
  .list{ max-height:calc(var(--map-h) + 26px); overflow:auto; padding-right:4px;
    display:flex; flex-direction:column; gap:8px; }
  .lcard{ border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#fff;
    cursor:pointer; transition:.12s; }
  .lcard:hover{ border-color:#9fb6cf; box-shadow:0 3px 12px rgba(20,40,70,.08); }
  .lcard.active{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(14,138,107,.15); }
  .lcard .nm{ font-weight:800; font-size:.98rem; color:#1c2733; }
  .lcard .dg{ font-size:.74rem; color:var(--muted); font-weight:700; margin-left:5px; }
  .lcard .pr{ font-size:1.02rem; font-weight:800; color:#c0392b; margin-top:3px; }
  .lcard .sub{ font-size:.78rem; color:var(--muted); margin-top:2px; }
  .lcard .chips{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }
  .lcard .chip{ font-size:.7rem; background:#eef3f8; color:#456; border-radius:6px; padding:2px 7px; font-weight:700; }
  .lcard .chip.by{ background:#efe7fb; color:#6b3fa0; }
  .empty{ text-align:center; color:var(--muted); padding:30px 10px; font-size:.9rem; }

  /* 지도 가격 라벨(호주식 price pill) */
  .mk{ position:relative; transform:translate(-50%,-100%); }
  .mk .pin{ background:#1f6fd1; color:#fff; font-weight:800; font-size:12px;
    padding:4px 9px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.28);
    border:1.5px solid #fff; cursor:pointer; }
  .mk .pin::after{ content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#fff; }
  .mk.t1 .pin{ background:#2e9e6b; } .mk.t2 .pin{ background:#1f6fd1; }
  .mk.t3 .pin{ background:#e0872a; } .mk.t4 .pin{ background:#c0392b; }
  .mk.by .pin{ background:#7c4dc4; }
  .mk.active .pin{ transform:scale(1.12); box-shadow:0 4px 12px rgba(0,0,0,.4); z-index:5; }

  .iwbox{ padding:9px 11px; font-size:12px; line-height:1.55; min-width:150px; }
  .iwbox b.t{ font-size:13px; } .iwbox .p{ color:#c0392b; font-weight:800; }
  .iwbox a{ color:#1f6fd1; font-weight:700; text-decoration:none; }

  @media(max-width:820px){
    :root{ --map-h: 52vh; }
    .jido-main{ grid-template-columns:1fr; }
    .list-col{ position:static; }
    .list{ max-height:none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="budongsan.html">🏢 갈매동 부동산 <span class="tag">갈매역삼성부동산</span></a>
    <nav class="site-nav">
      <a href="galmae.html">갈매동 시세</a>
      <a href="jido-search.html" class="active">지도로 찾기</a>
      <a href="insight.html">실거래 인사이트</a>
      <a href="silgeorae-lab.html">실거래가 분석</a>
      <a href="store.html">매물</a>
      <a href="jaryo.html">자료실</a>
    </nav>
  </div>
</header>

<div class="jido-wrap">
  <div class="jido-head">
    <h1>🗺️ 지도로 찾기</h1>
    <p>지도 위에서 바로 고르세요. 지역·가격대·평형으로 좁히면 딱 맞는 단지만 남습니다. 핀을 누르면 최근 실거래가가 나옵니다.</p>
  </div>

  <div class="filters">
    <div class="frow">
      <div class="fgrp">
        <span class="lab">지역</span>
        <div class="pills" id="fRegion"></div>
      </div>
      <div class="fgrp">
        <span class="lab">가격대 (최근 실거래)</span>
        <div class="pills" id="fPrice">
          <span class="pill on" data-v="all">전체</span>
          <span class="pill" data-v="0-30000">3억 이하</span>
          <span class="pill" data-v="30000-50000">3~5억</span>
          <span class="pill" data-v="50000-70000">5~7억</span>
          <span class="pill" data-v="70000-999999">7억 이상</span>
        </div>
      </div>
      <div class="fgrp">
        <span class="lab">평형</span>
        <div class="pills" id="fArea">
          <span class="pill on" data-v="all">전체</span>
          <span class="pill" data-v="0-66">소형 ~20평</span>
          <span class="pill" data-v="66-99">중형 20~30평</span>
          <span class="pill" data-v="99-999">대형 30평~</span>
        </div>
      </div>
      <div class="fspacer"></div>
      <div class="fcount"><b id="cnt">0</b>개 단지</div>
    </div>
  </div>

  <div class="jido-main">
    <div>
      <div id="kmap"></div>
      <div class="maphint" id="mapNote">지도를 불러오는 중…</div>
    </div>
    <div class="list-col">
      <div class="list-head">📋 목록 <span style="color:var(--muted);font-weight:600">· 가까운 순 / 거래 많은 순</span></div>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<script src="data/complexes.js"></script>
<script src="data/guri-complexes.js"></script>
<script src="data/byeollae-complexes.js"></script>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=0e6cb69e47426469d3e99092e2dcce1d&libraries=services&autoload=false"></script>
<script>
const TEL="0315754944", TELV="031-575-4944";
function eok(m){ m=Math.round(m||0); const e=Math.floor(m/10000), r=m%10000; return (e?e+"억":"")+(r?(e?" ":"")+r.toLocaleString()+"만":"")||"0"; }
function eokS(m){ return (m/10000).toFixed(1)+"억"; }

/* ---------- 데이터 통합: 구리(157) + 별내 + 갈매동 road 보강 ---------- */
const ROADMAP={}; (typeof COMPLEXES!=='undefined'?COMPLEXES:[]).forEach(c=>{ if(c.road) ROADMAP[c.name]=c.road; });
function unify(arr, region){
  return (arr||[]).map(c=>{
    const lat=c.latest||{};
    return {
      name:c.name, dong:c.dong||'갈매동', region,
      min:c.min, max:c.max, price:lat.price||c.max||c.min,
      area:lat.area||(c.areas&&c.areas[0])||0, floor:lat.floor||'',
      date:lat.date||'', count:c.count||0, buildYear:c.buildYear||'',
      areas:c.areas||[], road:c.road||ROADMAP[c.name]||''
    };
  });
}
let DATA = [
  ...unify(typeof GURI!=='undefined'?GURI:[], 'guri'),
  ...unify(typeof BYEOLLAE!=='undefined'?BYEOLLAE:[], 'by')
];
// 중복 제거(같은 동·단지명)
const seen=new Set();
DATA = DATA.filter(d=>{ const k=d.region+'|'+d.dong+'|'+d.name; if(seen.has(k))return false; seen.add(k); return true; });

/* 지역 필터 옵션: 전체 / 갈매동 / 구리 그 외 / 별내(있으면) */
const hasBy = DATA.some(d=>d.region==='by');
const regionOpts=[{v:'all',t:'전체'},{v:'galmae',t:'갈매동'},{v:'guri',t:'구리 그 외'}];
if(hasBy) regionOpts.push({v:'by',t:'별내 🟣'});

const F={region:'all', price:'all', area:'all'};

function inRange(v,spec){ if(spec==='all')return true; const [a,b]=spec.split('-').map(Number); return v>=a && v<b; }
function matchRegion(d){
  if(F.region==='all') return true;
  if(F.region==='galmae') return d.region==='guri' && d.dong==='갈매동';
  if(F.region==='guri') return d.region==='guri' && d.dong!=='갈매동';
  if(F.region==='by') return d.region==='by';
  return true;
}
function matchArea(d){ if(F.area==='all')return true;
  return (d.areas.length?d.areas:[d.area]).some(a=>inRange(a,F.area)); }
function filtered(){
  return DATA.filter(d=> matchRegion(d) && inRange(d.price,F.price) && matchArea(d))
             .sort((a,b)=> b.count-a.count);
}

/* ---------- 필터 UI ---------- */
const fRegionEl=document.getElementById('fRegion');
regionOpts.forEach((o,i)=>{ const s=document.createElement('span');
  s.className='pill'+(i===0?' on':''); s.dataset.v=o.v; s.textContent=o.t; fRegionEl.appendChild(s); });
function wire(groupId, key){
  document.getElementById(groupId).addEventListener('click',e=>{
    const p=e.target.closest('.pill'); if(!p)return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove('on'));
    p.classList.add('on'); F[key]=p.dataset.v; render();
  });
}
wire('fRegion','region'); wire('fPrice','price'); wire('fArea','area');

/* ---------- 지도 ---------- */
let map, geocoder, ps, GEO={}, markers={}, activeName=null;
const listEl=document.getElementById('list'), cntEl=document.getElementById('cnt'), noteEl=document.getElementById('mapNote');

function tierClass(d){ if(d.region==='by')return 'by';
  const p=d.price||0; if(p<30000)return 't1'; if(p<50000)return 't2'; if(p<70000)return 't3'; return 't4'; }

function makeMarker(d, pos){
  const el=document.createElement('div'); el.className='mk '+tierClass(d);
  el.innerHTML='<div class="pin">'+eokS(d.price)+'</div>';
  const ov=new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:1, xAnchor:.5, zIndex:3});
  el.querySelector('.pin').addEventListener('click',()=>select(d.name,true));
  markers[d.name]={ov,el,pos,d};
  return ov;
}

function geocodeOne(d, cb){
  if(GEO[d.name]){ cb(GEO[d.name]); return; }
  const done=p=>{ if(p){GEO[d.name]=p;} cb(p); };
  if(d.road){
    geocoder.addressSearch(d.road,(res,st)=>{
      if(st===kakao.maps.services.Status.OK && res[0]) return done(new kakao.maps.LatLng(res[0].y,res[0].x));
      keywordGeo(d,done);
    });
  } else keywordGeo(d,done);
}
function keywordGeo(d, done){
  const sgg = d.region==='by' ? '남양주시 별내' : '구리시 '+(d.dong||'');
  ps.keywordSearch(sgg+' '+d.name,(res,st)=>{
    if(st===kakao.maps.services.Status.OK && res[0]) return done(new kakao.maps.LatLng(res[0].y,res[0].x));
    done(null);
  });
}

let renderSeq=0;
function render(){
  const list=filtered(); cntEl.textContent=list.length;
  // 목록
  listEl.innerHTML = list.length? '' : '<div class="empty">조건에 맞는 단지가 없습니다.<br>필터를 넓혀보세요.</div>';
  list.forEach(d=>{
    const c=document.createElement('div'); c.className='lcard'; c.dataset.name=d.name;
    c.innerHTML=`<div><span class="nm">${d.name}</span><span class="dg">${d.dong}</span></div>
      <div class="pr">${eok(d.price)}</div>
      <div class="sub">최근 ${d.area?d.area+'㎡·':''}${d.floor?d.floor+'층·':''}${d.date?d.date.slice(2).replace(/-/g,'.'):''} · 시세 ${eokS(d.min)}~${eokS(d.max)}</div>
      <div class="chips">${d.buildYear?`<span class="chip">${d.buildYear}년</span>`:''}
        <span class="chip">거래 ${d.count}건</span>
        ${d.region==='by'?'<span class="chip by">별내</span>':''}</div>`;
    c.addEventListener('click',()=>select(d.name,true));
    listEl.appendChild(c);
  });
  if(!map) return;
  // 지도 마커 갱신
  const seq=++renderSeq;
  Object.values(markers).forEach(m=>m.ov.setMap(null));
  const keep=new Set(list.map(d=>d.name));
  Object.keys(markers).forEach(n=>{ if(!keep.has(n)) delete markers[n]; });
  const bounds=new kakao.maps.LatLngBounds(); let plotted=0, pending=list.length;
  if(!pending){ noteEl.textContent='표시할 단지가 없습니다.'; return; }
  noteEl.textContent='지도에 표시하는 중…';
  list.forEach(d=>{
    geocodeOne(d,pos=>{
      if(seq!==renderSeq) return;           // 필터가 바뀌면 이전 렌더 무시
      pending--;
      if(pos){ makeMarker(d,pos).setMap(map); bounds.extend(pos); plotted++; }
      if(pending<=0){
        if(plotted) map.setBounds(bounds);
        noteEl.textContent=`지도에 ${plotted}개 단지 표시 · 핀/목록을 누르면 최근 실거래가가 보입니다.`;
      }
    });
  });
}

let openIw=null;
function select(name, fly){
  activeName=name;
  document.querySelectorAll('.lcard').forEach(c=>c.classList.toggle('active', c.dataset.name===name));
  Object.entries(markers).forEach(([n,m])=>m.el.classList.toggle('active', n===name));
  const card=[...listEl.children].find(c=>c.dataset&&c.dataset.name===name);
  if(card) card.scrollIntoView({block:'nearest',behavior:'smooth'});
  const m=markers[name]; if(!m)return;
  if(fly){ map.panTo(m.pos); if(map.getLevel()>5) map.setLevel(5); }
  const d=m.d;
  if(openIw) openIw.close();
  openIw=new kakao.maps.InfoWindow({content:
    `<div class="iwbox"><b class="t">${d.name}</b> <span style="color:#88919c">${d.dong}</span><br>
     최근 ${d.area?d.area+'㎡·':''}${d.floor?d.floor+'층 ':''}<span class="p">${eok(d.price)}</span><br>
     시세 ${eokS(d.min)}~${eokS(d.max)} · 거래 ${d.count}건<br>
     <a href="tel:${TEL}">📞 문의 ${TELV}</a></div>`});
  openIw.open(map, new kakao.maps.Marker({position:m.pos, opacity:0}));
}

function initMap(){
  if(!(window.kakao && kakao.maps)){ noteEl.textContent='지도를 불러오지 못했습니다. (카카오 개발자센터에서 이 도메인 등록·카카오맵 활성화 필요)'; render(); return; }
  kakao.maps.load(()=>{
    map=new kakao.maps.Map(document.getElementById('kmap'),{center:new kakao.maps.LatLng(37.6412,127.1206),level:6});
    geocoder=new kakao.maps.services.Geocoder();
    ps=new kakao.maps.services.Places();
    kakao.maps.event.addListener(map,'click',()=>{ if(openIw){openIw.close();openIw=null;} });
    render();
  });
}
initMap();
</script>
<script src="assets/js/a11y.js" defer></script>
</body>
