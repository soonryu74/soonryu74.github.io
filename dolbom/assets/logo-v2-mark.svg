<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="모심 심볼">
  <defs>
    <linearGradient id="mgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c194"/><stop offset="1" stop-color="#c0a677"/>
    </linearGradient>
    <linearGradient id="mgreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6b41"/><stop offset="1" stop-color="#33502f"/>
    </linearGradient>
  </defs>

  <!-- 감싸는 두 손: 왼(그린)·오른(골드) -->
  <path d="M120 200 C 84 200 52 178 44 132 C 41 116 60 112 66 126 C 80 160 102 172 120 172 Z"
        fill="url(#mgreen)"/>
  <path d="M120 200 C 156 200 188 178 196 132 C 199 116 180 112 174 126 C 160 160 138 172 120 172 Z"
        fill="url(#mgold)"/>

  <!-- 열린 하트(포용): 왼쪽 그린 획, 오른쪽 골드 획 -->
  <path d="M120 96 C 108 66 66 70 66 102 C 66 130 96 150 120 168"
        fill="none" stroke="url(#mgreen)" stroke-width="13" stroke-linecap="round"/>
  <path d="M120 96 C 132 66 174 70 174 102 C 174 130 144 150 120 168"
        fill="none" stroke="url(#mgold)" stroke-width="13" stroke-linecap="round"/>

  <!-- 품 안의 사람(어르신): 머리 + 하트 몸 -->
  <circle cx="120" cy="84" r="16" fill="#7d9a66"/>
  <path d="M120 150 C 104 132 98 120 98 110 C 98 100 108 98 114 105 C 117 108 120 112 120 112
           C 120 112 123 108 126 105 C 132 98 142 100 142 110 C 142 120 136 132 120 150 Z"
        fill="#7d9a66"/>
</svg>
