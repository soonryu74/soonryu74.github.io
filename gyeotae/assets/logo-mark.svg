  <!-- verified badge (gold, bottom-right) -->
  <circle cx="356" cy="356" r="82" fill="url(#g-badge)"/>
  <circle cx="356" cy="356" r="72" fill="url(#g-gold)"/>
  <path d="M320 357 L346 383 L396 328" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
