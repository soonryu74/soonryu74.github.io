<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멜번방주교회 목장 나눔터 — 들어가기</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="멜번방주교회 목장 일기와 기도제목을 목자와 목사가 나누는 곳입니다.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .hero{text-align:center; padding:36px 16px 8px}
  .hero .logo{height:116px; width:auto; display:block; margin:0 auto}
  .hero .church{font-size:23px; font-weight:800; letter-spacing:-.03em; color:#123c74; margin-top:14px}
  .hero .church .amp{font-weight:500; color:var(--muted)}
  .hero .church .alf{color:#1b7a3e}
  .hero .tagline{font-size:11.5px; letter-spacing:.16em; color:var(--muted); margin-top:3px}
  .hero h1{font-size:24px; margin:22px 0 6px; letter-spacing:-.03em;
    padding-top:18px; border-top:1px solid var(--line); display:inline-block; padding-left:26px; padding-right:26px}
  .hero p{color:var(--muted); margin:0; font-size:15.5px}
  .wrap{max-width:440px}
  .foot{text-align:center; color:var(--muted); font-size:13.5px; margin-top:22px}
  .foot a{color:var(--muted)}
  #setup{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img class="logo" src="assets/logo.png" alt="멜번방주교회 로고" width="153" height="120">
    <div class="church">멜번방주교회 <span class="amp">&amp;</span> <span class="alf">ALF</span></div>
    <div class="tagline">ONE CHURCH TWO CONGREGATION</div>
    <h1>목장 나눔터</h1>
    <p>한 주 목장 이야기와 기도제목을 담는 곳</p>
  </div>

  <!-- 로그인 -->
  <div class="card" id="login">
    <h2>들어가기</h2>
    <p class="desc">목사님께 받으신 아이디와 비밀번호를 넣어 주세요.</p>
    <form id="form-login" autocomplete="on">
      <label for="lid">아이디</label>
      <input id="lid" type="text" inputmode="latin" autocapitalize="none" autocorrect="off"
             autocomplete="username" placeholder="예: kimmokja" required>
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <div class="msg" id="msg-login"></div>
      <div class="row" style="margin-top:18px">
        <button class="primary" type="submit" id="btn-login" style="flex:1">들어가기</button>
      </div>
    </form>
    <p class="foot">
      비밀번호를 잊으셨으면 목사님께 말씀해 주세요. 새로 정해 드립니다.<br>
      <a href="#" id="to-setup">이 교회에서 처음 시작하시나요?</a>
    </p>
  </div>

  <!-- 최초 설치 (목사 계정 1개) -->
  <div class="card" id="setup">
    <h2>처음 한 번만 — 목사님 계정 만들기</h2>
    <p class="desc">따로 받으신 등록 코드를 넣으면 목사님 계정이 만들어집니다.
        내려받거나 깔 것은 없습니다. 이 절차는 교회마다 한 번뿐이고, 그 뒤로는 이 화면을 쓰지 않습니다.</p>
    <form id="form-setup">
      <label for="scode">등록 코드</label>
      <input id="scode" type="text" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" required>
      <label for="sname">이름</label>
      <input id="sname" type="text" placeholder="예: 홍길동" required>
      <label for="slid">쓰실 아이디</label>
      <input id="slid" type="text" inputmode="latin" autocapitalize="none" autocorrect="off"
             placeholder="영문 소문자와 숫자로 3자 이상" required>
      <label for="spw">비밀번호</label>
      <input id="spw" type="password" autocomplete="new-password" placeholder="8자 이상" required>
      <div class="msg" id="msg-setup"></div>
      <div class="row" style="margin-top:18px">
        <button type="button" class="ghost" id="to-login">뒤로</button>
        <button class="primary" type="submit" id="btn-setup" style="flex:1">목사님 계정 만들기</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
(function () {
  var C = window.CHURCH, $ = C.$;

  // 이미 로그인돼 있으면 바로 제 화면으로
  C.me().then(function (p) {
    if (p) location.replace(p.role === 'pastor' ? 'moksa.html' : 'mokjang.html');
  });

  $('#to-setup').addEventListener('click', function (e) {
    e.preventDefault(); $('#login').style.display = 'none'; $('#setup').style.display = 'block';
  });
  $('#to-login').addEventListener('click', function () {
    $('#setup').style.display = 'none'; $('#login').style.display = 'block';
  });

  $('#form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    var b = $('#btn-login'); b.disabled = true; b.textContent = '확인하는 중…';
    try {
      await C.signIn($('#lid').value, $('#pw').value);
      var p = await C.me();
      if (!p) throw new Error('계정 정보를 찾지 못했습니다. 목사님께 알려 주세요.');
      location.replace(p.role === 'pastor' ? 'moksa.html' : 'mokjang.html');
    } catch (err) {
      C.say($('#msg-login'), err.message, 'err');
      b.disabled = false; b.textContent = '들어가기';
    }
  });

  $('#form-setup').addEventListener('submit', async function (e) {
    e.preventDefault();
    var b = $('#btn-setup'); b.disabled = true; b.textContent = '만드는 중…';
    try {
      await C.callAdmin({
        action: 'bootstrap',
        setup_code: $('#scode').value,
        login_id: $('#slid').value,
        password: $('#spw').value,
        name: $('#sname').value
      });
      await C.signIn($('#slid').value, $('#spw').value);
      location.replace('moksa.html');
    } catch (err) {
      C.say($('#msg-setup'), err.message, 'err');
      b.disabled = false; b.textContent = '목사님 계정 만들기';
    }
  });
})();
</script>
</body>
</html>
