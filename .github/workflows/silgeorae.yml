name: 실거래가 자동 갱신 (구리시)

# 매일 새벽 자동 + 수동 실행. DATA_GO_KR_KEY 시크릿이 있어야 동작합니다.
# 갈매동 카드/홍보/비교(data/complexes.js) + 구리 표/분석(data/guri-complexes.js)을 재생성합니다.
on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = KST 05:00 매일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 실거래가 수집 → 화면 데이터 재생성
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::warning::DATA_GO_KR_KEY 시크릿이 없습니다. 공공데이터포털에서 서비스키를 발급받아 저장소 Secret으로 등록하세요. (건너뜀)"
            exit 0
          fi
          python3 scripts/build_galmae_data.py

      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- data/complexes.js data/guri-complexes.js data/byeollae-complexes.js; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/complexes.js data/guri-complexes.js data/byeollae-complexes.js
            git commit -m "실거래가 자동 갱신 (구리·별내, 국토부 실거래가)"
            git push
          fi
