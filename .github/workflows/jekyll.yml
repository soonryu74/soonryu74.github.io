name: Jekyll Site CI

# 봇(GITHUB_TOKEN)이 만든 데이터 갱신 커밋은 push 이벤트로 이 워크플로를 트리거하지
# 못한다(깃허브 재귀 방지 정책). 그래서 데이터를 커밋·push하는 워크플로가 끝나면
# workflow_run으로도 배포한다. 아래 목록은 .github/workflows 중 git push를 하는 전부이며,
# 새 수집 워크플로를 추가하면 여기에도 이름을 그대로 추가해야 한다.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "실거래가 자동 갱신 (구리시)"
      - "부동산 뉴스·정책 자동 수집"
      - "국정감사 자료 DB 자동 갱신"
      - "상가 상권정보 자동 갱신 (입지분석)"
      - "단지 좌표 미리 계산 (지도)"
    types: [completed]
  workflow_dispatch:

# 여러 수집 워크플로가 비슷한 시각에 끝나면 배포가 겹친다 — 최신 것만 남긴다.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
      - name: Install Bundler and Dependencies
        run: |
          gem install bundler -v 2.5.23
          bundle _2.5.23_ install
      - name: Build Site
        run: bundle exec jekyll build

      # Korea Now (React/Vite 앱) — /korea-now/ 경로에 함께 배포
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: korea-now/package-lock.json
      - name: Build Korea Now
        working-directory: korea-now
        # 기본값은 korea-now/.env.production. 시크릿이 있을 때만 그것이 우선.
        # (빈 문자열 env는 .env.production을 덮어써 버리므로 값이 있을 때만 export)
        env:
          SB_URL: ${{ secrets.KOREA_NOW_SUPABASE_URL }}
          SB_KEY: ${{ secrets.KOREA_NOW_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SB_URL" ]; then export VITE_SUPABASE_URL="$SB_URL"; fi
          if [ -n "$SB_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$SB_KEY"; fi
          npm ci
          npm run build
          grep -q "supabase.co" dist/assets/index-*.js && echo "Supabase URL 포함됨" || echo "::warning::Supabase URL 없음 — DEMO 모드로 배포됨"
          mkdir -p ../_site/korea-now
          cp -r dist/. ../_site/korea-now/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
