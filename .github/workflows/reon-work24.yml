name: 다시ON AI — 고용24 채용·훈련 캐시 갱신

# 고용24 OPEN-API 로 채용정보·훈련과정을 수집해 reon/data/cache/*.json 을 갱신한다.
# WORK24_API_KEY 시크릿(고용24 회원가입 → OPEN-API 신청 → 승인 후 발급)이 있어야 동작하며,
# 없으면 조용히 건너뛴다(화면은 DEMO 표시 유지). 키는 브라우저에 절대 노출되지 않는다.
on:
  schedule:
    - cron: '20 21 * * 0'   # UTC 일 21:20 = KST 월 06:20 주 1회
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 고용24 수집 → reon/data/cache/
        env:
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
        run: |
          if [ -z "$WORK24_API_KEY" ]; then
            echo "::warning::WORK24_API_KEY 시크릿이 없습니다. 고용24 OPEN-API 인증키를 저장소 Secret 으로 등록하세요. (건너뜀, DEMO 유지)"
            exit 0
          fi
          python3 reon/scripts/fetch_work24.py

      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- reon/data/cache; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reon/data/cache
            git commit -m "다시ON AI: 고용24 채용·훈련 캐시 갱신"
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push 경합 — pull --rebase 후 재시도 ($i)"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              sleep $((i*3))
            done
          fi
