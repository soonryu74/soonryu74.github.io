# Jekyll 빌드 설정 — 기본값으로 충분해 비워 둔다.
# (Korea Now 앱이 이 저장소에 있을 때는 여기서 제외 목록을 잡았으나,
#  앱이 soonryu74/korea-now 저장소로 옮겨 가면서 필요 없어졌다.)

# nunchi/test/ 는 앱 테스트 코드라 사이트에 올리지 않는다.
exclude:
  - nunchi/test
  # CareGap: 소스·node_modules는 배포하지 않는다(빌드 결과 caregap/index.html, assets/, data/만 제공)
  - caregap/app
  # 목장 나눔터: 테스트·서버 코드는 사이트에 올리지 않는다(서버 코드는 Supabase에 따로 배포)
  - gajeong/test
  - gajeong/server
  - gajeong/deploy
  # SportsGap AI: 테스트·의존성은 사이트에 올리지 않는다(raw/ 원자료와 evidence/ 는 재현·증빙용으로 제공)
  - sportsgap/tests
  - sportsgap/node_modules
  - sportsgap/test-results
  - sportsgap/playwright-report
  # MoveSafe AI: 테스트·의존성 제외
  - movesafe/tests
  - movesafe/node_modules
  - movesafe/test-results
  - movesafe/playwright-report
