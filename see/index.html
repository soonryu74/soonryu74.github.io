<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크게보기 — 눈이 편한 AI 창</title>
<meta name="description" content="링크 하나로 여는, 눈이 편한 AI 창. 큰 글자, 높은 대비, 버튼 두 개.">
<meta name="theme-color" content="#12161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ===== 접근성 토큰 (CLAUDE.md 6장 — 임의 변경 금지) ===== */
  :root {
    --fs-body: 24px;          /* 3단계: 24 / 32 / 40 */
    --lh: 1.6;                /* 줄 간격 1.5 이상 */
    --ls: 0.12em;             /* 자간 0.12배 이상 (WCAG 1.4.12) */
    --ws: 0.16em;             /* 어간 0.16배 이상 */
    --bg: #ffffff;
    --ink: #12161c;           /* #fff 대비 약 16:1 */
    --ink-2: #3d4754;         /* 최소 4.5:1 — 이보다 밝게 가지 말 것 */
    --line: #6b7683;          /* UI 테두리 3:1 이상 (WCAG 1.4.11) */
    --btn-bg: #12161c;
    --btn-ink: #ffffff;
    --btn-on-bg: #0b3d91;     /* 선택된 토글 배경. 흰 글자 대비 약 11:1 */
    --focus: #0b3d91;
    --touch-min: 48px;        /* KWCAG 6.1.3 대각선 6mm 이상 → 여유 있게 */
  }
  html[data-size="large"]  { --fs-body: 32px; }
  html[data-size="xlarge"] { --fs-body: 40px; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: var(--fs-body);
    line-height: var(--lh);
    letter-spacing: var(--ls);
    word-spacing: var(--ws);
    text-align: left;         /* 양쪽 정렬 금지 */
    word-break: keep-all;     /* 한국어 단어 중간 줄바꿈 방지 */
    display: flex;
    flex-direction: column;
  }
  p { margin: 0; }
  p + p { margin-top: calc(var(--fs-body) * 2); }   /* 문단 간격 2배 */
  u { text-decoration-thickness: 0.1em; text-underline-offset: 0.15em; }

  /* ===== 상단: 글자 크기 3단계 (항상 고정, 숨기지 말 것) ===== */
  .size-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px;
    padding: 8px;
    background: var(--bg);
    border-bottom: 2px solid var(--line);
  }
  .size-bar button {
    flex: 1;
    min-height: var(--touch-min);
    padding: 8px 4px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .size-bar button .glyph { font-weight: 700; }
  .size-bar button[data-size="normal"] .glyph { font-size: 24px; }
  .size-bar button[data-size="large"]  .glyph { font-size: 32px; }
  .size-bar button[data-size="xlarge"] .glyph { font-size: 40px; }
  .size-bar button .label { font-size: 18px; margin-top: 4px; }
  .size-bar button[aria-pressed="true"] {
    background: var(--btn-on-bg);
    border-color: var(--btn-on-bg);
    color: var(--btn-ink);
  }

  /* ===== 본문 ===== */
  main {
    flex: 1;
    padding: 24px 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  #answer { margin-bottom: calc(var(--fs-body) * 2); }
  label[for="question"] { display: block; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: calc(var(--fs-body) * var(--lh) * 3);
    padding: 12px;
    font: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 3px solid var(--ink);
    border-radius: 12px;
    resize: vertical;
  }

  /* ===== 하단: 버튼 2개. 끝. ===== */
  .actions {
    position: sticky; bottom: 0;
    display: flex; gap: 8px;
    padding: 8px;
    background: var(--bg);
    border-top: 2px solid var(--line);
  }
  .actions button {
    flex: 1;
    min-height: calc(var(--touch-min) * 1.5);
    padding: 12px 8px;
    border: 3px solid var(--btn-bg);
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--btn-ink);
    font: inherit;
    letter-spacing: 0;
    cursor: pointer;
  }
  .actions button:disabled { opacity: 1; background: var(--bg); color: var(--ink-2); border-color: var(--ink-2); cursor: default; }
  .actions button[aria-pressed="true"] { background: var(--btn-on-bg); border-color: var(--btn-on-bg); }

  #ask {
    display: none;
    width: 100%;
    margin-top: 12px;
    min-height: var(--touch-min);
    padding: 12px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    letter-spacing: 0;
    cursor: pointer;
  }
  #ask.show { display: block; }

  #status {
    margin-top: 12px;
    min-height: calc(var(--fs-body) * var(--lh));
    color: var(--ink-2);
  }
  #status:empty { display: none; }

  :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>

<header class="size-bar" role="group" aria-label="글자 크기">
  <button type="button" data-size="normal" aria-pressed="true"><span class="glyph" aria-hidden="true">가</span><span class="label">보통</span></button>
  <button type="button" data-size="large"  aria-pressed="false"><span class="glyph" aria-hidden="true">가</span><span class="label">크게</span></button>
  <button type="button" data-size="xlarge" aria-pressed="false"><span class="glyph" aria-hidden="true">가</span><span class="label">더크게</span></button>
</header>

<main>
  <div id="answer" aria-live="polite">
    <p>무엇이든 물어보세요.</p>
    <p>답은 <u>세 줄</u>로 짧게 드립니다.</p>
  </div>
  <label for="question">질문</label>
  <textarea id="question" placeholder="여기에 적거나, 아래 말하기 버튼을 누르세요"></textarea>
  <button type="button" id="ask">물어보기</button>
  <p id="status" aria-live="polite"></p>
</main>

<footer class="actions">
  <button type="button" id="btn-speak" disabled>🎤 말하기</button>
  <button type="button" id="btn-read"  disabled>🔊 읽어주기</button>
</footer>

<script>
(function () {
  var KEY = 'see.size';
  var SIZES = ['normal', 'large', 'xlarge'];
  var root = document.documentElement;
  var buttons = document.querySelectorAll('.size-bar button');

  function apply(size) {
    if (SIZES.indexOf(size) < 0) size = 'normal';
    if (size === 'normal') root.removeAttribute('data-size');
    else root.setAttribute('data-size', size);
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].dataset.size === size ? 'true' : 'false');
    }
    try { localStorage.setItem(KEY, size); } catch (e) { /* 저장 못 해도 정상 동작 */ }
  }

  var saved = 'normal';
  try { saved = localStorage.getItem(KEY) || 'normal'; } catch (e) {}
  apply(saved);

  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function () { apply(this.dataset.size); });
  }
})();

/* ===== 공통 ===== */
var $answer = document.getElementById('answer');
var $question = document.getElementById('question');
var $ask = document.getElementById('ask');
var $status = document.getElementById('status');
var $speak = document.getElementById('btn-speak');
var $read = document.getElementById('btn-read');

function setStatus(msg) { $status.textContent = msg || ''; }
function setAnswer(lines) {
  $answer.innerHTML = '';
  lines.forEach(function (t) {
    var p = document.createElement('p');
    p.textContent = t;
    $answer.appendChild(p);
  });
}

/* ===== 읽어주기 (SpeechSynthesis, ko-KR) ===== */
(function () {
  var synth = window.speechSynthesis;
  if (!synth || !window.SpeechSynthesisUtterance) {
    $read.textContent = '읽어주기 불가';
    return;
  }
  $read.disabled = false;

  var koVoice = null;
  function pickVoice() {
    var voices = synth.getVoices();
    for (var i = 0; i < voices.length; i++) {
      if (/^ko/i.test(voices[i].lang)) { koVoice = voices[i]; break; }
    }
  }
  pickVoice();
  if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = pickVoice;

  function stopReading() {
    synth.cancel();
    $read.textContent = '🔊 읽어주기';
    $read.setAttribute('aria-pressed', 'false');
  }

  $read.addEventListener('click', function () {
    if (synth.speaking) { stopReading(); return; }
    pickVoice();
    var text = $answer.textContent.replace(/\s+/g, ' ').trim();
    if (!text) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if (koVoice) u.voice = koVoice;
    else setStatus('이 기기에 한국어 음성이 없어요. 기기 설정에서 한국어 음성을 설치하면 더 잘 들려요.');
    u.rate = 0.9;
    u.onend = stopReading;
    u.onerror = function () { stopReading(); setStatus('읽어주기가 중간에 멈췄어요. 다시 눌러 주세요.'); };
    $read.textContent = '⏹ 멈추기';
    $read.setAttribute('aria-pressed', 'true');
    synth.speak(u);
  });
})();

/* ===== 말하기 (SpeechRecognition, ko-KR) — 미지원 시 텍스트 입력으로 ===== */
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $speak.textContent = '말하기 불가';
    $question.placeholder = '이 기기는 말하기를 지원하지 않아요. 여기에 적어 주세요.';
    return;
  }
  $speak.disabled = false;

  var rec = null;
  var listening = false;

  function stopListening() {
    listening = false;
    $speak.textContent = '🎤 말하기';
    $speak.setAttribute('aria-pressed', 'false');
  }

  $speak.addEventListener('click', function () {
    if (listening) { try { rec.stop(); } catch (e) {} stopListening(); return; }
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    var finalText = '';
    rec.onresult = function (ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalText += t; else interim += t;
      }
      $question.value = finalText || interim;
    };
    rec.onerror = function (ev) {
      stopListening();
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        setStatus('마이크 사용을 허용해 주세요. 허용이 어려우면 아래에 적어 주셔도 돼요.');
      } else if (ev.error === 'no-speech') {
        setStatus('말소리가 들리지 않았어요. 다시 눌러서 말해 주세요.');
      } else {
        setStatus('말하기가 안 돼요. 아래에 적어 주세요.');
      }
    };
    rec.onend = function () {
      var wasListening = listening;
      stopListening();
      if (wasListening && finalText.trim()) ask(finalText.trim());
    };

    listening = true;
    $speak.textContent = '⏹ 듣는 중';
    $speak.setAttribute('aria-pressed', 'true');
    setStatus('');
    try { rec.start(); } catch (e) { stopListening(); setStatus('말하기를 시작할 수 없어요. 아래에 적어 주세요.'); }
  });
})();

/* ===== 물어보기 (텍스트 입력 시에만 버튼 표시) ===== */
$question.addEventListener('input', function () {
  $ask.classList.toggle('show', $question.value.trim().length > 0);
});
$ask.addEventListener('click', function () {
  var q = $question.value.trim();
  if (q) ask(q);
});
$question.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    var q = $question.value.trim();
    if (q) ask(q);
  }
});

/* ===== AI에 묻기 (서버리스 함수 경유, 3줄 요약) ===== */
var asking = false;
function ask(q) {
  if (asking) return;
  asking = true;
  setStatus('답을 찾고 있어요…');
  fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q })
  })
  .then(function (r) { if (!r.ok) throw new Error('bad status ' + r.status); return r.json(); })
  .then(function (data) {
    var lines = (data && data.lines) || [];
    if (!lines.length) throw new Error('empty');
    setAnswer(lines);
    setStatus('');
    $question.value = '';
    $ask.classList.remove('show');
    window.scrollTo({ top: 0 });
  })
  .catch(function () {
    setStatus('지금은 답을 가져올 수 없어요. 잠시 후 다시 해보세요.');
  })
  .then(function () { asking = false; });
}
</script>
</body>
</html>
