<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멍 런</title>
<meta name="description" content="누군가 달리는 모습을 그냥 멍하게 바라보는 공간">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃‍♀️</text></svg>">
<style>
  :root { --fg:#f3efe8; --dim:rgba(243,239,232,.55); --bg:#0b0b0d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  body.idle { cursor:none; }

  .stage { position:fixed; inset:0; background:var(--bg); }
  .stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.8s ease; }
  .stage video.on { opacity:1; }
  .vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%); }

  /* 영상이 없을 때 */
  .empty { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px;
    background:linear-gradient(160deg,#1a1d26,#0b0b0d 60%,#201812); }
  .empty.show { display:grid; }
  .empty h1 { font-weight:500; font-size:clamp(20px,4vw,28px); letter-spacing:.04em; margin-bottom:14px; }
  .empty p { color:var(--dim); line-height:1.7; font-size:14px; max-width:420px; }
  .empty code { color:var(--fg); background:rgba(255,255,255,.08); padding:2px 6px; border-radius:4px; }
  .runner { font-size:56px; margin-bottom:12px; animation:bob 1.1s ease-in-out infinite; display:inline-block; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  /* UI (자동 숨김) */
  .ui { position:fixed; inset:0; pointer-events:none; opacity:1; transition:opacity .6s ease; }
  body.idle .ui { opacity:0; }
  .caption { position:absolute; left:max(20px,env(safe-area-inset-left)); bottom:max(22px,env(safe-area-inset-bottom));
    font-size:13px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; }
  .caption b { display:block; font-weight:500; color:var(--fg); font-size:15px; letter-spacing:.06em; margin-bottom:4px; text-transform:none; }
  .controls { position:absolute; right:max(16px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); display:flex; gap:6px; pointer-events:auto; }
  .controls button { appearance:none; border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.35); color:var(--fg);
    backdrop-filter:blur(8px); width:40px; height:40px; border-radius:50%; font-size:15px; cursor:pointer; transition:background .2s; }
  .controls button:hover { background:rgba(255,255,255,.14); }
  .hint { position:absolute; top:max(18px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--dim); letter-spacing:.08em; white-space:nowrap; }
  .tap { position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); z-index:5; cursor:pointer; }
  .tap.show { display:grid; }
  .tap span { border:1px solid rgba(255,255,255,.3); padding:14px 26px; border-radius:999px; letter-spacing:.14em; font-size:14px; }
  @media (max-width:600px){ .hint{display:none} .caption{font-size:11px} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="v0" playsinline muted preload="auto"></video>
  <video id="v1" playsinline muted preload="auto"></video>
</div>
<div class="vignette"></div>

<div class="empty" id="empty">
  <div>
    <div class="runner">🏃‍♀️</div>
    <h1>아직 영상이 없어요</h1>
    <p>Flow에서 만든 영상을 <code>videos/</code> 폴더에 넣고<br><code>videos.js</code>에 파일명을 적어 주세요.<br>프롬프트는 <code>PROMPTS.md</code>에 있어요.</p>
  </div>
</div>

<div class="tap" id="tap"><span>탭해서 시작</span></div>

<div class="ui" id="ui">
  <div class="hint">space 일시정지 · → 다음 · M 소리 · F 전체화면</div>
  <div class="caption" id="caption"></div>
  <div class="controls">
    <button id="btnMute" title="소리">🔇</button>
    <button id="btnNext" title="다음 장면">→</button>
    <button id="btnFull" title="전체화면">⛶</button>
  </div>
</div>

<script src="videos.js"></script>
<script>
(function(){
  const list = (window.MEONG_RUN_VIDEOS || []).filter(v => v && v.src);
  const vids = [document.getElementById('v0'), document.getElementById('v1')];
  const caption = document.getElementById('caption');
  const empty = document.getElementById('empty');
  const tap = document.getElementById('tap');
  const btnMute = document.getElementById('btnMute');
  const body = document.body;

  let order = shuffle(list.map((_, i) => i));
  let pos = -1, cur = 0, muted = true, idleTimer, queued = null;

  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
  function nextIndex(){
    pos = (pos + 1) % order.length;
    if (pos === 0 && order.length > 1) {
      const last = order[order.length - 1];
      do { order = shuffle(order); } while (order[0] === last);   // 같은 장면 연속 금지
    }
    return order[pos];
  }
  function preload(idx){
    const el = vids[1 - cur], item = list[idx];
    el.src = item.src; el.loop = !!item.loop; el.muted = muted; el.load();
    queued = idx;
  }
  function play(idx){
    const item = list[idx];
    const nextEl = vids[1 - cur], prevEl = vids[cur];
    if (queued !== idx) { nextEl.src = item.src; nextEl.loop = !!item.loop; nextEl.muted = muted; }
    nextEl.onended = () => showNext();
    nextEl.play().then(() => {
      nextEl.classList.add('on');
      prevEl.classList.remove('on');
      prevEl.onended = null;
      setTimeout(() => { prevEl.pause(); prevEl.removeAttribute('src'); prevEl.load(); preload(peekIndex()); }, 1900);
      cur = 1 - cur;
      caption.innerHTML = '<b>' + esc(item.title || '') + '</b>' + esc(item.note || '');
    }).catch(() => tap.classList.add('show'));
  }
  function peekIndex(){ return order[(pos + 1) % order.length]; }
  function showNext(){ play(nextIndex()); }
  function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function setMuted(m){ muted = m; vids.forEach(v => v.muted = m); btnMute.textContent = m ? '🔇' : '🔊'; }
  function togglePause(){ const v = vids[cur]; v.paused ? v.play() : v.pause(); }
  function toggleFull(){
    if (document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  }
  function wake(){ body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => body.classList.add('idle'), 3000); }

  btnMute.onclick = () => setMuted(!muted);
  document.getElementById('btnNext').onclick = showNext;
  document.getElementById('btnFull').onclick = toggleFull;
  tap.onclick = () => { tap.classList.remove('show'); vids[cur].play(); };
  ['mousemove','touchstart','keydown','click'].forEach(e => addEventListener(e, wake, {passive:true}));
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'ArrowRight') showNext();
    else if (e.key.toLowerCase() === 'm') setMuted(!muted);
    else if (e.key.toLowerCase() === 'f') toggleFull();
  });
  addEventListener('dblclick', toggleFull);

  if (!list.length) { empty.classList.add('show'); return; }
  wake();
  showNext();
})();
</script>
</body>
</html>
