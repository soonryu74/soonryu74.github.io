<!DOCTYPE html>
<html lang="ko" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} | {{BRAND}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#e8e5df">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap');

/* ===== 1) 공통 뼈대 — 모든 주제가 공유하는 종이·잉크·선 ===== */
:root{
 --bg:#e8e5df;--paper:#fdfcfa;--wash:#f4f1eb;
 --ink:#17150f;--ink2:#36322b;--muted:#6c665e;--dim:#a39b91;
 --line:#e5e0d8;--line2:#d2ccc2;--code:#1b1b23;--codeink:#e8e8f0;
 /* 포인트색 4종 — 주제(data-theme)마다 이 4개만 바뀐다 */
 --ac:#c8811f;--ac-deep:#8a560f;--ac-soft:#fbf0e0;--ac-ink:#fff;
 --serif:'Noto Serif KR',Georgia,'Apple SD Gothic Neo',serif;
 --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 --mono:ui-monospace,Menlo,Consolas,monospace;
 --fs:clamp(15px,1.9vh,17px);
}
/* ===== 2) 주제별 포인트색 ===== */
[data-theme="estate"]{--ac:#2e7d64;--ac-deep:#1d5a46;--ac-soft:#e3f0ea}
[data-theme="ai"]{--ac:#3d5ae0;--ac-deep:#2a3fa8;--ac-soft:#e7ebfb}
[data-theme="money"]{--ac:#b8860b;--ac-deep:#7d5a06;--ac-soft:#faf1d6}
[data-theme="health"]{--ac:#d4574e;--ac-deep:#a03a33;--ac-soft:#fbe8e5}
[data-theme="edu"]{--ac:#1f6fb2;--ac-deep:#154e80;--ac-soft:#e3edf8}
[data-theme="life"]{--ac:#0f8a8a;--ac-deep:#0a6060;--ac-soft:#dff2f2}
[data-theme="law"]{--ac:#7a2e4a;--ac-deep:#581f35;--ac-soft:#f4e5ec}
[data-theme="mind"]{--ac:#6b4fbb;--ac-deep:#4b3690;--ac-soft:#ece7f8}
/* ===== 3) 야간 모드 — 뼈대만 뒤집고 포인트색은 유지 ===== */
[data-mode="night"]{--bg:#111110;--paper:#1c1b19;--wash:#24221f;--ink:#efece6;--ink2:#d9d4cb;--muted:#a69f95;--dim:#78726a;
 --line:#2f2d29;--line2:#3f3c37;--ac-soft:color-mix(in srgb,var(--ac) 16%,#1c1b19);--ac-deep:color-mix(in srgb,var(--ac) 65%,#fff)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);
 -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background .25s}
h1,h2,h3,.eyebrow,.foot,.kick,table,pre,.note,.src,.chnum,.tn,.tt b,.by,.vnote,.tocnote,.cta,.vqr b,.vqr span,.cap,.steps li b,.bigq cite{font-family:var(--sans)}
a{color:var(--ac-deep)}
code{font-family:var(--mono);font-size:.88em;background:var(--wash);padding:1px 5px;border-radius:3px;color:var(--ink)}
mark{background:var(--ac-soft);color:var(--ink);padding:0 2px}

#prog{position:fixed;top:0;left:0;height:3px;background:var(--ac);z-index:70;width:0;transition:width .25s}
#deck{position:relative;width:100vw;height:100vh;height:100dvh}
.s{position:absolute;inset:0;display:none;justify-content:center;align-items:center;padding:18px 16px 72px}
.s.on{display:flex;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 종이: A5 세로 비율(148:210 = 0.705) */
.paper{position:relative;background:var(--paper);width:min(calc((100dvh - 92px) * .705),94vw);height:min(calc(100dvh - 92px),1000px);
 box-shadow:0 10px 36px rgba(0,0,0,.14);border:1px solid var(--line2);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.s.alt .paper{background:var(--wash)}
.s.open .paper::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--ac)}
.pin{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:clamp(24px,4vh,46px) clamp(22px,4vh,44px) 10px}
.mid{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.s.cover .mid,.s.open .mid,.s.quote .mid,.s.close .mid{text-align:center;align-items:center}
.s.cover .mid>*,.s.open .mid>*,.s.close .mid>*{max-width:100%}

/* 글자 */
.eyebrow{display:block;font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--ac-deep);text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(26px,4.4vh,38px);font-weight:900;letter-spacing:-1.6px;line-height:1.15;margin:0;word-break:keep-all}
h2{font-size:clamp(21px,3.4vh,30px);font-weight:900;letter-spacing:-1.1px;line-height:1.22;margin:0;word-break:keep-all}
h3{font-size:clamp(18px,2.8vh,24px);font-weight:800;letter-spacing:-.7px;line-height:1.28;margin:0 0 16px;word-break:keep-all}
.prose p{font-size:var(--fs);line-height:1.92;margin:0 0 14px;color:var(--ink2);word-break:keep-all;overflow-wrap:anywhere}
.prose p b{color:var(--ink);font-weight:700}
.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px;font-size:calc(var(--fs) - 1px);line-height:1.85;color:var(--ink2);word-break:keep-all}
.prose li{margin-bottom:4px}
.fml{font-family:var(--mono);font-size:clamp(15px,2.3vh,20px)!important;text-align:center;letter-spacing:.5px;padding:14px 10px;
 background:var(--paper);border:1px solid var(--line);margin:16px 0!important;color:var(--ink)!important}
blockquote{margin:16px 0;padding:14px 18px;border-left:3px solid var(--ac);background:var(--ac-soft);
 font-size:calc(var(--fs) - .5px);line-height:1.8;color:var(--ink);font-weight:500;word-break:keep-all}
pre{background:var(--code);color:var(--codeink);padding:12px 14px;overflow-x:auto;font-size:11.5px;line-height:1.75;font-family:var(--mono);margin:14px 0;border-radius:4px}
.note{margin:16px 0 0;padding:12px 15px;background:var(--ac-soft);border-left:3px solid var(--ac);
 font-size:13px;line-height:1.75;color:var(--ink);font-weight:600;word-break:keep-all}
.src{font-size:11px!important;color:var(--dim)!important;line-height:1.7!important;margin-top:12px!important}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;background:var(--paper)}
th,td{padding:8px 11px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line);word-break:keep-all}
th{background:var(--ac-soft);font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--ac-deep);white-space:nowrap}
td{color:var(--muted)}td b{color:var(--ink)}tr:last-child td{border-bottom:none}

/* 그림 */
.fig{margin:0 0 16px}
.fig img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px}
.fig svg{width:100%;height:auto;max-height:34vh;display:block;color:var(--ac)}
.fig.covfig{margin:14px auto 18px;width:min(300px,64%)}.fig.covfig img{border:none}
.fig.openfig{margin:22px auto 0;width:72%}
.cap{font-size:11.5px;color:var(--dim);margin:-8px 0 14px;text-align:center}

/* 표지·오프너 */
.kick{display:inline-block;background:var(--ac);color:var(--ac-ink);font-size:10.5px;font-weight:800;letter-spacing:1.3px;padding:5px 12px;border-radius:2px}
.rule{width:48px;height:3px;background:var(--ac);margin:16px auto}
.rule.mid{margin:20px auto 0}
.lede{font-size:var(--fs);line-height:1.85;color:var(--muted);margin:0 auto;max-width:30em;word-break:keep-all}
.by{font-size:11.5px;color:var(--dim);margin:20px 0 0;line-height:1.75}
.chnum{display:inline-block;width:46px;height:46px;line-height:46px;background:var(--ac);color:var(--ac-ink);font-weight:900;font-size:19px;margin-bottom:16px;border-radius:50%}
.chsub{font-size:calc(var(--fs) - 1px);color:var(--muted);margin:10px 0 0;line-height:1.75;word-break:keep-all}

/* 차례 */
.tochead{margin-bottom:18px}
.toclist{border-top:1px solid var(--line2)}
.tocrow{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none}
.tocrow:hover{background:var(--ac-soft)}
.toclist.dense .tocrow{padding:7px 2px;gap:8px;grid-template-columns:22px 1fr}
.toclist.dense .tt b{font-size:13.5px}.toclist.dense .tt i{font-size:11px}
.tn{font-size:12.5px;font-weight:900;color:var(--ac-deep)}
.tt b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.3px;word-break:keep-all}
.tt i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;word-break:keep-all}
.tocnote{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:18px}

/* 단계(steps) */
ol.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:st}
.steps li{position:relative;padding:0 0 0 44px;margin:0 0 14px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--ac-ink);
 font-family:var(--sans);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.steps li b{display:block;font-size:calc(var(--fs) - 1px);color:var(--ink);letter-spacing:-.3px;margin-bottom:3px;line-height:1.5;word-break:keep-all}
.steps li span{display:block;font-size:calc(var(--fs) - 2px);line-height:1.75;color:var(--ink2);word-break:keep-all}

/* 체크리스트 */
ul.chk{list-style:none;margin:6px 0 0;padding:0}
.chk li{position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line);font-size:calc(var(--fs) - 1px);line-height:1.7;color:var(--ink2);word-break:keep-all}
.chk li:last-child{border-bottom:none}
.chk li::before{content:"";position:absolute;left:2px;top:14px;width:16px;height:16px;border:2px solid var(--ac);border-radius:4px;background:var(--paper)}
.chk li b{color:var(--ink)}

/* 인용 한 쪽 */
.bigq{max-width:30em;margin:0 auto}
.bigq::before{content:"\201C";display:block;font-family:var(--sans);font-size:64px;line-height:.8;color:var(--ac);margin-bottom:10px}
.bigq p{font-size:clamp(18px,2.6vh,23px);line-height:1.7;font-weight:500;color:var(--ink);margin:0;word-break:keep-all}
.bigq cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:18px}

/* 영상 */
.vidpg{text-align:center}
.vnote{font-size:11.5px;color:var(--muted);margin:0 0 16px}
.vwrap{border:1px solid var(--line2);background:#000;border-radius:4px;overflow:hidden}
.vframe{position:relative;border:0;padding:0;margin:0;cursor:pointer;background:#000;display:block;width:100%;aspect-ratio:16/9;overflow:hidden}
.vframe img{width:100%;height:100%;object-fit:cover;opacity:.85}
.vframe:hover img{opacity:1}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.vplay:after{content:"";position:absolute;inset:0;margin:auto;width:0;height:0;border-left:17px solid var(--ac);border-top:10px solid transparent;border-bottom:10px solid transparent;transform:translateX(3px)}
.vwrap iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.vqr{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;text-align:left}
.vqr img.qr{width:74px;height:74px;flex:none;background:#fff}
.vqr b{display:block;font-family:var(--mono);font-size:12px;color:var(--ink)}
.vqr span{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.vidpg .prose{text-align:left;margin-top:14px}

/* 맺음 */
.cta{display:inline-block;margin-top:20px;background:var(--ac);color:var(--ac-ink);text-decoration:none;padding:12px 24px;font-size:13.5px;font-weight:800;border-radius:3px}
.cta:hover{filter:brightness(.92)}

/* 하단 쪽수·브랜드 */
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:9px clamp(22px,4vh,44px);font-size:9.5px;letter-spacing:.6px;color:var(--dim);border-top:1px solid var(--line)}
.brand{font-weight:800}

/* 네비게이션 */
#bar{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:8px;z-index:60;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
#bar>*{pointer-events:auto}
#bar button,#top button,#top a{font-family:var(--sans);border:1px solid var(--line2);background:var(--paper);color:var(--ink);cursor:pointer;
 box-shadow:0 2px 8px rgba(0,0,0,.08);text-decoration:none;line-height:1}
#bar button{width:38px;height:38px;border-radius:50%;font-size:17px}
#bar button:hover,#top button:hover,#top a:hover{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
#bar select{font-family:var(--sans);font-size:11.5px;padding:8px 10px;border:1px solid var(--line2);background:var(--paper);color:var(--ink2);max-width:200px;border-radius:19px}
#top{position:fixed;top:10px;right:12px;display:flex;gap:6px;z-index:60}
#top button,#top a{font-size:11px;font-weight:800;padding:7px 11px;border-radius:15px}

@media(max-width:640px){
  .s{padding:0 0 58px}
  .paper{width:100%;height:calc(100dvh - 58px);border:0;border-radius:0;box-shadow:none}
  .pin{padding:30px 22px 12px}
  .fig.covfig{width:56%}
  #top{top:8px;right:8px}
  #bar{bottom:10px}
}

/* ===== 프린트 → PDF (A5 세로, 한 섹션 = 한 쪽) ===== */
@media print{
  @page{size:A5 portrait;margin:0}
  :root,[data-mode="night"]{--bg:#fff;--paper:#fff;--wash:#f4f1eb;--ink:#17150f;--ink2:#36322b;--muted:#6c665e;--dim:#a39b91;--line:#e5e0d8;--line2:#d2ccc2}
  [data-mode="night"]{--ac-soft:#f3efe8;--ac-deep:#444}
  body{overflow:visible;background:#fff}
  #bar,#prog,#top,.vplay{display:none!important}
  #deck{width:auto;height:auto}
  .s{position:static!important;display:block!important;padding:0;animation:none;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  .s:last-child{break-after:auto;page-break-after:auto}
  .paper{width:148mm;height:210mm;box-shadow:none;border:none;border-radius:0;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
  .pin,.mid,.steps,.steps li,.chk,.chk li,.tw,blockquote,.note,.fig{break-inside:avoid;page-break-inside:avoid}
  .vframe{cursor:default}.vframe img{opacity:1}
  .s.open .paper::before{height:4mm}
  .pin{overflow:hidden;padding:13mm 12mm 4mm}
  .prose p{font-size:10.5pt;line-height:1.85;margin-bottom:10px}
  .lede,.chsub{font-size:10.5pt}
  h1{font-size:24pt}h2{font-size:18pt}h3{font-size:14pt}
  .fig img{max-height:66mm;width:auto;margin:0 auto}
  .fig svg{max-height:58mm}
  .fig.covfig{width:60mm}
  .vqr img.qr{width:26mm;height:26mm}
  .foot{padding:4mm 12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="prog"></div>
<div id="top">
  <button id="tocbtn" type="button" aria-label="차례로">차례</button>
  <button id="mode" type="button" aria-label="야간 모드">☾</button>
  {{DL}}
</div>

<div id="deck">
{{PAGES}}
</div>

<div id="bar">
  <button id="prev" type="button" aria-label="이전 쪽">‹</button>
  <select id="jump" aria-label="쪽 이동"></select>
  <button id="next" type="button" aria-label="다음 쪽">›</button>
</div>

<script>
/* 넘기는 책 엔진: 한 번에 한 .s 만 보인다. 좌우키·스와이프·차례·점프·야간모드·읽던 곳 기억. */
(function(){
  var H=document.documentElement,KEY='wb:'+location.pathname,MK='wb:mode';
  try{var mm=localStorage.getItem(MK);if(mm)H.dataset.mode=mm;}catch(e){}
  var S=[].slice.call(document.querySelectorAll('.s')),i=0,N=S.length;
  if(!N)return;
  var prog=document.getElementById('prog'),jump=document.getElementById('jump');
  S.forEach(function(s,n){
    var pn=s.querySelector('.pnum');if(pn)pn.textContent=(n+1)+' / '+N;
    var o=document.createElement('option');o.value=n;o.textContent=(n+1)+'. '+(s.dataset.label||'쪽');jump.appendChild(o);
  });
  function go(n){
    n=Math.max(0,Math.min(N-1,n));
    S[i].classList.remove('on');i=n;S[i].classList.add('on');
    var pin=S[i].querySelector('.pin');if(pin)pin.scrollTop=0;
    prog.style.width=((i+1)/N*100)+'%';jump.value=i;
    try{history.replaceState(null,'','#p'+(i+1));}catch(e){}
    try{localStorage.setItem(KEY,i);}catch(e){}
  }
  document.getElementById('prev').onclick=function(){go(i-1)};
  document.getElementById('next').onclick=function(){go(i+1)};
  jump.onchange=function(){go(+jump.value)};
  document.getElementById('tocbtn').onclick=function(){
    var t=S.findIndex(function(s){return s.classList.contains('toc')});go(t>=0?t:0);
  };
  document.getElementById('mode').onclick=function(){
    var m=H.dataset.mode==='night'?'':'night';
    if(m)H.dataset.mode=m;else delete H.dataset.mode;
    try{localStorage.setItem(MK,m);}catch(e){}
  };
  addEventListener('keydown',function(e){
    if(e.target.tagName==='SELECT')return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1);}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}
    if(e.key==='Home')go(0);if(e.key==='End')go(N-1);
  });
  var x0=null,y0=null;
  addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',function(e){
    if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)go(i+(dx<0?1:-1));
  },{passive:true});
  addEventListener('hashchange',function(){var m=location.hash.match(/^#p(\d+)$/);if(m&&(+m[1]-1)!==i)go(+m[1]-1);});
  document.querySelectorAll('.tocrow').forEach(function(r){
    r.onclick=function(){
      var t=S.findIndex(function(s){var c=s.querySelector('.chnum');return s.classList.contains('open')&&c&&c.textContent===r.dataset.go;});
      if(t>=0)go(t);
    };
  });
  document.querySelectorAll('.vframe').forEach(function(b){
    b.onclick=function(){
      var w=b.closest('.vwrap'),f=document.createElement('iframe');
      f.src='https://www.youtube.com/embed/'+w.dataset.v+'?autoplay=1&rel=0';
      f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
      f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
      f.allowFullscreen=true;f.title='강의 영상';b.replaceWith(f);
    };
  });
  var m=location.hash.match(/^#p(\d+)$/),saved=null;
  try{saved=localStorage.getItem(KEY);}catch(e){}
  go(m?(+m[1]-1):(saved!==null?+saved:0));
})();
</script>
</body>
</html>
