<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>대한민국 건강 지형도</title>
  <meta name="description" content="대한민국을 약 2.5 km 육각형 칸으로 나눠 실제 지형 위에 시군구 건강 지표를 칠한 둘러보기용 지도(health-profile.kr). 시험판.">
  <meta name="theme-color" content="#131e2a">
  <meta name="robots" content="noindex">
  <!-- 지도 그리기 코드: usaciv (MIT License, Copyright (c) 2026 Andrej Karpathy) — LICENSE-usaciv.txt -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="대한민국 건강 지형도 (시험판)"><span class="brand-emblem" aria-hidden="true">✚</span><span class="brand-text">건강 지형도</span></div>
    <div id="yields" class="yields" aria-label="전국 요약"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="시군구·시도 검색" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="시군구·시도 검색 (/ 또는 Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="이 화면 공유" title="공유: 링크 복사 또는 그림 내려받기"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="조작법 도움말" title="도움말 (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="자료 출처 열기" title="숫자의 뜻과 출처"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="대한민국 육각형 건강 지형도"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="자세히"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="지표 고르기"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="지표 범례"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="지도 지표">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Resources on tiles (R)" title="Show or hide resources on tiles (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="작은 지도: 눌러 이동" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="작은 지도 보기"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="검색 결과" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="공유" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="요약" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="자료 출처">
      <button class="close icon-btn" data-close aria-label="자료 출처 닫기">✕</button>
      <nav id="pedia-nav" aria-label="자료 출처 쪽"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">지도를 그리는 중…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
