<style>

  header.hero{position:relative; overflow:hidden; padding:60px 0 40px; text-align:center;

  h1.title .hl{background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .sub{color:var(--muted); font-size:17px; max-width:600px; margin:0 auto 8px}

  .controls{position:sticky; top:0; z-index:60; padding:14px 0 12px; margin-top:6px;

  .searchbox .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--dim);

  .chip{font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;

  .chip .n{opacity:.6; font-weight:600; margin-left:3px}
  .chip.active .n{opacity:.85}

  .cathead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 4px}

  .cathead h2{font-size:20px; font-weight:800; margin:0; letter-spacing:-.3px}

  .card{position:relative; display:flex; flex-direction:column; gap:8px; padding:18px; border-radius:var(--radius);

  .card .sub-tag::before{content:"# "; opacity:.6}

  .placeholder{border:1px dashed var(--line); background:transparent; color:var(--dim);
    align-items:center; justify-content:center; text-align:center; min-height:120px; font-size:13.5px; font-weight:600}

  .empty{display:none; text-align:center; padding:60px 20px; color:var(--muted)}
  .empty.show{display:block}
  .empty .big{font-size:40px; margin-bottom:10px}

  footer{border-top:1px solid var(--line); padding:30px 0; text-align:center; color:var(--dim); font-size:13px}
  footer a{color:var(--muted)}
  .backlink{display:inline-block; margin-top:18px; font-size:13px; color:var(--muted)}

    header.hero{padding:44px 0 26px}

    desc:'수익용 이미지를 만드는 프롬프트.',
    url:'https://www.aicitybuilders.com/ai-money-image-prompts' },

  { cat:'prompts', sub:'영상', emoji:'🎬', external:true,
    title:'AI 수익화 영상 프롬프트',
    desc:'수익용 영상을 만드는 프롬프트.',
    url:'https://www.aicitybuilders.com/ai-money-video-prompts' },

  { cat:'prompts', sub:'캐릭터 영상', emoji:'🧑‍🎤', external:true,
    title:'AI 캐릭터 영상 프롬프트',
    desc:'캐릭터가 나오는 영상을 만드는 프롬프트.',
    url:'https://www.aicitybuilders.com/ai-character-video-prompts' },

  { cat:'library', sub:'수강 안내', emoji:'💳', external:true,
    title:'수강 안내 · 가격',
    desc:'AI City Builders 과정 가격과 수강 신청 안내.',
    url:'https://www.aicitybuilders.com/pricing' },
];

/* ============================================================
   렌더링 로직 (건드릴 필요 없음)
   ============================================================ */
const sectionsEl = document.getElementById('sections');
const chipsEl = document.getElementById('chips');
const qEl = document.getElementById('q');
const clrEl = document.getElementById('clr');
const emptyEl = document.getElementById('empty');

let activeCat = 'all';
let query = '';

function catMeta(id){ return CATEGORIES.find(c=>c.id===id); }
function countIn(id){ return ITEMS.filter(i=>i.cat===id).length; }

/* --- 필터 칩 --- */
function buildChips(){
  const chips = [{id:'all', name:'전체', emoji:'✨', n:ITEMS.length}]
    .concat(CATEGORIES.map(c=>({id:c.id, name:c.name, emoji:c.emoji, n:countIn(c.id)})));
  chipsEl.innerHTML = chips.map(c=>
    `<button class="chip${c.id===activeCat?' active':''}" data-cat="${c.id}">${c.emoji} ${c.name}<span class="n">${c.n}</span></button>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ activeCat = el.dataset.cat; buildChips(); render();
      if(activeCat!=='all'){ const s=document.getElementById('cat-'+activeCat); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); }
    });
  });
}

/* --- 카드 한 장 --- */
function cardHTML(it){
  const badges = [];
  if(it.lec) badges.push(`<span class="badge lec">${it.lec}</span>`);
  if(it.status==='new') badges.push(`<span class="badge new">NEW</span>`);
  if(it.status==='soon') badges.push(`<span class="badge soon">준비중</span>`);
  if(it.external) badges.push(`<span class="badge ext">외부 ↗</span>`);
  const tgt = it.external ? ` target="_blank" rel="noopener"` : '';
  return `<a class="card item" href="${it.url}"${tgt} data-search="${(it.title+' '+it.desc+' '+(it.sub||'')+' '+catMeta(it.cat).name).toLowerCase()}">
    <div class="top">
      <span class="cemoji">${it.emoji||'📄'}</span>
      <div class="badges">${badges.join('')}</div>
    </div>
    <h3>${it.title}</h3>
    <p>${it.desc}</p>
    ${it.sub?`<div class="sub-tag">${it.sub}</div>`:''}
  </a>`;
}

/* --- 전체 섹션 --- */
function render(){
  const q = query.trim().toLowerCase();
  let anyVisible = false;

  sectionsEl.innerHTML = CATEGORIES.map(cat=>{
    const items = ITEMS.filter(i=>i.cat===cat.id);
    const cards = items.length
      ? items.map(cardHTML).join('')
      : `<div class="card placeholder">준비 중이에요 · 곧 추가됩니다</div>`;
    return `<section class="cat" id="cat-${cat.id}">
      <div class="cathead">
        <span class="emoji">${cat.emoji}</span>
        <h2>${cat.name}</h2>
        <span class="desc">${cat.desc}</span>
      </div>
      <div class="catbar"></div>
      <div class="grid">${cards}</div>
    </section>`;
  }).join('');

  // 필터 적용
  sectionsEl.querySelectorAll('.cat').forEach(sec=>{
    const catId = sec.id.replace('cat-','');
    const catMatch = (activeCat==='all' || activeCat===catId);
    let visibleCards = 0;
    sec.querySelectorAll('.item').forEach(card=>{
      const hit = catMatch && (!q || card.dataset.search.includes(q));
      card.classList.toggle('hidden', !hit);
      if(hit) visibleCards++;
    });
    const placeholder = sec.querySelector('.placeholder');
    // 검색어가 있으면 빈 카테고리(placeholder)는 숨김
    const showSection = catMatch && (visibleCards>0 || (!q && placeholder));
    if(placeholder) placeholder.style.display = (catMatch && !q) ? '' : 'none';
    sec.classList.toggle('hidden', !showSection);
    if(showSection && (visibleCards>0 || (!q && placeholder))) anyVisible = true;
  });

  emptyEl.classList.toggle('show', !anyVisible);
}

qEl.addEventListener('input', ()=>{
  query = qEl.value;
  clrEl.style.display = query ? 'block' : 'none';
  render();
});
clrEl.addEventListener('click', ()=>{ qEl.value=''; query=''; clrEl.style.display='none'; qEl.focus(); render(); });

buildChips();
render();
</script>
</body>
</html>
