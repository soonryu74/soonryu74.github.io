<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아트셀라 ARTSELAH — 작가의 작업실을 그대로 옮긴 온라인 전시장</title>
<meta name="description" content="색지 콜라주와 서예를 오가는 작가의 작품을 전시별로 모아 보는 온라인 갤러리 아트셀라. 전시 관람, 작품 아카이브, 작가 소개, 소장 문의를 한곳에서.">
<meta property="og:title" content="아트셀라 ARTSELAH — 온라인 전시장">
<meta property="og:description" content="전시 관람, 작품 아카이브, 작가 소개, 소장 문의를 한곳에서.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  .hero{padding:66px 0 54px;border-bottom:1px solid var(--line)}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
  .hero h1{font-family:"Gowun Batang",serif;font-size:2.9rem;line-height:1.25;margin:0 0 16px;letter-spacing:-.03em}
  .hero p{color:var(--ink-2);max-width:46ch;font-size:1.04rem}
  .hero .cta{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}
  .hero-art{background:#fff;border:1px solid var(--line);padding:18px;box-shadow:var(--shadow)}
  .hero-art .canvas{aspect-ratio:1/1;overflow:hidden;display:block}
  .hero-art .canvas svg{width:100%;height:100%;object-fit:cover}
  .hero-cap{font-size:.84rem;color:var(--ink-2);margin-top:10px}
  .now{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:start}
  .now .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .now .strip .canvas{aspect-ratio:3/4;overflow:hidden;display:block;border:1px solid var(--line);background:#fff}
  .now .strip .canvas svg{width:100%;height:100%;object-fit:cover}
  @media (max-width:860px){
    .hero-grid,.now{grid-template-columns:1fr;gap:26px}
    .hero{padding:36px 0}
    .hero h1{font-size:2.05rem}
  }
</style>
</head>
<body>

<section class="hero"><div class="wrap hero-grid">
  <div>
    <span class="kicker">Online Gallery</span>
    <h1>작업실의 빛을<br>그대로 옮겨 왔습니다</h1>
    <p>색지를 오려 붙이고 붓으로 써 내려간 작업을 전시별로 묶어 보여 드립니다. 작품 앞에 서 있는 것처럼 천천히 보시고, 마음에 닿는 작품이 있으면 바로 문의하실 수 있습니다.</p>
    <div class="cta">
      <a class="btn" href="exhibition.html">지금 하는 전시 보기</a>
      <a class="btn ghost" href="gallery.html">작품 전체 보기</a>
    </div>
  </div>
  <div class="hero-art">
    <span class="canvas" id="heroArt"></span>
    <div class="hero-cap" id="heroCap"></div>
  </div>
</div></section>

<section class="band"><div class="wrap">
  <h2 class="sec">지금 열려 있는 전시</h2>
  <p class="sec-sub" id="nowSub">—</p>
  <div class="now">
    <div id="nowText"></div>
    <div class="strip" id="nowStrip"></div>
  </div>
</div></section>

<section class="band"><div class="wrap">
  <h2 class="sec">새로 걸린 작품</h2>
  <p class="sec-sub">가장 최근에 들어온 작품입니다.</p>
  <div class="grid" id="newWorks"></div>
</div></section>

<section class="band"><div class="wrap">
  <h2 class="sec">참여 작가</h2>
  <p class="sec-sub">작가의 이름을 누르면 작업 이야기와 전체 작품을 볼 수 있습니다.</p>
  <div class="artist-row" id="artistRow"></div>
</div></section>

<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script>
ART.chrome('index.html');
ART.load().then(d => {
  // 머리 그림 — 지금 전시의 첫 작품
  const live = d.exhibitions.find(e => e.status === '진행중') || d.exhibitions[0];
  const hw = d.byWork[live.works[0]];
  document.getElementById('heroArt').innerHTML = ART.visual(hw, d.byArtist[hw.artist]);
  document.getElementById('heroCap').textContent =
    `${d.byArtist[hw.artist].name}, 「${hw.title}」, ${hw.year}, ${hw.medium}`;

  // 지금 전시
  document.getElementById('nowSub').textContent = `${ART.period(live)} · ${live.place}`;
  document.getElementById('nowText').innerHTML =
    `<h3 class="serif" style="font-size:1.75rem;margin:0 0 10px">${live.title}</h3>
     <p style="color:var(--ink-2)">${live.intro}</p>
     <p style="margin-top:18px">
       <a class="btn" href="room.html?id=${live.id}">전시실 들어가기</a>
       <a class="btn ghost" href="exhibition.html?id=${live.id}">전시 소개</a></p>`;
  document.getElementById('nowStrip').innerHTML = live.works.slice(0, 6).map(id => {
    const w = d.byWork[id];
    return `<a class="canvas" href="work.html?id=${w.id}" title="${w.title}">${ART.visual(w, d.byArtist[w.artist])}</a>`;
  }).join('');

  // 새 작품
  const recent = [...d.works].sort((a, b) => b.year - a.year || a.id.localeCompare(b.id)).slice(0, 8);
  document.getElementById('newWorks').innerHTML =
    recent.map(w => ART.card(w, d.byArtist[w.artist])).join('');

  // 작가
  document.getElementById('artistRow').innerHTML = d.artists.map(a =>
    `<a class="artist-card" href="artist.html?id=${a.id}">
       <span class="swatch">${a.palette.map(c => `<i style="background:${c}"></i>`).join('')}</span>
       <span><span class="nm">${a.name}</span><br>
       <span class="tg">${a.genre} · ${a.tagline}</span></span>
     </a>`).join('');
});
</script>
</body>
</html>
