<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작품 아카이브 | 아트셀라</title>
<meta name="description" content="아트셀라가 소개하는 회화·사진·도예·판화·조각·설치 작품 전체. 장르와 가격대, 소장 가능 여부로 골라 보실 수 있습니다.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="page-head"><div class="wrap">
  <span class="kicker">Archive</span>
  <h1 class="title">작품 아카이브</h1>
  <p class="lead">전시가 끝난 작품도 여기에 남습니다. 장르와 가격대로 좁혀 보시고, 작품을 누르면 크기·재료·작가의 말을 볼 수 있습니다.</p>
</div></div>

<div class="wrap">
  <div class="filters" role="group" aria-label="작품 거르기">
    <input class="search" id="q" type="search" placeholder="작품명·작가·재료 검색" aria-label="검색">
    <span id="genreChips"></span>
    <button class="chip" id="onlySale" aria-pressed="false">소장 가능만</button>
    <select class="chip" id="sort" aria-label="정렬">
      <option value="new">최신순</option>
      <option value="low">가격 낮은순</option>
      <option value="high">가격 높은순</option>
      <option value="artist">작가순</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p id="empty" style="display:none;color:var(--ink-2);padding:40px 0">조건에 맞는 작품이 없습니다. 조건을 하나 풀어 보세요.</p>
  <div style="height:60px"></div>
</div>

<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script>
ART.chrome('gallery.html');
ART.load().then(d => {
  const genres = [...new Set(d.artists.map(a => a.genre))];
  let genre = ART.param('genre') || '';
  let saleOnly = false;

  document.getElementById('genreChips').innerHTML =
    ['전체', ...genres].map(g =>
      `<button class="chip" data-g="${g === '전체' ? '' : g}" aria-pressed="${(g === '전체' ? '' : g) === genre}">${g}</button>`).join(' ');

  const $q = document.getElementById('q');
  const $sort = document.getElementById('sort');
  const $grid = document.getElementById('grid');

  function draw() {
    const q = $q.value.trim().toLowerCase();
    let list = d.works.filter(w => {
      const a = d.byArtist[w.artist];
      if (genre && a.genre !== genre) return false;
      if (saleOnly && w.status !== '판매중' && w.status !== '전시중') return false;
      if (!q) return true;
      return (w.title + a.name + w.medium + w.tags.join(' ')).toLowerCase().includes(q);
    });
    const v = $sort.value;
    list.sort((x, y) =>
      v === 'low' ? (x.price || 1e12) - (y.price || 1e12)
      : v === 'high' ? (y.price || 0) - (x.price || 0)
      : v === 'artist' ? d.byArtist[x.artist].name.localeCompare(d.byArtist[y.artist].name, 'ko')
      : y.year - x.year || x.id.localeCompare(y.id));

    $grid.innerHTML = list.map(w => ART.card(w, d.byArtist[w.artist])).join('');
    document.getElementById('count').textContent = `${list.length}점`;
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  }

  document.getElementById('genreChips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    genre = b.dataset.g;
    document.querySelectorAll('#genreChips .chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c.dataset.g === genre)));
    draw();
  });
  document.getElementById('onlySale').addEventListener('click', e => {
    saleOnly = !saleOnly;
    e.currentTarget.setAttribute('aria-pressed', String(saleOnly));
    draw();
  });
  $q.addEventListener('input', draw);
  $sort.addEventListener('change', draw);
  draw();
});
</script>
</body>
</html>
