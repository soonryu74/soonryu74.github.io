<title>입구 스토리보드 스케치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;600&display=swap">
<style>
/* 레이아웃: 검은 동굴 위에 랜턴 원처럼 놓인 12개의 프레임. 단일 다크 테마(의도) */
:root{--bg:#070707;--ink:#efe7da;--mute:#8d867a;--amber:#f3b36a;--line:#1e1b17;--card:#0d0c0b;--display:"Nanum Myeongjo",serif;--body:"Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{max-width:1100px;margin:0 auto 28px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,44px);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mute);margin:0;max-width:65ch;line-height:1.6}
.sub b{color:var(--amber);font-weight:600}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{margin:0;background:var(--card);border:1px solid var(--line);min-width:0}
.art{aspect-ratio:16/9;max-width:100%;background:#000}
.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}
figcaption{padding:12px 14px 16px;display:grid;gap:4px}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.08em;color:var(--amber)}
strong{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
figcaption p{margin:4px 0 0;font-size:13.5px;line-height:1.6;color:#cfc6b8}
.note{max-width:1100px;margin:28px auto 0;font-size:12.5px;color:var(--mute);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
.canva{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card);border:1px solid var(--line)}
.canva .art{aspect-ratio:16/9}
@media (max-width:700px){.canva{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card:hover .art svg{filter:brightness(1.08)}}
</style>

<figure class="card"><div class="art"><svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="320" height="180" fill="#050505"/><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f3b36a" stop-opacity=".95"/><stop offset=".55" stop-color="#b86a2a" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><rect y="110" width="320" height="70" fill="#040608"/><circle cx="120" cy="60" r="34" fill="url(#g)" opacity=".8"/><circle cx="200" cy="60" r="34" fill="url(#g)" opacity=".8"/><circle cx="120" cy="150" r="30" fill="url(#g)" opacity=".45"/><circle cx="200" cy="150" r="30" fill="url(#g)" opacity=".45"/><path d="M80 112 q80 14 160 0 l-10 -14 h-140 z" fill="#2b2f33"/><g stroke="#f6e9d6" stroke-width="2.2" fill="none" stroke-linecap="round"><circle cx="120" cy="84" r="7"/><path d="M120 91 v18"/><circle cx="200" cy="82" r="7"/><path d="M200 89 v20 M190 100 l-16 18"/></g></svg></div><figcaption><span class="id">6-1</span><strong>호수 — 빛이 두 번</strong><span class="time">2:46–2:53</span><p>보트 둘뿐. 랜턴이 수면에, 수면이 천장에.</p></figcaption></figure>
