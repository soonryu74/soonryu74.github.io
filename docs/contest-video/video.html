<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'),c=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eout=t=>1-Math.pow(1-t,3);
const ein=t=>t*t*t;
const back=t=>{const s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const FONT="'NS',sans-serif";
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function lin(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g}
function text(s,x,y,size,col,w=700,align='center',alpha=1){c.save();c.globalAlpha*=alpha;c.font=`${w} ${size}px ${FONT}`;c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y);c.restore()}

/* ---------------- 기본 배경 요소 ---------------- */
const R=rng(11);
const bld=[];for(let i=0;i<14;i++){bld.push({x:-60+i*95+R()*20,w:80+R()*70,h:260+R()*320,hue:R()})}
const rain=[];const R2=rng(5);for(let i=0;i<220;i++)rain.push({x:R2()*W*1.3-100,y:R2()*H,l:40+R2()*60,s:1400+R2()*900});
const bok=[];const R3=rng(9);for(let i=0;i<26;i++)bok.push({x:R3()*W,y:R3()*H*0.7+100,r:30+R3()*80,h:R3()});

function sky(top,mid,bot,y0=0,y1=900){c.fillStyle=lin(0,y0,0,y1,[[0,top],[.6,mid],[1,bot]]);c.fillRect(0,y0,W,y1-y0)}
function buildings(pal,baseY,tint){
  bld.forEach((b,i)=>{
    const col=pal[i%pal.length];
    c.fillStyle=col;c.fillRect(b.x,baseY-b.h,b.w,b.h);
    c.fillStyle='rgba(255,255,255,.18)';
    for(let wy=baseY-b.h+24;wy<baseY-30;wy+=46)for(let wx=b.x+14;wx<b.x+b.w-24;wx+=34){
      c.fillStyle=tint(i,wx,wy);c.fillRect(wx,wy,18,26)}
  });
}
function street(o){ // 횡단보도 뒷모습 구도
  const {day,signal}=o;
  const horizon=640;
  if(day==='noon'){sky('#9ED7F2','#CDEBF7','#FFF3DC',0,820);buildings(['#E7C9A6','#C9D8E6','#D9B8B8','#BFD5C0','#E9DDB5','#C7BFE0'],820,(i,x,y)=>((i*7+(x|0)+(y|0))%5===0)?'rgba(255,236,150,.85)':'rgba(120,160,190,.55)')}
  if(day==='night'){sky('#0C1230','#18204A','#2B2F63',0,820);buildings(['#1B2145','#222A55','#1A1F3F','#262C5C'],820,(i,x,y)=>((i*7+(x|0)+(y|0))%4===0)?'rgba(255,214,120,.9)':'rgba(40,50,95,.9)')}
  // 먼 인도
  c.fillStyle=day==='night'?'#2A2E55':'#CFC9BE';c.fillRect(0,820,W,90);
  // 도로
  c.fillStyle=lin(0,900,0,1650,[[0,'#4A4F5C'],[1,'#34373F']]);c.fillRect(0,900,W,750);
  // 중앙선
  c.fillStyle='rgba(255,214,90,.9)';
  for(let i=0;i<9;i++){const x=i*150-60;c.fillRect(x,1245,90,10)}
  // 횡단보도 (원근)
  const vpY=horizon,nearY=1650,farY=900,k=(farY-vpY)/(nearY-vpY);
  c.fillStyle=day==='night'?'rgba(235,240,255,.88)':'rgba(255,255,255,.95)';
  for(let i=-6;i<=6;i++){const xn=540+i*130,hw=36;const xf=540+(xn-540)*k,hwf=hw*k;
    c.beginPath();c.moveTo(xn-hw,nearY);c.lineTo(xn+hw,nearY);c.lineTo(xf+hwf,farY);c.lineTo(xf-hwf,farY);c.closePath();c.fill()}
  // 가까운 인도 + 연석
  c.fillStyle=day==='night'?'#3A3E68':'#D9D4CA';c.fillRect(0,1650,W,H-1650);
  c.fillStyle=day==='night'?'#565B8C':'#B8B2A7';c.fillRect(0,1642,W,14);
  c.fillStyle='rgba(0,0,0,.06)';for(let x=0;x<W;x+=180)c.fillRect(x,1670,3,H);
  // 신호등 (먼 쪽)
  c.fillStyle='#2A2D33';c.fillRect(902,640,16,200);rr(878,590,64,130,12);c.fill();
  c.fillStyle=signal==='green'?'#2A4A33':'#E2453C';c.beginPath();c.arc(910,625,18,0,7);c.fill();
  c.fillStyle=signal==='green'?'#3CE07A':'#3A2A2A';c.beginPath();c.arc(910,675,18,0,7);c.fill();
  if(signal==='green'){c.fillStyle='rgba(60,224,122,.35)';c.beginPath();c.arc(910,675,44,0,7);c.fill()}
}
function car(x,y,s,o={}){ // 오른쪽→왼쪽 진행, y=바퀴 접지선
  c.save();c.translate(x,y);c.scale(s,s);
  const col=o.col||'#D64545';
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(0,6,300,26,0,0,7);c.fill();
  c.fillStyle=col;rr(-290,-150,580,120,38);c.fill();
  c.beginPath();c.moveTo(-170,-150);c.quadraticCurveTo(-120,-250,-30,-250);c.lineTo(110,-250);c.quadraticCurveTo(180,-248,215,-150);c.closePath();c.fill();
  c.fillStyle='#1E2A3A';
  c.beginPath();c.moveTo(-150,-156);c.quadraticCurveTo(-110,-232,-36,-232);c.lineTo(-6,-232);c.lineTo(-6,-156);c.closePath();c.fill();
  c.beginPath();c.moveTo(10,-232);c.lineTo(104,-232);c.quadraticCurveTo(160,-230,190,-156);c.lineTo(10,-156);c.closePath();c.fill();
  c.fillStyle='#FFF2B3';rr(-292,-122,22,34,10);c.fill();
  c.fillStyle='#FF3B3B';rr(272,-124,16,34,8);c.fill();
  if(o.beam){c.fillStyle='rgba(255,242,179,.22)';c.beginPath();c.moveTo(-292,-120);c.lineTo(-700,-190);c.lineTo(-700,-20);c.lineTo(-292,-90);c.closePath();c.fill()}
  c.fillStyle='rgba(0,0,0,.12)';c.fillRect(-290,-52,580,22);
  [[-190],[190]].forEach(([wx])=>{c.fillStyle='#14161B';c.beginPath();c.arc(wx,-36,52,0,7);c.fill();
    c.fillStyle='#B8BDC8';c.beginPath();c.arc(wx,-36,28,0,7);c.fill();
    c.strokeStyle='#14161B';c.lineWidth=6;c.beginPath();const a=(o.wheel||0);c.moveTo(wx+Math.cos(a)*26,-36+Math.sin(a)*26);c.lineTo(wx-Math.cos(a)*26,-36-Math.sin(a)*26);c.stroke()});
  c.restore();
}
/* ---------------- 학생 (뒷모습) ---------------- */
function student(x,y,s,o={}){
  const walk=o.walk||0,lean=o.lean||0,down=o.down==null?0:o.down,armsMode=o.arms||'phone',al=o.alpha==null?1:o.alpha,ghost=o.ghost;
  c.save();c.globalAlpha*=al;c.translate(x,y);c.scale(s,s);c.rotate(lean);
  const sw=Math.sin(walk),bob=Math.abs(sw)*8*(o.walking?1:0);
  const C=ghost?{skin:ghost,hair:ghost,hood:ghost,hood2:ghost,pack:ghost,pants:ghost,shoe:ghost}:{skin:'#F2C9A5',hair:'#1E1B22',hood:'#8C93A6',hood2:'#767D91',pack:'#F2A03D',pants:'#2B3350',shoe:'#F4F4F6'};
  // 다리
  [-1,1].forEach(d=>{const lift=o.walking?Math.max(0,Math.sin(walk+(d>0?0:Math.PI)))*34:0;
    c.fillStyle=C.pants;rr(d*34-30,-240-bob,60,240-lift+bob,22);c.fill();
    c.fillStyle=C.shoe;c.beginPath();c.ellipse(d*34,-14-lift,46,22,0,0,7);c.fill();
    if(!ghost){c.fillStyle='#C9CCD6';c.beginPath();c.ellipse(d*34,-4-lift,46,10,0,0,Math.PI);c.fill()}});
  // 몸통 (후드티)
  const ty=-250-bob;
  const armFn=(d)=>{
    c.save();c.translate(d*104,ty-170);
    let a;
    if(armsMode==='flail')a=d*(0.95+Math.sin(o.flail||0)*0.15);
    else a=d*(0.12+sw*0.28*(o.walking?1:0));
    if(armsMode==='phone'){c.rotate(d*0.30);c.fillStyle=C.hood;rr(-24,-4,48,120,22);c.fill();c.fillStyle=C.hood2;c.beginPath();c.arc(0,112,26,0,7);c.fill()}
    else{c.rotate(a);c.fillStyle=C.hood;rr(-24,-4,48,170,22);c.fill();c.fillStyle=C.skin;c.beginPath();c.arc(0,172,23,0,7);c.fill()}
    c.restore()};
  if(armsMode==='phone'){armFn(-1);armFn(1)}
  c.fillStyle=C.hood;rr(-100,ty-210,200,230,48);c.fill();
  c.fillStyle=C.hood2;c.fillRect(-4,ty-200,8,210);
  // 가방
  c.fillStyle=C.pack;rr(-80,ty-190,160,200,34);c.fill();
  if(!ghost){c.fillStyle='rgba(0,0,0,.14)';rr(-62,ty-110,124,70,22);c.fill();c.fillStyle='#1E1B22';c.fillRect(-72,ty-190,10,60);c.fillRect(62,ty-190,10,60)}
  if(armsMode!=='phone'){armFn(-1);armFn(1)}
  // 머리
  const hy=ty-232+down*18,tilt=down*0.0;
  c.fillStyle=C.hood2;c.beginPath();c.ellipse(0,ty-208,86,40,0,0,7);c.fill();
  c.fillStyle=C.skin;rr(-20,ty-224,40,34,10);c.fill();
  c.save();c.translate(0,hy-26);c.rotate(tilt);
  c.fillStyle=C.hair;c.beginPath();c.arc(0,-40,68,0,7);c.fill();
  if(!ghost){c.fillStyle='rgba(255,255,255,.10)';c.beginPath();c.ellipse(-20,-70,30,16,-.5,0,7);c.fill();
    c.fillStyle=C.skin;c.beginPath();c.ellipse(-70,-34,12,17,0,0,7);c.fill();c.beginPath();c.ellipse(70,-34,12,17,0,0,7);c.fill();
    if(o.ear){c.fillStyle='#fff';c.beginPath();c.arc(-70,-30,7,0,7);c.fill();c.beginPath();c.arc(70,-30,7,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(-70,-24);c.lineTo(-64,30);c.moveTo(70,-24);c.lineTo(64,30);c.stroke()}}
  c.restore();
  // 폰 빛 번짐
  if(armsMode==='phone'&&!ghost&&o.glow!==0){c.fillStyle='rgba(110,220,255,.20)';c.beginPath();c.ellipse(0,ty-60,120,70,0,0,7);c.fill()}
  c.restore();
}
function shadow(x,y,w,a=.25){c.save();c.fillStyle=`rgba(0,0,0,${a})`;c.beginPath();c.ellipse(x,y,w,w*0.18,0,0,7);c.fill();c.restore()}

/* ---------------- HUD / 효과 ---------------- */
function grid(a,col='110,200,255'){c.save();c.strokeStyle=`rgba(${col},${a})`;c.lineWidth=2;for(let x=0;x<=W;x+=90){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<=H;y+=90){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.restore()}
function scan(t,a,col='140,220,255'){const y=((t*600)%(H+300))-150;c.fillStyle=lin(0,y-120,0,y+10,[[0,`rgba(${col},0)`],[1,`rgba(${col},${a})`]]);c.fillRect(0,y-120,W,130)}
function tint(col,a){c.fillStyle=col.replace('A',a);c.fillRect(0,0,W,H)}
function vignette(r,g,b,a){const g2=c.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.75);g2.addColorStop(0,`rgba(${r},${g},${b},0)`);g2.addColorStop(1,`rgba(${r},${g},${b},${a})`);c.fillStyle=g2;c.fillRect(0,0,W,H)}
function brackets(x,y,w,h,col,a){c.save();c.strokeStyle=col;c.globalAlpha*=a;c.lineWidth=7;const l=46;
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([px,py,dx,dy])=>{c.beginPath();c.moveTo(px,py+dy*l);c.lineTo(px,py);c.lineTo(px+dx*l,py);c.stroke()});c.restore()}
function chip(label,u,col='#6FD3FF',y=200){ // 상단 분야 칩
  const a=eout(seg(u,0,.45));if(a<=0)return;
  c.save();c.globalAlpha*=a;c.translate(0,(1-a)*-26);
  c.font=`900 50px ${FONT}`;const w=c.measureText(label).width+90;
  c.fillStyle='rgba(8,16,34,.72)';rr(W/2-w/2,y-48,w,96,48);c.fill();
  c.strokeStyle=col;c.lineWidth=5;rr(W/2-w/2,y-48,w,96,48);c.stroke();
  c.fillStyle=col;c.beginPath();c.arc(W/2-w/2+40,y,10,0,7);c.fill();
  text(label,W/2+14,y+3,50,'#fff',900);c.restore()}
function caption(s,u,a0,a1,y=345){ // 자막
  const a=eout(seg(u,a0,a0+.3))*(1-seg(u,a1-.3,a1));if(a<=0)return;
  c.save();c.globalAlpha*=a;c.font=`700 56px ${FONT}`;
  const w=c.measureText(s).width+100;
  c.fillStyle='rgba(8,12,26,.66)';rr(W/2-w/2,y-52,w,104,30);c.fill();
  text(s,W/2,y+2,56,'#fff',700);c.restore()}
function countdown(u,col='#6FD3FF'){ // 3-2-1
  if(u<0||u>2.4)return;const n=3-Math.floor(u/.8),p=(u%.8)/.8;
  c.save();c.translate(W/2,1000);const sc=1.25-.25*eout(clamp(p*2.5));c.scale(sc,sc);
  c.globalAlpha*=1-seg(p,.75,1)*.8;
  c.strokeStyle=col;c.lineWidth=14;c.beginPath();c.arc(0,0,190,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-p));c.stroke();
  c.fillStyle='rgba(8,16,34,.55)';c.beginPath();c.arc(0,0,176,0,7);c.fill();
  text(String(n),0,10,260,'#fff',900);c.restore()}
function hudTag(s,x,y,col='#FF5A5A',a=1){c.save();c.globalAlpha*=a;c.font=`900 44px ${FONT}`;const w=c.measureText(s).width+60;
  c.fillStyle='rgba(30,6,10,.82)';rr(x-w/2,y-42,w,84,18);c.fill();c.strokeStyle=col;c.lineWidth=5;rr(x-w/2,y-42,w,84,18);c.stroke();text(s,x,y+2,44,col,900);c.restore()}
function warnBanner(s1,s2,u,col='#FF4B4B',by=0){
  const a=eout(seg(u,0,.35));if(a<=0)return;
  c.save();c.globalAlpha*=a;c.translate(0,(1-a)*40+by);
  c.fillStyle='rgba(32,6,10,.88)';rr(70,640,W-140,240,34);c.fill();
  c.strokeStyle=col;c.lineWidth=7;rr(70,640,W-140,240,34);c.stroke();
  const pulse=.55+.45*Math.sin(u*14);
  c.fillStyle=col;c.globalAlpha*=.4+.6*pulse;c.beginPath();c.arc(150,760,30,0,7);c.fill();c.globalAlpha=a;
  text('!',150,764,44,'#fff',900);
  text(s1,W/2+30,722,64,'#fff',900);text(s2,W/2+30,810,44,'#FFB4B4',700);c.restore()}

/* ---------------- 장면 ---------------- */
const SC=[0,4,14,24,36,46,56,59.0001]; // 시작 시각
const STU_X=540;
function sceneOpen(u,freeze){ // 정지 상태 거리 + 시뮬 효과 공통
}
function drawStreet(u,cfg){
  // cfg: stuY, stuS, walk, walking, down, arms, carX, carWheel, signal, lean
  street({day:'noon',signal:cfg.signal||'red'});
  if(cfg.carX!=null){shadow(cfg.carX,1352,320,.22);car(cfg.carX,1352,0.88,{wheel:cfg.carWheel||0,beam:false})}
  shadow(STU_X,cfg.stuY+2,90*cfg.stuS,.3);
  student(STU_X,cfg.stuY,cfg.stuS,{walk:cfg.walk||0,walking:cfg.walking,down:cfg.down==null?1:cfg.down,arms:cfg.arms||'phone',lean:cfg.lean||0});
}
/* S1 */
function S1(u){
  const wk=seg(u,0,2.2);
  const y=lerp(1880,1730,eio(wk)),s=lerp(1.18,1.0,eio(wk));
  drawStreet(u,{stuY:y,stuS:s,walk:u*9,walking:u<2.2,down:1,carX:u<2.2?lerp(1900,1500,seg(u,0,2.2)):1500});
  const f=seg(u,2.2,2.5);
  if(f>0){c.save();c.globalAlpha=f*.55;tint('rgba(30,70,140,A)',1);c.restore();grid(.18*f);scan(u,.16*f);vignette(10,30,80,.55*f)}
  // 시간 정지 링
  if(u>2.2){const p=seg(u,2.2,3.4);c.save();c.strokeStyle=`rgba(120,220,255,${.9*(1-p)})`;c.lineWidth=10;c.beginPath();c.arc(STU_X,1500,80+p*900,0,7);c.stroke();c.restore()}
  // AI 홀로그램 패널
  const pa=eout(seg(u,2.5,3.2));
  if(pa>0){c.save();c.translate(0,(1-pa)*30);c.globalAlpha*=pa;
    c.fillStyle='rgba(10,30,60,.72)';rr(150,880,W-300,210,28);c.fill();
    c.strokeStyle='#6FD3FF';c.lineWidth=5;rr(150,880,W-300,210,28);c.stroke();
    text('AI 시뮬레이션',W/2,950,62,'#fff',900);text('3초 뒤의 나를 미리 봅니다',W/2,1030,40,'#9FDFFF',700);
    brackets(150,880,W-300,210,'#6FD3FF',1);c.restore()}
  // 타이틀
  const ta=eout(seg(u,2.4,3.1));
  if(ta>0){c.save();c.globalAlpha*=ta;text('3초 뒤의 나',W/2,430-(1-ta)*30,150,'#fff',900);c.restore()}
  caption('잠깐. 3초만.',u,0.6,3.6,560);
}
/* S2 교통 */
function S2(u){
  const sim=seg(u,2.4,10);
  // 학생 이동
  const stuY=u<2.4?1730:lerp(1730,1520,eio(seg(u,2.4,5.2)));
  const stuS=lerp(1.0,.86,eio(seg(u,2.4,5.2)));
  const walking=u>2.4&&u<5.2;
  // 차: v0=900 감속 1350
  const t0=2.4; let cx=2400;
  const tb=3.7;
  if(u<=t0)cx=2400;
  else if(u<tb)cx=2400-900*(u-t0)*1.0-0; // 2400→1560? 아래 보정
  // 보정: 정지 x=760, 제동 시작 x=1060 (제동거리 300)
  const v0=900,xStop=960,xBrake=xStop+300,tStart=2.4,tBrk=tStart+(2400-xBrake)/v0; // ≈3.85
  if(u<=tStart)cx=2400;else if(u<tBrk)cx=2400-v0*(u-tStart);else{const d=u-tBrk,td=v0/1350;const dd=Math.min(d,td);cx=xBrake-(v0*dd-0.5*1350*dd*dd)}
  const braking=u>=tBrk&&u<tBrk+v0/1350;
  const shake=(u>tBrk+.55&&u<tBrk+1.0)?Math.sin(u*90)*10*(1-seg(u,tBrk+.55,tBrk+1.0)):0;
  c.save();c.translate(shake,shake*.4);
  drawStreet(u,{stuY,stuS,walk:u*9,walking,down:1,carX:cx,carWheel:u*18});
  // 스키드 마크 / 연기
  if(u>tBrk){const dd=Math.min(u-tBrk,v0/1350);c.fillStyle='rgba(20,20,20,.5)';c.fillRect(cx+280*.88,1340,(xBrake-cx),6)
    if(u>tBrk+.4){const sp=seg(u,tBrk+.4,tBrk+2);for(let i=0;i<6;i++){c.fillStyle=`rgba(230,230,235,${.25*(1-sp)})`;c.beginPath();c.arc(cx+240+i*30,1330-sp*140-i*8,40+i*14+sp*60,0,7);c.fill()}}}
  c.restore();
  // 시뮬레이션 틴트 (푸른 홀로그램 공간)
  const hudA=u<.4?seg(u,0,.4):1;
  c.save();c.globalAlpha=.38*hudA*(1-seg(u,9.2,10)*0);tint('rgba(20,60,130,A)',1);c.restore();
  grid(.14*hudA);scan(u,.16*hudA);
  // 예측 경로
