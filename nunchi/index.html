<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F5C">
<title>Nunchi · Korean that sounds right</title>
<meta name="description" content="Korean isn't only grammar — it's who you're talking to. Practice the relationship, not just the rule.">
<meta property="og:title" content="Nunchi · Korean that sounds right">
<meta property="og:description" content="Dial the listener, roleplay a real situation, then review what was correct but still odd.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F3F0;--surface:#fff;--surface2:#E9ECE7;
  --ink:#161C18;--muted:#5C6A62;--faint:#8A968E;
  --accent:#1F6F5C;--accent-soft:#DDEAE4;
  --alert:#A8452B;--alert-soft:#F3E2DC;
  --line:#D6DBD4;--line-strong:#B8C0B8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101310;--surface:#181D19;--surface2:#1F2621;
    --ink:#E7ECE6;--muted:#9DAAA1;--faint:#74827a;
    --accent:#5FBFA3;--accent-soft:#1B2F2A;
    --alert:#E08B6E;--alert-soft:#32211C;
    --line:#2A322C;--line-strong:#3C463F;
  }
}
:root[data-theme="dark"]{
  --ground:#101310;--surface:#181D19;--surface2:#1F2621;
  --ink:#E7ECE6;--muted:#9DAAA1;--faint:#74827a;
  --accent:#5FBFA3;--accent-soft:#1B2F2A;
  --alert:#E08B6E;--alert-soft:#32211C;
  --line:#2A322C;--line-strong:#3C463F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-weight:350;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:920px;margin:0 auto;padding-inline:18px;padding-block:0 80px}
h1,h2,h3{font-family:"Gowun Batang","Noto Serif KR",serif;margin:0;line-height:1.35;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",monospace}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
header{padding-block:34px 20px;border-bottom:1px solid var(--line-strong);display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
header h1{font-size:1.8rem;font-weight:700}
header h1 span{font-family:"Noto Sans KR",sans-serif;font-size:.8rem;font-weight:400;color:var(--muted);display:block;margin-top:5px}
header .hbtns{margin-left:auto;display:flex;gap:8px}
.badge{position:absolute;top:6px;right:2px;background:var(--accent);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:.62rem;line-height:1.5;padding:0 6px;border-radius:9px}
:root[data-theme="dark"] .badge{color:#0d1310}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#0d1310}}
.qcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);padding:18px 20px;border-radius:3px}
.qcard.err{border-left-color:var(--alert)}.qcard.odd{border-left-color:var(--accent)}
.qcard .scene-tag{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.08em;color:var(--faint);margin-bottom:8px}
.qcard .ask{font-size:1.15rem;line-height:1.6;margin:4px 0 14px}
.qcard .answer{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.qcard .answer[hidden]{display:none}
.qcard .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qcard .actions .spacer{flex:1}
.qsum{font-size:.8rem;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-bottom:14px}
button{font-family:inherit;font-size:.86rem;cursor:pointer;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 13px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] button.primary{color:#0d1310}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#0d1310}}
button.primary:hover{opacity:.9}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:3px;padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.6}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:5px}
/* tabs */
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-block:22px 26px;overflow-x:auto}
nav.tabs button{position:relative;border:none;border-bottom:2px solid transparent;background:none;border-radius:0;padding:11px 16px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
nav.tabs button small{display:block;font-size:.68rem;color:var(--faint);font-weight:400}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;border-radius:3px}
.card+.card{margin-top:16px}
.intro{color:var(--muted);font-size:.9rem;margin:0 0 18px;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
.row>.fit{flex:0 0 auto}
.row>.fit button{white-space:nowrap}
/* dial */
.dial output{display:block;text-align:center;font-size:.95rem;font-weight:500;margin-bottom:6px}
input[type=range]{accent-color:var(--accent);padding:0}
.ticks{display:flex;justify-content:space-between;font-size:.66rem;color:var(--faint);margin-top:4px}
.ladder{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.rung{background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;align-items:baseline}
.rung.on{background:var(--accent-soft)}
.rung .who{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.05em;color:var(--muted)}
.rung .ko{font-size:1rem;line-height:1.6}
.rung .style{font-size:.7rem;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.rung .why{font-size:.8rem;color:var(--muted);margin-top:4px}
/* chat */
.scene{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.scene button{font-size:.8rem;padding:6px 11px}
.scene button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#log{display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow-y:auto;padding:4px 2px 4px 0}
.msg{max-width:82%;padding:10px 14px;border-radius:3px;font-size:.95rem;line-height:1.65;white-space:pre-wrap}
.msg.ai{background:var(--surface2);align-self:flex-start;border-left:2px solid var(--accent)}
.msg.me{background:var(--accent-soft);align-self:flex-end}
.msg .romaji{display:block;font-size:.75rem;color:var(--muted);margin-top:5px;font-family:"IBM Plex Mono",monospace}
.composer{display:flex;gap:8px;margin-top:14px}
.composer input{flex:1}
.hint{font-size:.76rem;color:var(--faint);margin-top:8px}
/* cards */
.rcard{border:1px solid var(--line);background:var(--surface);border-left:3px solid var(--line-strong);padding:15px 17px;border-radius:3px}
.rcard+.rcard{margin-top:12px}
.rcard.err{border-left-color:var(--alert)}
.rcard.odd{border-left-color:var(--accent)}
.rcard .kind{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.rcard.err .kind{color:var(--alert)}
.rcard.odd .kind{color:var(--accent)}
.rcard .was{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--alert);font-size:.95rem}
.rcard .now{font-size:1rem;font-weight:500;margin-top:3px}
.rcard .alt{font-size:.85rem;color:var(--muted);margin-top:5px}
.rcard .why{font-size:.84rem;color:var(--muted);margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.kept{font-size:.75rem;color:var(--faint);margin-top:16px;font-family:"IBM Plex Mono",monospace}
/* key dialog */
.sheet{position:fixed;inset:0;background:rgba(10,14,11,.55);display:grid;place-items:center;padding:18px;z-index:20}
.sheet[hidden]{display:none}
.sheet .box{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;max-width:440px;width:100%;padding:24px}
.sheet h2{font-size:1.15rem;margin-bottom:10px}
.sheet p{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.sheet a{color:var(--accent)}
.status{font-size:.8rem;color:var(--muted);min-height:1.4em;margin-top:10px}
.status.bad{color:var(--alert)}
.demo-note{background:var(--surface2);border:1px dashed var(--line-strong);font-size:.78rem;color:var(--muted);padding:9px 12px;border-radius:3px;margin-bottom:16px}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;font-size:.78rem;color:var(--faint)}
footer a{color:var(--accent)}
@media (max-width:560px){
  .rung{grid-template-columns:1fr;gap:4px}
  .msg{max-width:92%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>눈치 Nunchi<span data-i18n="tagline"></span></h1>
  <div class="hbtns">
    <button id="langbtn" type="button" aria-label="Language · 언어"></button>
    <button id="keybtn" type="button"></button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button id="tab-dial" role="tab" aria-selected="true" aria-controls="p-dial"><span data-i18n="tabDial"></span></button>
  <button id="tab-chat" role="tab" aria-selected="false" aria-controls="p-chat"><span data-i18n="tabChat"></span></button>
  <button id="tab-review" role="tab" aria-selected="false" aria-controls="p-review"><span data-i18n="tabReview"></span></button>
  <button id="tab-queue" role="tab" aria-selected="false" aria-controls="p-queue"><span data-i18n="tabQueue"></span><b class="badge" id="queue-count" hidden></b></button>
</nav>

<!-- ── MODE 1 ───────────────────────────────── -->
<section class="panel" id="p-dial" role="tabpanel" aria-labelledby="tab-dial">
  <p class="intro" data-i18n="dialIntro"></p>
  <div class="card dial">
    <div class="row">
      <div style="flex:3 1 260px">
        <label for="dial-input" data-i18n="dialInputLabel"></label>
        <input id="dial-input" value="I'll be about 30 minutes late." autocomplete="off">
      </div>
      <div class="fit" style="flex:0 0 auto"><button id="dial-go" class="primary" type="button" data-i18n="dialGo"></button></div>
    </div>
    <div style="margin-top:16px">
      <output id="dial-label" for="dial-range"></output>
      <input type="range" id="dial-range" min="0" max="4" step="1" value="4">
      <div class="ticks"><span data-i18n="tickFriend"></span><span data-i18n="tickSenior"></span><span data-i18n="tickCoworker"></span><span data-i18n="tickStranger"></span><span data-i18n="tickBoss"></span></div>
    </div>
    <div class="ladder" id="dial-out"></div>
    <div class="status" id="dial-status"></div>
  </div>
</section>

<!-- ── MODE 2 ───────────────────────────────── -->
<section class="panel" id="p-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
  <p class="intro" data-i18n="chatIntro"></p>
  <div class="card">
    <div class="scene" id="scenes"></div>
    <div class="row" style="margin-bottom:14px">
      <div><label for="level" data-i18n="levelLabel"></label>
        <select id="level">
          <option value="1" data-i18n="lvl1"></option>
          <option value="2" selected data-i18n="lvl2"></option>
          <option value="3" data-i18n="lvl3"></option>
          <option value="4" data-i18n="lvl4"></option>
        </select>
      </div>
      <div class="fit"><button id="end-chat" type="button" data-i18n="endChat"></button></div>
    </div>
    <div id="log"></div>
    <div class="composer">
      <label for="say" style="position:absolute;left:-9999px" data-i18n="sayLabel"></label>
      <input id="say" data-i18n-ph="sayPh" autocomplete="off">
      <button id="send" class="primary" type="button" data-i18n="send"></button>
    </div>
    <p class="hint" data-i18n="chatHint"></p>
    <div class="status" id="chat-status"></div>
  </div>
</section>

<!-- ── MODE 3 ───────────────────────────────── -->
<section class="panel" id="p-review" role="tabpanel" aria-labelledby="tab-review" hidden>
  <p class="intro" data-i18n="reviewIntro"></p>
  <div id="cards"></div>
  <p class="kept" id="kept"></p>
  <div class="status" id="rev-status"></div>
</section>

<!-- ── MODE 4 · spaced review queue ─────────── -->
<section class="panel" id="p-queue" role="tabpanel" aria-labelledby="tab-queue" hidden>
  <p class="intro" data-i18n="queueIntro"></p>
  <p class="qsum" id="queue-sum"></p>
  <div id="queue"></div>
</section>

<footer>
  MVP · <span id="privacy"></span>
  <span data-i18n="builtFor"></span>
</footer>
</div>

<!-- key sheet -->
<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h2 data-i18n="sheetTitle"></h2>
    <p data-i18n="sheetP"></p>
    <label for="key" data-i18n="keyLabel"></label>
    <input id="key" type="password" placeholder="AIza…" autocomplete="off">
    <label for="model" style="margin-top:10px" data-i18n="modelLabel"></label>
    <input id="model" value="gemini-3.8-flash" autocomplete="off">
    <div class="row" style="margin-top:16px">
      <button id="save-key" class="primary" type="button" data-i18n="save"></button>
      <button id="close-key" type="button" data-i18n="close"></button>
      <button id="clear-key" type="button" data-i18n="forget"></button>
    </div>
    <p class="hint" style="margin-top:12px" data-i18n="sheetHint"></p>
  </div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);

/* Server proxy. Leave empty and every learner brings their own Gemini key
   (stage 1 — zero running cost). Fill it in with the deployed Edge Function URL
   and the key moves to the server, conversations get logged, and the API key
   panel disappears.  e.g. 'https://<project>.supabase.co/functions/v1/nunchi'  */
const PROXY = 'https://dxhmprqfgigljgbstqrg.supabase.co/functions/v1/nunchi';

/* Nunchi is a text app, so it needs a text model (ai.google.dev/gemini-api/docs/models).
   - 2.5 Flash is limited to past users, so a fresh key gets 404 on it.
   - gemini-omni-flash-preview shuts down 2026-10-22. Google names gemini-omni-1.1-flash as its
     replacement, but that is a video-generation model and cannot answer chat or JSON requests.
   Any of these names saved in this browser is sent as the current GA text model instead. */
const DEFAULT_MODEL = 'gemini-3.8-flash';
const NOT_FOR_TEXT = { 'gemini-2.5-flash':1, 'gemini-omni-flash-preview':1, 'gemini-omni-1.1-flash':1 };
const LS = { key:'nunchi.key', model:'nunchi.model', device:'nunchi.device', lang:'nunchi.lang', queue:'nunchi.queue' };
const store = {
  get k(){ try{ return localStorage.getItem(LS.key)||'' }catch(e){ return '' } },
  get m(){ let m; try{ m = localStorage.getItem(LS.model)||DEFAULT_MODEL }catch(e){ m = DEFAULT_MODEL } return NOT_FOR_TEXT[m] ? DEFAULT_MODEL : m },
  set(k,m){ try{ localStorage.setItem(LS.key,k); localStorage.setItem(LS.model,m) }catch(e){} },
  clear(){ try{ localStorage.removeItem(LS.key) }catch(e){} },
  get device(){
    try{
      let d = localStorage.getItem(LS.device);
      if(!d){ d = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem(LS.device, d); }
      return d;
    }catch(e){ return 'anon' }
  }
};

/* ── UI language (en / ko) ──────────────────── */
/* Learners get English; a Korean teacher (or a learner who prefers it) flips the whole UI to Korean.
   Static text is keyed by data-i18n, dynamic text goes through t(). The model's "why" lines follow the UI language. */
const T = {
  en: {
    tagline:'Korean that sounds right — not just correct.',
    keyBtn:'API key', langBtn:'한국어',
    tabDial:'Relationship dial<small>관계 다이얼</small>', tabChat:'Situation<small>상황 롤플레이</small>',
    tabReview:'Review cards<small>복기 카드</small>', tabQueue:'Review queue<small>복습 큐</small>',
    dialIntro:'Type one thing you want to say. See how it changes depending on <b>who is listening</b>. This is the part textbooks skip.',
    dialInputLabel:'What do you want to say? (English or Korean)', dialGo:'Show all five',
    tickFriend:'close friend', tickSenior:'senior', tickCoworker:'coworker', tickStranger:'stranger', tickBoss:'boss',
    working:'Working…',
    chatIntro:'A real situation you will actually be in. <b>Nothing gets corrected while you talk</b> — mistakes are collected and shown afterwards, so you can keep going.',
    levelLabel:'Your level · 급수', lvl1:'TOPIK 1 — beginner', lvl2:'TOPIK 2 — high beginner', lvl3:'TOPIK 3 — intermediate', lvl4:'TOPIK 4 — high intermediate',
    endChat:'End &amp; review · 대화 끝내기', sayLabel:'Your reply in Korean', sayPh:'한국어로 답해 보세요…', send:'Send',
    chatHint:"Tip: don't worry about mistakes. That's what the review cards are for.",
    sayFirst:'Say something first — then the review has material.',
    reviewIntro:'Two kinds of feedback. <b class="mono" style="color:var(--alert)">WRONG</b> is a grammar error. <b class="mono" style="color:var(--accent)">ODD</b> is correct grammar that a Korean would not say — the part no other app tells you.',
    reading:'Reading the conversation…', kindWrong:'WRONG', kindOdd:'ODD BUT CORRECT', or:'or',
    dropped: n => `${n} suggestion(s) dropped — they rewrote your sentence instead of fixing it.`,
    saved: n => `${n} card(s) saved to the review queue.`,
    exampleReview:'Example review from the clinic conversation.',
    nothing:'Nothing worth correcting in that conversation. 잘하셨어요.',
    queueIntro:'Your own sentences come back here on a schedule — tomorrow, then 3, 7, 14 and 30 days later. Say the repaired version out loud <b>before</b> you reveal it.',
    queueSum: (d,n) => `${d} due now · ${n} saved`,
    queueEmpty:'Nothing due right now. Finish a conversation and the review cards land here.',
    queueNext: d => `Next card comes back in ${d} day(s).`,
    reveal:'Show the fix', again:'Again', good:'Got it', remove:'Remove', yours:'You said',
    privacyLocal:"runs entirely in your browser. Your API key is stored only on this device (localStorage) and is sent only to Google's API.",
    privacyServer:'no sign-up needed. Conversations are stored anonymously so the lessons can improve.',
    builtFor:'Built for the <a href="https://soonryu74.github.io/">노모어매뉴얼</a> Nunchi project.',
    sheetTitle:'Connect a model',
    sheetP:'Nunchi runs on your own free Gemini API key. Get one at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> — it takes about a minute and costs nothing on the free tier.',
    keyLabel:'API key', modelLabel:'Model', save:'Save', close:'Close', forget:'Forget key',
    sheetHint:'Without a key you can still look around — the screens below are loaded with a worked example.',
    noKey:'Add an API key first (button at the top right) — the example below stays visible.',
    keyRejected:'That API key was rejected. Check it in the API key panel.',
    modelNotFound: m => `Model "${m}" not found for this key. Try another model name.`,
    reqFailed: s => `Request failed (${s}).`,
    empty:'The model returned nothing. Try again.', wrong:'Something went wrong.',
    whyLang:'plain English'
  },
  ko: {
    tagline:'맞는 한국어가 아니라, 자연스러운 한국어.',
    keyBtn:'API 키', langBtn:'English',
    tabDial:'관계 다이얼<small>Relationship dial</small>', tabChat:'상황 롤플레이<small>Situation</small>',
    tabReview:'복기 카드<small>Review cards</small>', tabQueue:'복습 큐<small>Review queue</small>',
    dialIntro:'하고 싶은 말을 한 줄 적어 보세요. <b>듣는 사람이 누구인지</b>에 따라 어떻게 달라지는지 보여 드려요. 교과서가 건너뛰는 부분이에요.',
    dialInputLabel:'무슨 말을 하고 싶으세요? (영어나 한국어)', dialGo:'다섯 가지 보기',
    tickFriend:'친한 친구', tickSenior:'선배', tickCoworker:'동료', tickStranger:'모르는 사람', tickBoss:'사장님',
    working:'생각 중…',
    chatIntro:'실제로 겪게 될 상황이에요. <b>대화 중에는 아무것도 고치지 않아요.</b> 실수는 모아 두었다가 끝난 뒤에 보여 드리니 편하게 이어 가세요.',
    levelLabel:'내 급수', lvl1:'TOPIK 1급 — 초급', lvl2:'TOPIK 2급 — 초급 상', lvl3:'TOPIK 3급 — 중급', lvl4:'TOPIK 4급 — 중급 상',
    endChat:'대화 끝내고 복기', sayLabel:'한국어 답변', sayPh:'한국어로 답해 보세요…', send:'보내기',

/* bilingual value: {en, ko} → current language; plain string passes through */
const L = v => (v && typeof v === 'object') ? (v[lang] || v.en) : v;

/* ── model call ─────────────────────────────── */
/* Gemini 3.x thinks by default and thought tokens count toward maxOutputTokens, so a
   220-token cap can return an empty reply. Thinking goes to "low" and the cap gets headroom;
   the system prompts already keep replies to 1-2 sentences. thinkingLevel is an error on
   pre-3 models, so a learner who picks one of those keeps the original config. */
function genConfig(model, schema){
  const g3 = /^gemini-3/.test(model);
  const cfg = schema
    ? { responseMimeType:'application/json', responseSchema:schema }
    : { maxOutputTokens: g3 ? 1024 : 220 };
  /* temperature is retired on 3.x (Google's migration list: drop temperature/top_p/top_k;
     going below 1.0 can cause looping), so it is only sent to older models. */
  if(g3) cfg.thinkingConfig = { thinkingLevel:'low' };
  else cfg.temperature = schema ? 0.4 : 0.8;
  return cfg;
}
async function ask(system, user, schema, meta){
  if(PROXY) return askProxy(system, user, schema, meta);
  const key = store.k;
  if(!key){ const e = new Error('no-key'); e.noKey = true; throw e; }
  const body = {
    systemInstruction:{ parts:[{text:system}] },
    contents:[{ role:'user', parts:[{text:user}] }],
    generationConfig: genConfig(store.m, schema)
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(store.m)}:generateContent`;
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json())?.error?.message || '' }catch(e){}
    throw new Error(res.status === 400 && /API key/i.test(detail) ? t('keyRejected')
      : res.status === 404 ? t('modelNotFound', store.m)
      : detail || t('reqFailed', res.status));
  }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).filter(Boolean).join('') || '';
  if(!text) throw new Error(t('empty'));
  return schema ? JSON.parse(text) : text.trim();
}
/* Stage 2 — the key lives on the server, so the browser sends only the conversation. */
async function askProxy(system, user, schema, meta){
  const res = await fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ mode: meta?.mode || 'chat', system, prompt:user, schema,
                           device: store.device, scene: meta?.scene, level: meta?.level })
  });
  let data = {};
  try{ data = await res.json() }catch(e){}
  if(!res.ok) throw new Error(data.error || t('reqFailed', res.status));
  if(!data.text) throw new Error(t('empty'));
  return schema ? JSON.parse(data.text) : String(data.text).trim();
}

function fail(el, err){
  el.className = 'status bad';
  el.textContent = err && err.noKey ? t('noKey') : (err?.message || t('wrong'));
}
function busy(el, msg){ el.className = 'status'; el.textContent = msg; }

const DIAL_SYSTEM = () => `You are a Korean 화계(speech level) coach for foreign learners. The user gives one message. Write how a Korean would really say it to five listeners, in this fixed order:

/* ── MODE 3 · review cards ──────────────────── */
const REVIEW_SYSTEM = () => `You review a foreign learner's Korean AFTER the conversation is over. Only the lines marked B: are theirs. Return at most 5 cards.

kind="wrong" — a real error: particle, ending, conjugation, wrong word.
kind="odd" — grammatical, but no Korean would say it that way: word order, missing apology or hedge, too blunt for the listener, unnatural collocation, wrong speech level for who they are talking to.

Prefer "odd" cards. Every app already marks errors; nobody tells learners that a correct sentence sounds rude or foreign. If a line is both, file the more useful one.

THE ONE RULE THAT MATTERS: give the learner their own sentence back, repaired. Change only the part that is broken. Never upgrade their vocabulary, never make the sentence longer or more formal than they were going for, never merge two of their sentences. If your fix does not reuse most of their words, it is wrong — drop the card instead.

Example of a good card:
  original 배가 아파요 어제부터
  fixed    어제부터 배가 아파요
  alternative 어제부터 배가 좀 아파요
  label    word order · 어순
  kind     odd
  why      Nothing here is ungrammatical, but Korean puts the time first. Trailing it sounds like you remembered halfway through.

"alternative" is one other thing a Korean might say — optional, and only if it is genuinely different. "why" is one or two sentences of ${t('whyLang')}, written to the learner. "label" is a short tag like "particle · 조사".`;

const revSchema = {
  type:'object',
  properties:{ cards:{ type:'array', maxItems:5, items:{
    type:'object',
    properties:{
      kind:{ type:'string', enum:['wrong','odd'] },
      label:{ type:'string' },
      original:{ type:'string' },
      fixed:{ type:'string' },
      alternative:{ type:'string' },
      why:{ type:'string' }
    },
    required:['kind','label','original','fixed','why'] } } },
  required:['cards']
};
/* Overcorrection guard — LLMs rewrite far more of a learner's sentence than the
   error needs. We compare the two sentences as bags of syllables, so putting the
   same words in the right order counts as no change (word order is exactly the
   kind of card we want to keep), while swapping in new vocabulary does. Anything
   that replaces more than 45% of what the learner actually wrote is dropped. */
function changeRatio(a, b){
  const bag = t => { const m = new Map();
    for(const ch of String(t||'').replace(/[\s.,!?~…·]/g,'')) m.set(ch, (m.get(ch)||0)+1);
    return m; };
  const A = bag(a), B = bag(b);
  if(!A.size) return 1;
  let shared = 0, total = 0;
  for(const ch of new Set([...A.keys(), ...B.keys()])){
    const x = A.get(ch)||0, y = B.get(ch)||0;
    shared += Math.min(x,y); total += Math.max(x,y);
  }
  return total ? 1 - shared/total : 1;
}
const REVIEW_EXAMPLE = [
  { kind:'odd', label:'word order · 어순', original:'배가 아파요 어제부터', fixed:'어제부터 배가 아파요', alternative:'어제부터 배가 좀 아파요', why:{ en:'Nothing here is ungrammatical. But Korean puts the time expression first, so trailing it sounds like an afterthought.', ko:'문법적으로 틀린 곳은 없어요. 하지만 한국어는 시간 표현을 앞에 두기 때문에 뒤에 붙이면 뒤늦게 생각난 말처럼 들려요.' } },
  { kind:'wrong', label:'particle · 조사', original:'저는 보험증이 없어요', fixed:'저는 보험증을 안 가져왔어요', alternative:'보험증을 집에 두고 왔어요', why:{ en:'없어요 says you do not own one at all. At a clinic you mean you did not bring it today.', ko:'"없어요"는 아예 갖고 있지 않다는 뜻이에요. 병원에서는 오늘 안 가져왔다는 말을 하려던 거죠.' } },
  { kind:'odd', label:'politeness · 화용', original:'빨리 해 주세요', fixed:'혹시 빨리 될까요?', alternative:'조금만 서둘러 주실 수 있을까요?', why:{ en:'주세요 is polite, but a bare request to hurry lands as pushy. Korean softens with 혹시 and a question.', ko:'"주세요"는 공손하지만 서두르라는 말을 그대로 하면 재촉하는 느낌이에요. 한국어는 "혹시"와 질문형으로 부드럽게 해요.' } }
];
let lastCards = REVIEW_EXAMPLE, lastKept = null, lastSaved = 0;
function cardHTML(c, cls){
  return `
    <div class="${cls} ${c.kind === 'wrong' ? 'err' : 'odd'}">
      <div class="kind">${c.kind === 'wrong' ? t('kindWrong') : t('kindOdd')} · ${esc(c.label||'')}</div>
      <div class="was">${esc(c.original)}</div>
      <div class="now">${esc(c.fixed)}</div>
      ${c.alternative ? `<div class="alt">${t('or')} · ${esc(c.alternative)}</div>` : ''}
      <div class="why">${esc(L(c.why))}</div>
    </div>`;
}
function renderCards(cards, kept){
  lastCards = cards; lastKept = kept;
  $('#cards').innerHTML = cards.length ? cards.map(c => cardHTML(c, 'rcard')).join('')
    : (kept != null ? `<div class="card">${t('nothing')}</div>` : '');
  $('#kept').textContent = kept != null
    ? t('dropped', kept) + (lastSaved ? ' · ' + t('saved', lastSaved) : '')
    : t('exampleReview');
}
$('#end-chat').addEventListener('click', async () => {
  const mine = turns.filter(t => t.role === 'me');
  if(!mine.length){ busy($('#chat-status'), t('sayFirst')); return; }
  showTab('tab-review');
  busy($('#rev-status'), t('reading'));
  try{
    const out = await ask(
      REVIEW_SYSTEM(),
      `Situation: ${scene.role}\n\n` + turns.map(t => (t.role === 'ai' ? 'A: ' : 'B: ') + t.text).join('\n'),
      revSchema, { mode:'review', scene: scene.id, level: $('#level').value });
    const all = out.cards || [];
    const keep = all.filter(c => changeRatio(c.original, c.fixed) <= 0.45);
    $('#rev-status').textContent = '';
    lastSaved = enqueue(keep, scene.id);
    renderCards(keep, all.length - keep.length);
  }catch(err){ fail($('#rev-status'), err); }
});

/* ── MODE 4 · spaced review queue ───────────── */
/* Every kept card goes into localStorage and comes back on a fixed ladder:
   first pass right away, then 1 → 3 → 7 → 14 → 30 days. "Again" drops the card
   back to the start and keeps it in today's pile; "Got it" climbs one step.
   No account, no server — a learner's queue lives on their own device. */
const STEPS = [1, 3, 7, 14, 30], DAY = 864e5;
function loadQueue(){ try{ const q = JSON.parse(localStorage.getItem(LS.queue) || '[]'); return Array.isArray(q) ? q : [] }catch(e){ return [] } }
function saveQueue(q){ try{ localStorage.setItem(LS.queue, JSON.stringify(q)) }catch(e){} }
function enqueue(cards, sceneId){
  const q = loadQueue(); let added = 0;
  for(const c of cards){
    const id = `${c.original}→${c.fixed}`;
    if(q.some(x => x.id === id)) continue;
    q.push({ id, kind:c.kind, label:c.label||'', original:c.original, fixed:c.fixed, alternative:c.alternative||'', why:c.why,
             scene:sceneId, step:0, reps:0, due:Date.now(), added:Date.now() });
    added++;
  }
  if(added) saveQueue(q);
  renderQueue();
  return added;
}
function grade(id, ok){
  const q = loadQueue(); const c = q.find(x => x.id === id);
  if(!c) return;
  c.reps = (c.reps||0) + 1;
  if(ok){ c.due = Date.now() + STEPS[Math.min(c.step, STEPS.length-1)] * DAY; c.step = Math.min(c.step + 1, STEPS.length-1); }
  else { c.step = 0; c.due = Date.now(); c.added = Date.now(); } // back to the start, end of today's pile
  saveQueue(q); qOpen = false; renderQueue();
}
function removeCard(id){ saveQueue(loadQueue().filter(x => x.id !== id)); qOpen = false; renderQueue(); }
let qOpen = false;
function renderQueue(){
  const q = loadQueue(), now = Date.now();
  const due = q.filter(c => c.due <= now).sort((a,b) => a.due - b.due || a.added - b.added);
  const badge = $('#queue-count');
  badge.hidden = !due.length; badge.textContent = due.length;
  $('#queue-sum').textContent = q.length ? t('queueSum', due.length, q.length) : '';
  if(!due.length){
    const next = q.length ? Math.max(1, Math.ceil((Math.min(...q.map(c => c.due)) - now) / DAY)) : 0;
    $('#queue').innerHTML = `<div class="card">${t('queueEmpty')}${next ? ' ' + t('queueNext', next) : ''}</div>`;
    return;
  }
  const c = due[0], sc = SCENES.find(s => s.id === c.scene);
  $('#queue').innerHTML = `
    <div class="qcard ${c.kind === 'wrong' ? 'err' : 'odd'}" data-id="${esc(c.id)}">
      <div class="scene-tag">${sc ? esc(sceneLabel(sc)) : ''}${c.label ? ' · ' + esc(c.label) : ''}</div>
      <div class="kind">${t('yours')}</div>
      <div class="ask">${esc(c.original)}</div>
      <div class="answer" id="q-answer" ${qOpen ? '' : 'hidden'}>
        <div class="now">${esc(c.fixed)}</div>
        ${c.alternative ? `<div class="alt">${t('or')} · ${esc(c.alternative)}</div>` : ''}
        <div class="why">${esc(L(c.why))}</div>
      </div>
      <div class="actions">
        ${qOpen
          ? `<button id="q-again" type="button">${t('again')}</button><button id="q-ok" class="primary" type="button">${t('good')}</button>`
          : `<button id="q-reveal" class="primary" type="button">${t('reveal')}</button>`}
        <span class="spacer"></span>
        <button id="q-del" type="button">${t('remove')}</button>
      </div>
    </div>`;
  const id = c.id;
  $('#q-del').addEventListener('click', () => removeCard(id));
  if(qOpen){
    $('#q-again').addEventListener('click', () => grade(id, false));
    $('#q-ok').addEventListener('click', () => grade(id, true));
  } else $('#q-reveal').addEventListener('click', () => { qOpen = true; renderQueue(); });
}

/* ── boot ───────────────────────────────────── */
applyLang();      // fills every data-i18n node, then re-renders the dynamic parts below
startScene();
renderCards(REVIEW_EXAMPLE, null);
dialLabel();
renderQueue();
</script>
<script src="/assets/credit.js" defer></script>
